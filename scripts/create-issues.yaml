  - title: "0.0.3 — Multilingual Baseline for Claims / Entities and Cross-Language Retrieval"
    body: |
      ## Backend Work

      - Add language-aware fields to `KnowledgeEntity` and `KnowledgeClaim` models
      - Implement transliteration-aware alias linking (e.g., "iPhone" → "아이폰")
      - Create cross-language retrieval API endpoints
      - Integrate ICU or cld3 for language detection
      - Add language-specific stemming/normalization

      ## Acceptance

      - [ ] `KnowledgeEntity` model has `language` field (ISO 639-1)
      - [ ] `KnowledgeClaim` model has `source_languages` list field
      - [ ] `/api/entities/search` supports cross-language queries
      - [ ] `/api/claims?source_language=ja` filters by language
      - [ ] Transliteration test suite passes (e.g., "Tokyo" → "東京")

      ## Labels

      `area:backend-api`, `area:nlp`, `type:task`, `0.0.3`
    labels:
      - area:backend-api
      - area:nlp
      - type:task
      - "0.0.3"

