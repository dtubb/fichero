# Per-project rules for the dev harness (fichero-builder/fichero_builder/check_tool.py `load`).
# Fichero is the first project; another project carries its own harness.toml with the same keys.
[check]
# The jail user's own tools, copied into the workroot by the owner-side set-up (nothing is read from the owner's home).
python = "/Users/Shared/fichero-worker/venv/bin/python"
path = "/Users/Shared/fichero-worker/bin:/Users/Shared/fichero-worker/venv/bin:/usr/bin:/bin:/usr/sbin:/sbin"
python_path = ["fichero-server/src", "fichero-cli/src", "fichero-mcp/src"]
base_path_env = "FICHERO_BASE_PATH"
ready = ["scripts/lane_ready_check.sh", "HEAD"]
base_ref = "origin/integration"
guard_glob = "scripts/check_*.py"
guard_timeout_s = 60
min_guards = 20
# Guards the nightly gate runs instead (reasons: pipeline/projects/fichero.toml [ladder.skip]).
guard_skip = [
  "check_closed_issues_landed", "check_unmerged_work", "check_merged_worktrees", "check_no_orphan_stashes",
  "check_coverage_ratchet", "check_embedded_engine_signing", "check_hang_ratchet", "check_mac_app_store_target",
  "check_release_staples_app", "check_sparkle_update_ready", "check_swiftlint_warning_ratchet",
  "check_test_plans_runnable", "check_engine_imports_bundled", "check_release_size_ratchet", "check_docs_paths",
]
contract_paths = ["fichero-server/src/"]
contract_guards = [
  "scripts/check_openapi_route_set_current.py", "scripts/check_contract_identity_current.py",
  "scripts/check_mcp_generated_current.py",
]
check_paths = [
  "scripts/", "harness.toml", ".github/", ".gitattributes", ".gitmodules", "pyproject.toml", "pytest.ini",
  "fichero-server/pyproject.toml", "fichero-server/pytest.ini", "fichero-cli/pyproject.toml", "fichero-mcp/pyproject.toml",
]
# red-on-base is owed only by engine/CLI/MCP Python; Swift or contract changes need a Lead build row, docs and specs neither.
red_paths = ["fichero-server/src/", "fichero-cli/src/", "fichero-mcp/src/"]
spec_dir = "docs/contributor_manual/specs"
test_globs = ["test_*.py", "*_test.py"]
# pytest runs with plugin autoload OFF, the pinned config, and only these plugins (module names in the worker venv).
pytest_config = "fichero-server/pyproject.toml"
pytest_plugins = ["anyio.pytest_plugin", "_hypothesis_pytestplugin", "langsmith.pytest_plugin", "pytest_timeout", "pytest_asyncio.plugin"]

[check.test_env]
FICHERO_FEATURE_TIER = "dev"
OMP_NUM_THREADS = "2"

[policy]
# Refused with a reason by the PreToolUse hook (fast feedback; the land step and the OS layer are the boundary).
# Each rule: a regex over the command text and the reason shown to the worker.
rules = [
  { re = '\bgit\s+stash\b', reason = "git stash is shared by every worktree; commit a WIP instead" },
  { re = '\bgit\s+push\b', reason = "workers never push; the land step pushes (main and integration are PR/land only)" },
  { re = '\bxcodebuild\b', reason = "xcodebuild quits the maintainer's running app; the manager builds" },
  { re = '\bpkill\b', reason = "pkill by pattern kills other agents' processes" },
  { re = '\bkillall\b', reason = "killall by pattern kills other agents' processes" },
  { re = '\bls\b[^|;&]*(&&|;|\|)[^|;&]*\brm\s+-\w*[rR]', reason = "an ls and an rm -r in one command wiped a directory once; list, then delete as separate steps" },
]
required_trailers = ["Directed-By: the maintainer", "Co-Authored-By: "]

# Workers and the ladder run as this second macOS user; a missing user REFUSES (no fallback to the owner's user).
# Owner set-up, once: sysadminctl -addUser fichero-worker (no admin); sudoers line `<owner> ALL=(fichero-worker) NOPASSWD: ALL`;
# mkdir /Users/Shared/fichero-worker (writable by both, files public data only); `claude` signed in as that user;
# a venv readable by it for [check].python (the owner's .venv under ~ is not); a world-readable bare mirror to clone from.
[jail]
user = "fichero-worker"
workroot = "/Users/Shared/fichero-worker"
owner_home = "/Users/danieltubb"   # what ~ means below when the probe runs as the worker
deny_read = ["~/.config/gh", "~/.ssh", "~/.claude", "~/Fichero Projects"]

[land]
branch = "integration"   # the branch the Lead pushes a green head to
# Regexes over every ADDED line and commit message; any hit refuses the land (the public/private boundary).
boundary = ['/Users/[A-Za-z0-9._-]+/', 'sk-ant-[A-Za-z0-9_-]{8,}', 'gh[ps]_[A-Za-z0-9]{20,}', 'BEGIN [A-Z ]*PRIVATE KEY']

[brief]
# Project rules put at the top of every cluster brief (scripts/harness_brief.py); project names belong here, not in code.
rules = """
Python is [check].python in harness.toml, run from fichero-server with PYTHONPATH=src. Messages end "Part of #N" + trailer "Directed-By: the maintainer" and Co-Authored-By. A spec-line commit is separate if a behaviour is in the spec.
LOAD: the machine is loaded. One pytest at a time, named files only (the ones you touch and the readers of what you change), OMP_NUM_THREADS=2; never a directory or the full suite.
RULES (earlier clusters were sent back for these):
- No reassuring prose (docstring, comment, commit message, spec line) without a test that proves it. State only what the code does.
- No "decided" / "ruled" / a date of a decision unless a ruling file or issue comment exists.
- Before changing a shared function, list every reader (grep), say what each does with the change, run those readers' tests. If a pinned derivation changes (test_derivation_version) re-pin in the SAME commit.
- A skipped issue ("stale", "not real") needs the grep/probe shown in your DONE message; never skip on a guess.
- Run scripts/check_test_assertions.py and ruff on changed files; if routes/contract change, regenerate with the official tool (AGENTS.md ~134), never hand-merge generated files; a new engine .py file -> scripts/regen_engine_embed_filelist.py.
- Test through the real route/action, not only the helper (a helper-only test passed once while the route 500'd).
"""

[spend]
# Caps the watcher enforces (dev-workflows.run.watch-tick). PLACEHOLDERS until the owner rules on the daily amount
# (owner ruling pending (d), 2026-11-01); a worker whose model has no price here does not start.
window = 200000
handoff_at = 0.85
session_usd = 10
day_usd = 40
silent_s = 1800
prices = { sonnet = [3, 15], opus = [15, 75], haiku = [1, 5] }

[models]
# One model per role (dev-workflows.models.by-config); a role whose provider is not in `providers` is a question for a
# person, never a fallback. `claude-code` = an interactive Claude Code session in a pane (the model is its /model name);
# `anthropic` and `omlx` are Pi providers (their models and prices live in Pi's models.json). Change by editing here.
providers = ["claude-code", "anthropic", "omlx"]
builder = { provider = "claude-code", model = "sonnet" }
reviewer = { provider = "claude-code", model = "opus" }
spec-writer = { provider = "claude-code", model = "opus" }
helper = { provider = "claude-code", model = "haiku" }
researcher = { provider = "claude-code", model = "sonnet" }
