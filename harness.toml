# Per-project rules for the dev harness (fichero-builder/fichero_builder/check_tool.py `load`).
# Fichero is the first project; another project carries its own harness.toml with the same keys.
[check]
# The jail user's own tools, copied into the workroot by the owner-side set-up (nothing is read from the owner's home).
python = "/Users/Shared/fichero-worker/venv/bin/python"
path = "/Users/Shared/fichero-worker/bin:/Users/Shared/fichero-worker/venv/bin:/usr/bin:/bin:/usr/sbin:/sbin"
python_path = ["fichero-server/src", "fichero-cli/src", "fichero-mcp/src", "fichero-builder"]
base_path_env = "FICHERO_BASE_PATH"
ready = ["scripts/lane_ready_check.sh", "--no-guards", "HEAD"]  # the guards rung runs every guard from the pinned copy
base_ref = "origin/integration"
max_commits = 100  # the most commits a lane may be ahead of origin/integration (lane_ready_check.sh reads it; the pinned copy's value judges)
guard_glob = "scripts/check_*.py"
guard_timeout_s = 60
min_guards = 20
parallel = 2   # speed 3 (manager 2026-11-02): two ladders at once when their batches share no file; 1 = one at a time
# Guards the nightly gate runs instead (reasons: pipeline/projects/fichero.toml [ladder.skip]).
guard_skip = [
  "check_closed_issues_landed", "check_unmerged_work", "check_merged_worktrees", "check_no_orphan_stashes",
  "check_coverage_ratchet", "check_embedded_engine_signing", "check_hang_ratchet", "check_mac_app_store_target",
  "check_release_staples_app", "check_sparkle_update_ready", "check_swiftlint_warning_ratchet",
  "check_test_plans_runnable", "check_engine_imports_bundled", "check_release_size_ratchet", "check_docs_paths",
]
contract_paths = ["fichero-server/src/"]
contract_guards = [
  "scripts/check_openapi_route_set_current.py", "scripts/check_contract_identity_current.py",
  "scripts/check_mcp_generated_current.py",
]
# A diff under the prefix runs the guard with `--since <base>` (its question about this range only, #6318). The whole-tree
# ratchet stays in guard_skip; swiftlint must be in [check].path for the worker (a copy in <workroot>/bin, like ruff).
since_guards = { "scripts/check_swiftlint_warning_ratchet.py" = "fichero/" }
check_paths = [
  "scripts/", "harness.toml", ".github/", ".gitattributes", ".gitmodules", "pyproject.toml", "pytest.ini",
  "fichero-server/pyproject.toml", "fichero-server/pytest.ini", "fichero-cli/pyproject.toml", "fichero-mcp/pyproject.toml",
  "fichero-builder/fichero_builder/lint.py",  # the ready check's lint ratchet: judges the batch, so a batch never edits the copy that judges it
]
# red-on-base is owed only by engine/CLI/MCP/Builder Python; Swift or contract changes need a Lead build row, docs and specs neither.
red_paths = ["fichero-server/src/", "fichero-cli/src/", "fichero-mcp/src/", "fichero-builder/fichero_builder/"]
# a Builder source change also runs the whole Builder tests dir in the green run (a broken old test slipped through once).
whole_tests = { "fichero-builder/fichero_builder/" = "fichero-builder/tests" }
spec_dir = "docs/contributor_manual/specs"
test_globs = ["test_*.py", "*_test.py"]
# speed batch 1 (manager 2026-11-03): rule classes the ladder decides by itself, each an `auto` journal row the manager audits
auto = ["red-on-base-trim-only", "red-on-base-timeout-only", "weakened-tests-of-a-deleted-module", "approval-carry-same-file-diffs", "guard-data-added-routes"]
routes_file = "fichero-server/tests/contracts/openapi.json"  # the engine's routes at head (guard-data-added-routes)
# manager 2026-11-04: a rebase whose ONLY conflict is the generated contract identity takes upstream's and re-bakes it with the
# project's own tool (#4705), never by hand
generated = ["fichero-server/src/fichero_server/api/contract_identity_generated.py",
             "fichero/fichero-api-client/Sources/FicheroAPIClient/ContractIdentity.generated.swift"]
rebake = ["{python}", "fichero-server/scripts/export_openapi_schema.py", "--bake-identity-from", "fichero-server/tests/contracts/openapi.json"]
rebake_issue = "#4705"
# pytest runs with plugin autoload OFF, the pinned config, and only these plugins (module names in the worker venv).
pytest_config = "fichero-server/pyproject.toml"
# manager 2026-11-02 (the Pro is CPU-bound): the engine pytest runs go to the M4 iMac, then the M1 Air (added 2026-11-03; each venv
# synced by `builder machines sync`); a runner unreachable or under 5 GiB free = an alert and the next, then the run here; the build
# rung and the guards that call git stay on the Pro
remote = ["imac:~/fichero-gate", "air:~/fichero-gate"]
# manager 2026-11-06 (the Pro at load 30 to 57 beside the owner's Xcode): "auto" sends every guard that names no git, subprocess, swiftlint
# or xcodebuild to the first runner in ONE ssh batch (no heavy lock there); a red there is re-run here before it counts
remote_guards = "auto"
# manager 2026-11-06 t88: the build rung on the M1 Air (its own derived data under ~/fichero-gate), so the Pro stays the owner's; the Air
# unreachable, or a red there that names no Swift source error, builds here as before
build_remote = "air:~/fichero-gate"
remote_min_free_gb = 6  # manager 2026-11-06: a runner under 6 GiB free is skipped
pytest_plugins = ["anyio.pytest_plugin", "_hypothesis_pytestplugin", "langsmith.pytest_plugin", "pytest_timeout", "pytest_asyncio.plugin"]

# A diff under build_paths compiles the app (build only, never a test run: a test run quits the owner's app) in the
# scratch tree, one build at a time on this machine (owner 2026-11-01). Derived data under the shared area so a
# second build reuses it; a stale incremental build is a known failure shape: delete the folder and run again.
build_paths = ["fichero/"]
# A landed batch touching these (the app, the engine, the CLI, MCP) earns the post-landing dev build; a harness-only batch builds none.
product_paths = ["fichero/", "fichero-server/src/", "fichero-cli/src/", "fichero-mcp/src/"]
# The Dev Local scheme: a compile of the app alone (Dev Embedded's "Embed Fichero Server" phase wants a briefcase-staged
# engine, which is the release lane's job, not a check). No signing: the worker user has no identity (review 1 M6, N7).
# The check tree is owner-made and read-only to the worker, and Package.resolved is tracked: resolution reads it and writes
# nothing (-disableAutomaticPackageResolution); a first real Swift check failed with exit 74 writing it (2026-11-01).
build = ["xcodebuild", "-project", "fichero/fichero.xcodeproj", "-scheme", "Fichero (Dev Local)",
         "-destination", "platform=macOS", "-derivedDataPath", "/Users/Shared/fichero-worker/derived", "-jobs", "4",
         "-skipPackagePluginValidation", "-disableAutomaticPackageResolution", "CODE_SIGNING_ALLOWED=NO", "build"]
build_timeout_s = 3600
# Only the owner's process takes this lock, so it lives in the owner's own state dir (~ expands), not the shared area.
build_lock = "~/.local/state/fichero-builder/build.lock"
# one STABLE tree for the build rung (and build-check), so xcodebuild is incremental (manager 2026-11-03: every ladder built
# in a new path, median 8.5 min); the jail user's workroot, beside its own derived dir, never the owner's Xcode data
build_tree = "/Users/Shared/fichero-worker/build-tree"
# The engine-owned repository check and land judge from: outside every home dir, owner-owned, world-readable (the jailed
# user reads its objects and the scratch worktrees made from it). Set up once: git clone --no-checkout <owner repo> here;
# chmod -R a+rX; a local `integration` branch; fetch landing branches into it by ref.
engine_repo = "/Users/Shared/fichero-engine"
[check.test_env]
FICHERO_FEATURE_TIER = "dev"
OMP_NUM_THREADS = "2"

[policy]
# Refused with a reason by the PreToolUse hook (fast feedback; the land step and the OS layer are the boundary).
# Each rule: a regex over the command text and the reason shown to the worker.
rules = [
  { re = '\bgit\s+stash\b', reason = "git stash is shared by every worktree; commit a WIP instead" },
  { re = '\bgit\s+push\b', reason = "workers never push; the land step pushes (main and integration are PR/land only)" },
  { re = '\bxcodebuild\b', reason = "xcodebuild quits the maintainer's running app; the manager builds" },
  { re = '\bpkill\b', reason = "pkill by pattern kills other agents' processes" },
  { re = '\bkillall\b', reason = "killall by pattern kills other agents' processes" },
  { re = '\bls\b[^|;&]*(&&|;|\|)[^|;&]*\brm\s+-\w*[rR]', reason = "an ls and an rm -r in one command wiped a directory once; list, then delete as separate steps" },
]
required_trailers = []
# owner 2026-11-05: ONE trailer naming who wrote the code; the old Directed-By passes on commits made before the ruling
trailer_one_of = ["Written-By: ", "Directed-By: the maintainer"]

# Workers and the ladder run as this second macOS user; a missing user REFUSES (no fallback to the owner's user).
# Owner set-up, once: sysadminctl -addUser fichero-worker (no admin); sudoers line `<owner> ALL=(fichero-worker) NOPASSWD: ALL`;
# mkdir /Users/Shared/fichero-worker (writable by both, files public data only); `claude` signed in as that user;
# a venv readable by it for [check].python (the owner's .venv under ~ is not); a world-readable bare mirror to clone from.
[jail]
user = "fichero-worker"
workroot = "/Users/Shared/fichero-worker"
owner_home = "/Users/danieltubb"   # what ~ means below when the probe runs as the worker
code_map = "~/.local/bin/jcodemunch-mcp"   # the owner's install; copied under workroot for the worker (dev-workflows.run.code-map); absent = the worker greps
deny_read = ["~/.config/gh", "~/.ssh", "~/.claude", "~/Fichero Projects"]

[land]
branch = "integration"   # the branch the Lead pushes a green head to
# `builder landed` keeps the pinned copy for the next check here, as pinned-<sha7> (absolute: a relative path lands inside the repo).
pinned_dir = "/Users/Shared/fichero-pinned"
# Regexes over every ADDED line and commit message; any hit refuses the land (the public/private boundary).
boundary = ['/Users/(?!Shared/)[A-Za-z0-9._-]+/', 'sk-ant-[A-Za-z0-9_-]{8,}', 'gh[ps]_[A-Za-z0-9]{20,}', 'BEGIN [A-Z ]*PRIVATE KEY']

[loop]
# manager 2026-11-04 (alerts 315, 316): the lanes the loop ticks, named; a lane not here (an old milestone lane in queue.json) never starts.
# Build-order milestones are taken only with feed_milestones = true: a lane is queued on purpose.
only = ["lane-sharing", "lane-onboard", "lane-ie", "harness-gen3", "harness-unblock", "dev-workflows", "spec-writer"]  # spec-writer: a Fable session writing specs (2026-11-06)
# owner 2026-11-06: two lanes' chains at once (the pool was one worker, so [check].parallel = 2 was never used)
lanes = 2
feed_milestones = false
# dev-workflows.run.loop-external-intake: an external lane is taken by itself at this many commits past the land branch, or when
# its oldest unlanded commit is this old, if its HEAD is a finished step; findings and LANDED go to its pane through `tell`
intake_commits = 8
intake_hours = 3
# tell = "<script> <pane> <text>"   # unset: the tracked `builder tell` (fichero_builder/tell.py)

[machines]
# dev-workflows.run.measure: test machines `builder measure` ships a lane's commit to (ssh host, the gate dir with venv/)
imac = { ssh = "imac", dir = "~/fichero-gate", min_free_gb = 5 }
m1air = { ssh = "air", dir = "~/fichero-gate", min_free_gb = 5 }   # the owner's M1 Air: any time
m4air = { ssh = "m4", dir = "~/fichero-gate", min_free_gb = 5 }    # the M4 Air: overnight only (owner rule), and a GUI session for the app

[queue]
# `builder queue run` (dev-workflows.tool.queue): how many `builder work` processes run at once; the ladder is one at a time regardless.
workers = 1

[brief]
# Project rules put at the top of every cluster brief (scripts/harness_brief.py); project names belong here, not in code.
rules = """
Python is [check].python in harness.toml, run from fichero-server with PYTHONPATH=src for engine tests, from fichero-builder with PYTHONPATH=. for Builder tests. Every commit: author Claude, message ends with its issue line ("This step owes" below says which) + ONE trailer, "Written-By: <the model that wrote it>" (owner 2026-11-05). A spec-line commit is separate if a behaviour is in the spec. No local paths or names in commits.
LOAD: the machine is loaded. One pytest at a time, each with its own --basetemp under [jail].workroot/bt-<name> and GIT_CONFIG_GLOBAL set to a scratch file, named files only (the ones you touch and the readers of what you change), OMP_NUM_THREADS=2; never a directory or the full suite; never xcodebuild.
RULES (earlier clusters were sent back for these):
- No reassuring prose (docstring, comment, commit message, spec line) without a test that proves it. State only what the code does.
- No "decided" / "ruled" / a date of a decision unless a ruling file or issue comment exists.
- Before changing a shared function, list every reader (grep), say what each does with the change, run those readers' tests. If a pinned derivation changes (test_derivation_version) re-pin in the SAME commit.
- A skipped issue ("stale", "not real") needs the grep/probe shown in your DONE message; never skip on a guess.
- Whenever you add a tool, a workflow node or a route, run the generators in the same commit: the capability reference (scripts/generate_capability_reference.py), the OpenAPI and MCP files (the official tool, AGENTS.md ~134); a stale one fails the ready check.
- Run scripts/check_test_assertions.py and ruff on changed files; if routes/contract change, regenerate with the official tool (AGENTS.md ~134), never hand-merge generated files; a new engine .py file -> scripts/regen_engine_embed_filelist.py.
- Test through the real route/action, not only the helper (a helper-only test passed once while the route 500'd).
- A commit that builds a spec behaviour carries the trailer line `Behaviour: <id>`, so the landing marks that line [OK].
- Find code with the jcodemunch tools (search_symbols, get_file_outline, get_symbol_source, find_references, search_text); Read only a file you edit.
- When every item is committed, end your turn with the exact line DONE <short sha of the branch head>; the loop ends on that line and on nothing else.
"""

[spend]
# Caps the watcher enforces (dev-workflows.run.watch-tick): 8 USD per worker session, 60 USD per day (owner ruling
# 2026-11-01 evening, raised from 5/20 after the day cap parked the product worker; notional under the Max login, not a
# bill). A worker whose model has no price here does not start.
window = 200000   # plain sonnet's window (owner 2026-11-02: every turn stays under 200k; handoffs often, cheap and reliable)
handoff_at = 0.85
handoff_tokens = 175000   # owner 2026-11-02: hand off here, an absolute count (a lane used 17M tokens for three steps on a 1M window)
session_usd = 8
day_usd = 60
silent_s = 1800
prices = { sonnet = [3, 15], opus = [15, 75], haiku = [1, 5] }

[models]
# One model per role (dev-workflows.models.by-config); a role whose provider is not in `providers` is a question for a
# person, never a fallback. `claude-code` = an interactive Claude Code session in a pane (the model is its /model name);
# `anthropic` and `omlx` are Pi providers (their models and prices live in Pi's models.json). Change by editing here.
providers = ["claude-code", "anthropic", "omlx"]
builder = { provider = "claude-code", model = "sonnet" }  # owner 2026-11-02: plain sonnet, the 200k window in [spend].window
reviewer = { provider = "claude-code", model = "opus", context = 200000 }  # its review cap is 40% of this at 3.5 bytes a token
# manager 2026-11-02 (6a): sonnet reviews by default; opus (`reviewer`) when a range touches these paths, and once per milestone
reviewer_fast = { provider = "claude-code", model = "sonnet", context = 200000 }
# owner 2026-11-06 (t28): these lanes' batches always get the full reviewer; half-done fast reviews cost them whole rounds
opus_lanes = ["lane-sharing"]
reviewer_paths = ["fichero-builder/", "scripts/harness_", "scripts/lane_ready_check.sh", "harness.toml"]
spec-writer = { provider = "claude-code", model = "opus" }
helper = { provider = "claude-code", model = "haiku" }
manager = { provider = "claude-code", model = "haiku" }  # reads alerts and answers them (dev-workflows.run.loop-roles)
researcher = { provider = "claude-code", model = "sonnet" }

[triage.labels]
# `builder triage --labels` (dev-workflows.tool.triage, rules in specs/harness/issues-and-labels.md): a label outside
# the closed set (step:N.M, type:bug|feature|task, priority:P0-P3, phase:R0-R6, needs-spec, needs-your-decision,
# needs-your-test, status:blocked) is reported and never deleted; this table says which label its issues get. A
# `spec:<stem>` value is a temporary hint `--milestones` turns into the spec's milestone and then removes from the issue.
# A label absent here maps to nothing. Edit here, not in code.
sharing = "spec:sharing-two-macs"
performance = "type:bug"
security = "type:bug"
needs-design = "needs-spec"
