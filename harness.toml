# #6390 (owner 2026-11-07): what the build rung never compiles, built once a day on build_remote (the Air; never this Mac), each
# with its own derived data there, red = an alert: the iOS app (macOS-only APIs in shared Swift broke it unseen) and the Swift
# test target (a missing import landed unseen). -derivedDataPath is replaced over there.
[check.daily_builds]
ios-sim = ["xcodebuild", "-project", "fichero/fichero.xcodeproj", "-scheme", "Fichero (Dev Local)", "-destination", "generic/platform=iOS Simulator",
           "-derivedDataPath", "derived", "-jobs", "4", "-skipPackagePluginValidation", "CODE_SIGNING_ALLOWED=NO", "build"]
tests = ["xcodebuild", "-project", "fichero/fichero.xcodeproj", "-scheme", "Fichero (Dev Local)", "-destination", "platform=macOS",
         "-derivedDataPath", "derived", "-jobs", "4", "-skipPackagePluginValidation", "CODE_SIGNING_ALLOWED=NO", "build-for-testing"]

