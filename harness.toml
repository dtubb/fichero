# Per-project rules for the dev harness (fichero-builder/fichero_builder/check_tool.py `load`).
# Fichero is the first project; another project carries its own harness.toml with the same keys.
[check]
# The jail user's own tools, copied into the workroot by the owner-side set-up (nothing is read from the owner's home).
python = "/Users/Shared/fichero-worker/venv/bin/python"
path = "/Users/Shared/fichero-worker/bin:/Users/Shared/fichero-worker/venv/bin:/usr/bin:/bin:/usr/sbin:/sbin"
python_path = ["fichero-server/src", "fichero-cli/src", "fichero-mcp/src", "fichero-builder"]
base_path_env = "FICHERO_BASE_PATH"
ready = ["scripts/lane_ready_check.sh", "--no-guards", "HEAD"]  # the guards rung runs every guard from the pinned copy
base_ref = "origin/integration"
max_commits = 100  # the most commits a lane may be ahead of origin/integration (lane_ready_check.sh reads it; the pinned copy's value judges)
guard_glob = "scripts/check_*.py"
guard_timeout_s = 60
min_guards = 20
parallel = 2   # speed 3 (manager 2026-11-02): two ladders at once when their batches share no file; 1 = one at a time
# Guards the nightly gate runs instead (reasons: pipeline/projects/fichero.toml [ladder.skip]).
guard_skip = [
  "check_closed_issues_landed", "check_unmerged_work", "check_merged_worktrees", "check_no_orphan_stashes",
  "check_coverage_ratchet", "check_embedded_engine_signing", "check_hang_ratchet", "check_mac_app_store_target",
  "check_release_staples_app", "check_sparkle_update_ready", "check_swiftlint_warning_ratchet",
  "check_test_plans_runnable", "check_engine_imports_bundled", "check_release_size_ratchet", "check_docs_paths",
]
contract_paths = ["fichero-server/src/"]
contract_guards = [
  "scripts/check_openapi_route_set_current.py", "scripts/check_contract_identity_current.py",
  "scripts/check_mcp_generated_current.py",
]
# A diff under the prefix runs the guard with `--since <base>` (its question about this range only, #6318). The whole-tree
# ratchet stays in guard_skip; swiftlint must be in [check].path for the worker (a copy in <workroot>/bin, like ruff).
since_guards = { "scripts/check_swiftlint_warning_ratchet.py" = "fichero/" }
check_paths = [
  "scripts/", "harness.toml", ".github/", ".gitattributes", ".gitmodules", "pyproject.toml", "pytest.ini",
  "fichero-server/pyproject.toml", "fichero-server/pytest.ini", "fichero-cli/pyproject.toml", "fichero-mcp/pyproject.toml",
  "fichero-builder/fichero_builder/lint.py",  # the ready check's lint ratchet: judges the batch, so a batch never edits the copy that judges it
]
# red-on-base is owed only by engine/CLI/MCP/Builder Python; Swift or contract changes need a Lead build row, docs and specs neither.
red_paths = ["fichero-server/src/", "fichero-cli/src/", "fichero-mcp/src/", "fichero-builder/fichero_builder/"]
# a Builder source change also runs the whole Builder tests dir in the green run (a broken old test slipped through once).
spec_dir = "docs/contributor_manual/specs"
test_globs = ["test_*.py", "*_test.py"]
# speed batch 1 (manager 2026-11-03): rule classes the ladder decides by itself, each an `auto` journal row the manager audits
auto = ["red-on-base-trim-only", "red-on-base-timeout-only", "weakened-tests-of-a-deleted-module", "approval-carry-same-file-diffs", "guard-data-added-routes"]
routes_file = "fichero-server/tests/contracts/openapi.json"  # the engine's routes at head (guard-data-added-routes)
# manager 2026-11-04: a rebase whose ONLY conflict is the generated contract identity takes upstream's and re-bakes it with the
# project's own tool (#4705), never by hand
generated = ["fichero-server/src/fichero_server/api/contract_identity_generated.py",
             "fichero/fichero-api-client/Sources/FicheroAPIClient/ContractIdentity.generated.swift"]
rebake = ["{python}", "fichero-server/scripts/export_openapi_schema.py", "--bake-identity-from", "fichero-server/tests/contracts/openapi.json"]
rebake_issue = "#4705"
# pytest runs with plugin autoload OFF, the pinned config, and only these plugins (module names in the worker venv).
pytest_config = "fichero-server/pyproject.toml"
# manager 2026-11-02 (the Pro is CPU-bound): the engine pytest runs go to the M4 iMac, then the M1 Air (added 2026-11-03; each venv
# synced by `builder machines sync`); a runner unreachable or under 5 GiB free = an alert and the next, then the run here; the build
# rung and the guards that call git stay on the Pro
remote = ["m4:~/fichero-gate", "imac:~/fichero-gate", "air:~/fichero-gate"]  # manager 2026-11-09 11:58: the M4 first (~/fichero-gate is a link to its Dev Disk), the Pro is the owner's Xcode machine
# manager 2026-11-06 (the Pro at load 30 to 57 beside the owner's Xcode): "auto" sends every guard that names no git, subprocess, swiftlint
# or xcodebuild to the first runner in ONE ssh batch (no heavy lock there); a red there is re-run here before it counts
remote_guards = "auto"
# manager 2026-11-06 t88: the build rung on the M1 Air (its own derived data under ~/fichero-gate), so the Pro stays the owner's; the Air
# unreachable, or a red there that names no Swift source error, builds here as before
build_remote = "m4:~/fichero-gate"  # 2026-11-09: the M4 (Xcode 27, derived data on its Dev Disk); the Air stays in remote above
remote_min_free_gb = 6  # manager 2026-11-06: a runner under 6 GiB free is skipped
pytest_plugins = ["anyio.pytest_plugin", "_hypothesis_pytestplugin", "langsmith.pytest_plugin", "pytest_timeout", "pytest_asyncio.plugin"]

# A diff under build_paths compiles the app (build only, never a test run: a test run quits the owner's app) in the
# scratch tree, one build at a time on this machine (owner 2026-11-01). Derived data under the shared area so a
# second build reuses it; a stale incremental build is a known failure shape: delete the folder and run again.
build_paths = ["fichero/"]
# A landed batch touching these (the app, the engine, the CLI, MCP) earns the post-landing dev build; a harness-only batch builds none.
product_paths = ["fichero/", "fichero-server/src/", "fichero-cli/src/", "fichero-mcp/src/"]
# The Dev Local scheme: a compile of the app alone (Dev Embedded's "Embed Fichero Server" phase wants a briefcase-staged
# engine, which is the release lane's job, not a check). No signing: the worker user has no identity (review 1 M6, N7).
# The check tree is owner-made and read-only to the worker, and Package.resolved is tracked: resolution reads it and writes
# nothing (-disableAutomaticPackageResolution); a first real Swift check failed with exit 74 writing it (2026-11-01).
build = ["xcodebuild", "-project", "fichero/fichero.xcodeproj", "-scheme", "Fichero (Dev Local)",
         "-destination", "platform=macOS", "-derivedDataPath", "/Users/Shared/fichero-worker/derived", "-jobs", "4",
         "-skipPackagePluginValidation", "-disableAutomaticPackageResolution", "CODE_SIGNING_ALLOWED=NO", "build"]
build_timeout_s = 3600
# Only the owner's process takes this lock, so it lives in the owner's own state dir (~ expands), not the shared area.
build_lock = "~/.local/state/fichero-builder/build.lock"
# one STABLE tree for the build rung (and build-check), so xcodebuild is incremental (manager 2026-11-03: every ladder built
# in a new path, median 8.5 min); the jail user's workroot, beside its own derived dir, never the owner's Xcode data
build_tree = "/Users/Shared/fichero-worker/build-tree"
# The engine-owned repository check and land judge from: outside every home dir, owner-owned, world-readable (the jailed
# user reads its objects and the scratch worktrees made from it). Set up once: git clone --no-checkout <owner repo> here;
# chmod -R a+rX; a local `integration` branch; fetch landing branches into it by ref.
engine_repo = "/Users/Shared/fichero-engine"

# every _scan_files test, the functional ones too, once a day on the loop's checkout (`builder daily-builds`), red = an alert
daily_tests = [
