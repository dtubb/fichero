				"#   - Debug:   skip embedding entirely. Developers run the engine externally",
				"",
				"#             (uvicorn / briefcase dev / scripts/startup) — the in-process",
				"",
				"#             EmbeddedBackendService probes 127.0.0.1:8765 first and uses",
				"",
				"#             whatever's there. Embedding on every Debug build (a) was slow",
				"",
				"#             (~10s of cp on the briefcase bundle) and (b) raced with",
				"",
				"#             concurrent briefcase rebuilds, leaving partial bundles.",
				"",
				"",
				"",
				"if [ \"${PLATFORM_NAME}\" != \"macosx\" ]; then",
				"",
				"  echo \"Skipping engine embed (non-macOS platform ${PLATFORM_NAME}); engine is embedded only in the macOS app bundle\"",
				"",
				"  exit 0",
				"",
				"fi",
				"",
				"",
				"",
				"if [ \"${FICHERO_EMBED_ENGINE}\" != \"YES\" ]; then",
				"",
				"  echo \"Skipping engine embed (FICHERO_EMBED_ENGINE=${FICHERO_EMBED_ENGINE}); use external backend on :8765\"",
				"",
				"  exit 0",
				"",
				"fi",
				"",
				"",
				"",
				"\"${SRCROOT}/../scripts/preflight-embedded-engine.sh\"",
				"ENGINE_SRC=\"${SRCROOT}/../fichero-server/build/fichero_server/macos/app/Fichero Server.app\"",
				"",
				"ENGINE_DST=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/Fichero Server.app\"",
				"APP_PLIST_FOR_STAMP=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Info.plist\"",
				"",
				"",
				"",
				"if [ ! -d \"$ENGINE_SRC\" ]; then",
				"",
				"  echo \"error: Fichero Server.app not found at $ENGINE_SRC — run 'briefcase build macOS --app server' in fichero-server/ first\" >&2",
				"",
				"  exit 1",
				"",
				"fi",
				"",
				"",
				"",
				"",
				"# Record WHAT was embedded in the host app's Info.plist, so the running app can",
				"# check the engine answering it against the engine this build shipped (2026-09-01:",
				"# a Dev Embedded build announced engine 2026.8.27 from a tree whose pyproject had",
				"# moved on, and nothing at runtime disagreed). Written BEFORE the embed-stamp skip",
				"# below: Xcode regenerates Info.plist every build, so a skipped embed would drop",
				"# the keys and the launch check would go quiet exactly when nothing changed.",
				"\"${SRCROOT}/../scripts/stamp_engine_version_into_app.sh\" \"$APP_PLIST_FOR_STAMP\" \"$ENGINE_SRC\"",
				"",
				"# Skip when the staged engine hasn't changed since the last embed —",
				"# the phase always runs (the input filelist snapshot rots), so the",
				"# stamp is what keeps unchanged builds fast.",
				"STAMP=\"$ENGINE_DST.embed-stamp\"",
				"if [ -f \"$STAMP\" ] && [ -d \"$ENGINE_DST\" ] && [ -z \"$(find \"$ENGINE_SRC\" -newer \"$STAMP\" -print -quit)\" ]; then",
				"  echo \"Embedded engine current (stamp); skipping embed + sign\"",
				"  exit 0",
				"fi",
				"echo \"Embedding engine: $ENGINE_SRC -> $ENGINE_DST\"",
				"",
				"rm -rf \"$ENGINE_DST\" \"$STAMP\"",
				"",
				"mkdir -p \"$(dirname \"$ENGINE_DST\")\"",
				"",
				"cp -R \"$ENGINE_SRC\" \"$ENGINE_DST\"",
				"\"${SRCROOT}/../scripts/clean-embedded-engine.sh\" \"$ENGINE_DST\"",
				"",
				"",
				"",
				"# ── Rung 1 (2026-08-08): sign the embedded engine INTO the app's sandbox ──",
				"#",
				"# Every config is sandboxed since 2026-07-29, but this phase copied the engine",
				"# WITHOUT signing it. Two live failures follow from that one omission:",
				"#   - the engine is not part of the app's sandbox identity, so app-scoped",
				"#     bookmarks never resolve (NSCocoaError 259 on every grant), and",
				"#   - it keeps Briefcase's hardened-runtime signature with NO entitlements, so",
				"#     a runtime-extracted pdfium is refused by library validation (#4555).",
				"#",
				"# Mirrors the MAS phase's rules: sign IN this phase (Xcode's CodeSign runs",
				"# after and seals the outer app), NEVER --deep (it re-signs nested code with",
				"# the PARENT's entitlements), entitlements are the MAS pair {app-sandbox,",
				"# inherit} — proven by the #3746 spike to run the full engine — and the pair",
				"# must never travel with get-task-allow (aborts an inherit child, #3952).",
				"# fm-bridge is signed too: a nested executable spawned by a sandboxed engine",
				"# needs the same pair or the system kills it at exec (the MAS 90296 lesson).",
				"ENGINE_ENTITLEMENTS=\"${SRCROOT}/fichero/FicheroEngineEmbedded.entitlements\"",
				"if [ ! -f \"$ENGINE_ENTITLEMENTS\" ]; then",
				"  echo \"error: engine entitlements not found at $ENGINE_ENTITLEMENTS\" >&2",
				"  exit 1",
				"fi",
				"IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"",
				"[ -n \"$IDENTITY\" ] || IDENTITY=\"-\"",
				"FM_BRIDGE=\"$ENGINE_DST/Contents/Resources/app/fichero_server/resources/bin/fm-bridge\"",
				"if [ -f \"$FM_BRIDGE\" ]; then",
				"  codesign --force --sign \"$IDENTITY\" --entitlements \"$ENGINE_ENTITLEMENTS\" \"$FM_BRIDGE\" || {",
				"    echo \"error: failed to sign fm-bridge with the sandbox pair\" >&2; exit 1; }",
				"fi",
				"codesign --force --sign \"$IDENTITY\" --entitlements \"$ENGINE_ENTITLEMENTS\" \"$ENGINE_DST\" || {",
				"  echo \"error: failed to sign the embedded engine with the sandbox pair\" >&2; exit 1; }",
				"if ! codesign --verify --strict \"$ENGINE_DST\" >/dev/null 2>&1; then",
				"  echo \"error: embedded engine signature is invalid after signing\" >&2",
				"  exit 1",
				"fi",
				"if ! codesign --display --entitlements - \"$ENGINE_DST\" 2>&1 | grep -q \"com.apple.security.inherit\"; then",
				"  echo \"error: embedded engine is missing com.apple.security.inherit\" >&2",
				"  exit 1",
				"fi",
				"if codesign --display --entitlements - \"$ENGINE_DST\" 2>&1 | grep -q \"com.apple.security.get-task-allow\"; then",
				"  echo \"error: embedded engine carries get-task-allow — incompatible with inherit; the child would abort (#3952)\" >&2",
				"  exit 1",
				"fi",
				"echo \"  embedded engine signed with {app-sandbox, inherit} as $IDENTITY\"",
				"touch \"$STAMP\"",
				"",
			);
		};
