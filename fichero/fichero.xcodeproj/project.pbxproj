		CC0011223344556677889903 /* Embed Fichero Engine */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Embed Fichero Engine";
			shellPath = /bin/sh;
			shellScript = (
				"# Embed the briefcase-built engine into Fichero.app/Contents/Resources/.",
				"",
				"# Behavior:",
				"",
				"#   - Release: engine is required; abort the build if missing.",
				"",
				"#   - Debug:   skip embedding entirely. Developers run the engine externally",
				"",
				"#             (uvicorn / briefcase dev / scripts/startup) — the in-process",
				"",
				"#             EmbeddedBackendService probes 127.0.0.1:8765 first and uses",
				"",
				"#             whatever's there. Embedding on every Debug build (a) was slow",
				"",
				"#             (~10s of cp on the briefcase bundle) and (b) raced with",
				"",
				"#             concurrent briefcase rebuilds, leaving partial bundles.",
				"",
				"",
				"",
				"if [ \"${PLATFORM_NAME}\" != \"macosx\" ]; then",
				"",
				"  echo \"Skipping engine embed (non-macOS platform ${PLATFORM_NAME}); engine is embedded only in the macOS app bundle\"",
				"",
				"  exit 0",
				"",
				"fi",
				"",
				"",
				"",
				"if [ \"${FICHERO_EMBED_ENGINE}\" != \"YES\" ]; then",
				"",
				"  echo \"Skipping engine embed (FICHERO_EMBED_ENGINE=${FICHERO_EMBED_ENGINE}); use external backend on :8765\"",
				"",
				"  exit 0",
				"",
				"fi",
				"",
				"",
				"",
				"ENGINE_SRC=\"${SRCROOT}/../fichero-engine/build/engine/macos/app/Fichero Engine.app\"",
				"",
				"ENGINE_DST=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/Fichero Engine.app\"",
				"",
				"",
				"",
				"if [ ! -d \"$ENGINE_SRC\" ]; then",
				"",
				"  echo \"error: Fichero Engine.app not found at $ENGINE_SRC — run 'briefcase build macOS --app engine' in fichero-engine/ first\" >&2",
				"",
				"  exit 1",
				"",
				"fi",
				"",
				"",
				"",
				"echo \"Embedding engine: $ENGINE_SRC -> $ENGINE_DST\"",
				"",
				"rm -rf \"$ENGINE_DST\"",
				"",
				"mkdir -p \"$(dirname \"$ENGINE_DST\")\"",
				"",
				"cp -R \"$ENGINE_SRC\" \"$ENGINE_DST\"",
				"\"${SRCROOT}/../scripts/clean-embedded-engine.sh\" \"$ENGINE_DST\"",
				"",
				"",
			);
		};
