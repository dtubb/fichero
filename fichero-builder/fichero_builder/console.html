<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Console</title>
<style>
:root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --row:#f5f5f7; --accent:#0a64d6; --red:#c9302c; --green:#2a8a3e; --amber:#b26b00; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#98989d; --line:#38383a; --row:#2c2c2e; --accent:#4ea1ff; --red:#ff6961; --green:#5dd879; --amber:#ffb340; } }
* { box-sizing:border-box }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:13px -apple-system, system-ui, sans-serif }
header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px }
header h1 { font-size:17px; margin:0 12px 0 0 }
.muted { color:var(--muted) }
button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--row); color:var(--fg); cursor:pointer }
button:hover { border-color:var(--accent) }
nav button[aria-pressed=true] { background:var(--accent); color:#fff; border-color:var(--accent) }
table { width:100%; border-collapse:collapse }
th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top }
th { font-weight:600; color:var(--muted); font-size:12px }
tr.lane { cursor:pointer } tr.lane:hover { background:var(--row) }
.sub td { background:var(--row) }
.state-running,.state-sent,.state-checking,.state-reviewing { color:var(--accent) } .state-landed,.state-done { color:var(--green) }
.state-blocked { color:var(--red) } .state-queued,.state-idle { color:var(--muted) } .state-working { color:var(--accent) }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:8px; margin:8px 0 16px }
.card { border:1px solid var(--line); border-left:4px solid var(--red); border-radius:6px; padding:8px }
.card .what { margin:4px 0 8px; word-break:break-word }
.stats { display:flex; flex-wrap:wrap; gap:16px; margin:8px 0 }
.stats div b { display:block; font-size:16px }
section { margin-bottom:20px; overflow-x:auto }
h2 { font-size:14px; margin:12px 0 6px }
pre { white-space:pre-wrap; word-break:break-word; margin:0; font-size:12px }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { html, render, useState, useEffect } from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";
const TOKEN = "__TOKEN__";

async function act(verb, args = {}) {
  const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Builder-Token": TOKEN },
                                         body: JSON.stringify({ verb, args }) });
  const j = await r.json();
  if (!j.ok) alertBox(j.error);
}
let alertBox = () => {};

function useStatus() {
  const [st, setSt] = useState(null);
  useEffect(() => {
    let timer = null;
    const load = () => fetch("/api/status").then(r => r.json()).then(setSt).catch(() => {});
    load();
    const es = new EventSource("/api/events");
    es.onmessage = () => { clearTimeout(timer); timer = setTimeout(load, 300); };  // live: every journal row refreshes the view
    const slow = setInterval(load, 15000);  // elapsed times tick even when the journal is quiet
    return () => { es.close(); clearInterval(slow); };
  }, []);
  return st;
}

const fmt = s => s == null ? "-" : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`;

function Lanes({ lanes }) {
  const [open, setOpen] = useState({});
  if (!lanes.length) return html`<p class="muted">No lanes yet.</p>`;
  return html`<table>
    <tr><th></th><th>lane</th><th>step</th><th>state</th><th>doing now</th><th>elapsed</th><th>turns</th><th>tokens</th><th>USD</th><th></th></tr>
    ${lanes.map(l => html`
      <tr class="lane" onClick=${() => setOpen({ ...open, [l.lane]: !open[l.lane] })}>
        <td>${open[l.lane] ? "▾" : "▸"}</td><td><b>${l.lane}</b>${l.kind === "external" ? html` <span class="muted">external</span>` : ""}</td>
        <td>${l.step} <span class="muted">${l.title}</span></td>
        <td class=${"state-" + l.state}>${l.state}${l.paused ? " (paused)" : ""}</td>
        <td><div>${l.doing}</div><div class="muted">${l.last_commit}</div></td>
        <td>${fmt(l.elapsed_s)}</td><td>${l.turns ?? "-"}</td><td>${l.tokens ?? "-"}</td><td>${l.usd.toFixed(2)}</td>
        <td onClick=${e => e.stopPropagation()}>
          ${l.paused ? html`<button onClick=${() => act("resume", { lane: l.lane })}>Resume</button>`
                     : html`<button onClick=${() => act("pause", { lane: l.lane })}>Pause</button>`}
          <button onClick=${() => confirm(`Stop ${l.lane}? The worker commits what is green and its session ends.`) && act("stop", { lane: l.lane })}>Stop</button>
        </td>
      </tr>
      ${open[l.lane] && l.steps.map(s => html`<tr class="sub"><td></td><td></td><td>${s.step}</td><td class=${"state-" + s.state}>${s.state}</td>
        <td colspan="6">${s.issues.map(n => "#" + n).join(", ")} <span class="muted">${s.why}</span></td></tr>`)}
    `)}
  </table>`;
}

function Alerts({ alerts }) {
  if (!alerts.length) return html`<p class="muted">No open alerts.</p>`;
  return html`<div class="cards">${alerts.map(a => html`<div class="card">
    <div><b>${a.id}</b> <span class="muted">${a.ts}</span></div>
    <div class="what">${a.what}</div>
    ${(a.actions || []).map(x => html`<button onClick=${() => act("alert", { id: a.id, action: x })}>${x}</button> `)}
  </div>`)}</div>`;
}

function Milestones({ st }) {
  const [data, setData] = useState(null);
  const [open, setOpen] = useState({});
  const [pick, setPick] = useState({});
  const load = () => fetch("/api/milestones").then(r => r.json()).then(setData);
  useEffect(() => { load(); }, [st.console.length]);  // a refresh's console row reloads the cache
  const refresh = () => fetch("/api/refresh", { method: "POST", headers: { "X-Builder-Token": TOKEN } });
  if (!data) return html`<p class="muted">Loading…</p>`;
  const running = st.lanes.filter(l => !l.done).length;
  const room = Math.max(0, st.loop_lanes - running);
  const picked = Object.keys(pick).filter(k => pick[k]);
  const start = names => names.slice(0, room).forEach(n => act("start-milestone", { milestone: n }));
  return html`
    <div class="stats">
      <button onClick=${refresh}>Refresh from GitHub</button>
      <span class="muted">${data.ts ? `read ${data.ts}` : "never read: press Refresh"}${data.gh_ok === false ? " (gh failed)" : ""}</span>
      <span class="muted">${running} lane(s) running of ${st.loop_lanes}</span>
      ${picked.length > 0 && html`<button disabled=${!room} onClick=${() => start(picked)}>Start ${Math.min(picked.length, room)} lane(s)</button>`}
    </div>
    ${["In order", "Then", "Parked"].map(sec => html`<h2>${sec}</h2><table>
      <tr><th></th><th></th><th>milestone</th><th>open</th><th>closed</th><th>status</th><th>steps</th><th></th></tr>
      ${data.milestones.filter(m => m.section === sec).map(m => html`
        <tr class="lane" onClick=${() => setOpen({ ...open, [m.name]: !open[m.name] })}>
          <td onClick=${e => e.stopPropagation()}>${m.startable ? html`<input type="checkbox" checked=${!!pick[m.name]} onChange=${e => setPick({ ...pick, [m.name]: e.target.checked })} />` : ""}</td>
          <td>${m.steps.length || m.issues.length ? (open[m.name] ? "▾" : "▸") : ""}</td>
          <td><b>${m.name}</b> ${m.lane && html`<span class="state-running">lane ${m.lane}</span>`}</td>
          <td>${m.open ?? "-"}</td><td>${m.closed ?? "-"}</td>
          <td class="muted">${m.counts ? Object.entries(m.counts).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(" · ") : ""}</td>
          <td>${m.steps.map(s => html`<span class=${"state-" + ({ done: "landed", running: "running", question: "blocked", next: "sent" }[s.state] || "queued")} title=${s.title}>${s.step} </span>`)}</td>
          <td onClick=${e => e.stopPropagation()}>${m.startable ? html`<button disabled=${!room} onClick=${() => start([m.name])}>Start lane</button>` : m.held_by ? html`<span class="muted">${m.held_by}</span>` : ""}</td>
        </tr>
        ${open[m.name] && html`
          ${m.steps.map(s => html`<tr class="sub"><td></td><td></td><td>${s.step} ${s.title}</td><td colspan="2" class=${"state-" + s.state}>${s.state}</td><td>${s.status || html`<span class="muted">no issues</span>`}</td><td colspan="2">${s.issues.map(n => "#" + n).join(", ")}</td></tr>`)}
          ${m.questions.map(q => html`<tr class="sub"><td></td><td></td><td colspan="6" style="color:var(--amber)">${q}</td></tr>`)}
          ${m.issues.map(i => html`<tr class="sub"><td></td><td></td><td>#${i.number} ${i.title}</td><td colspan="2">${i.step ? "step " + i.step : html`<span class="muted">no step</span>`}</td><td>${i.status} <span class="muted">${i.where}</span></td><td colspan="2" class="muted">${i.labels.join(", ")}</td></tr>`)}
        `}
      `)}
    </table>`)}`;
}

function App() {
  const st = useStatus();
  const [msg, setMsg] = useState("");
  const [tab, setTab] = useState(location.hash.slice(1) || "lanes");
  const go = t => { setTab(t); location.hash = t; };
  alertBox = setMsg;
  if (!st) return html`<p class="muted">Loading…</p>`;
  const build = [...st.console].reverse().find(r => r.verb === "build");
  return html`
    <header>
      <h1>Builder</h1>
      <nav>${["lanes", "milestones"].map(t => html`<button aria-pressed=${tab === t} onClick=${() => go(t)}>${t[0].toUpperCase() + t.slice(1)}</button> `)}</nav>
      <button onClick=${() => act("build")}>Build</button>
      ${build && html`<span class="muted">build ${build.state}${build.state === "ended" ? (build.ok ? ": ok" : ": failed") : "…"}</span>`}
      ${st.loop_on ? html`<span class="muted">Loop is on (heartbeat ${st.heartbeat})</span> <button onClick=${() => act("loop-stop")}>Stop loop</button>`
                   : html`<span style="color:var(--amber)">Loop is off: lanes are not fed or landed automatically.</span> <button onClick=${() => act("loop-start")}>Start loop</button>`}
      ${msg && html`<span style="color:var(--red)">${msg} <button onClick=${() => setMsg("")}>×</button></span>`}
    </header>
    <div class="stats">
      <div><span class="muted">last check</span><b>${st.last_check ? (st.last_check.ok ? "green" : "red") : "-"}</b><span class="muted">${st.last_check?.ts || ""}</span></div>
      <div><span class="muted">last review</span><b>${st.last_review ? st.last_review.detail || "-" : "-"}</b><span class="muted">${st.last_review?.ts || ""}</span></div>
      <div><span class="muted">last landing</span><b>${st.last_land ? String(st.last_land.sha).slice(0, 9) : "-"}</b><span class="muted">${st.last_land?.ts || ""}</span></div>
      <div><span class="muted">closed today</span><b>${st.issues_closed_today.length}</b></div>
      <div><span class="muted">spend today</span><b>$${st.spend_today_usd.toFixed(2)}</b></div>
    </div>
    <section><h2>Alerts</h2><${Alerts} alerts=${st.open_alerts} /></section>
    ${tab === "milestones" ? html`<section><${Milestones} st=${st} /></section>` : html`<section><h2>Lanes</h2><${Lanes} lanes=${st.lanes} /></section>`}
    <section><h2>Console actions</h2><table>${[...st.console].reverse().map(r => html`<tr><td class="muted">${r.ts}</td><td>${r.who}</td><td>${r.verb}</td><td>${r.state}${r.rc != null ? ` (exit ${r.rc})` : ""}</td><td><pre>${r.detail || ""}</pre></td></tr>`)}</table></section>
  `;
}
render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
