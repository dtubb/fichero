<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichero</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas; color: CanvasText;
    }
    main { max-width: 30rem; padding: 2rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { color: color-mix(in srgb, CanvasText 65%, Canvas); }
    .note { margin-top: 2rem; font-size: .85rem; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>Fichero</h1>
    <p>You followed a Fichero invite. If you have the app, it should have opened.</p>
    <p>Fichero is a Mac app for reading, organising, and reasoning over archives.</p>
    <p class="note">Don't have it yet? A download link will live here.</p>
  </main>
</body>
</html>
