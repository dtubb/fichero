title: "Fichero: Document Processing and Transcription"
description: > 
  This project offers a workflow to process documents and create transcriptions from archival materials.

  Fichero will:
  - Read and process image files
  - Split multi-page documents into single pages where needed
  - Transcribe images using AI models
  - Process transcriptions to extract structured data
  - Enhance image quality and remove backgrounds

vars:
  name: "Fichero"
  language: "es"  # Default language, can be changed per project
  text_direction: 'horizontal-lr' #['horizontal-lr', 'horizontal-rl', 'vertical-lr', 'vertical-rl']
  version: "0.0.0"
  
  # Project paths - these should be configured per project
  project_folder: "/Users/dtubb/code/fichero_main/fichero/projects/1947 Roberto Caicedo Contra Cia minera Chocó pacifico Demanda Ordinaria Laboral Andagoya"  # This will be updated by fichero_director
  fichero_root: "/Users/dtubb/code/fichero_main/fichero"  # This will be updated by fichero_director
  documents_folder: "${vars.project_folder}/documents"
  assets_folder: "${vars.project_folder}/assets"
  scripts_dir: "${vars.fichero_root}/scripts"
  prompts_dir: "${vars.fichero_root}/prompts"
  models_dir: "${vars.fichero_root}/models"
  yolo_model_path: "${vars.models_dir}/yolov8s-fichero.pt"  # Path to YOLO model

  # Image format configuration
  crop_format: "jpg"  # Options: "png", "jxl", "jpg"
  split_format: "jpg"  # Options: "png", "jxl", "jpg"
  rotate_format: "jpg"  # Options: "png", "jxl", "jpg"
  enhance_format: "jpg"  # Options: "png", "jxl", "jpg"
  background_removed_format: "png"  # Options: "png" (with transparency), "jxl" (with transparency and better compression), "jpg" (white background, most compatible)

  # metadata
  documents_manifest_folder: "${vars.assets_folder}/manifests"
  documents_manifest: "${vars.documents_manifest_folder}/documents_manifest.jsonl"
  
  # Processing folders
  crops_folder: "${vars.assets_folder}/crops"
  crop_manifest: "${vars.documents_manifest}"
  crop_source_folder: "${vars.documents_folder}"
  
  split_image_folder: "${vars.assets_folder}/splits"
  rotated_image_folder: "${vars.assets_folder}/rotated"
  background_removed_image_folder: "${vars.assets_folder}/background_removed"
  
  # Processing folders
  enhanced_image_folder: "${vars.assets_folder}/enhanced"
  segmented_image_folder: "${vars.assets_folder}/segments"
  transcriptions_folder: "${vars.assets_folder}/transcriptions"
  segmented_transcriptions_folder: "${vars.assets_folder}/segmented_transcriptions"
  prompt: "Extract all text line by line. Do not number lines. RETURN ONLY PLAIN TEXT. SAY NOTHING ELSE"
  recombined_folder: "${vars.assets_folder}/recombined"
  
  # Output folders
  word_folder: "${vars.assets_folder}/word"
  llm_processed_folder: "${vars.assets_folder}/llm_processed"
  llm_catalogue_folder: "${vars.assets_folder}/llm_catalogue"  # Specific folder for catalogue processing
  llm_ner_folder: "${vars.assets_folder}/llm_ner"  # Specific folder for NER processing
  
  # Manifest paths
  split_manifest: "${vars.split_image_folder}/split_manifest.jsonl"
  segment_manifest: "${vars.segmented_image_folder}/segment_manifest.jsonl"
  transcription_manifest: "${vars.transcriptions_folder}/transcription_manifest.jsonl"
  segmented_transcription_manifest: "${vars.segmented_transcriptions_folder}/transcription_manifest.jsonl"

  # LMStudio configuration
  lmstudio_url: "http://localhost:1234"
  lmstudio_model: "Qwen2.5-VL-3B-Instruct-8bit"  # Model name as shown in LM Studio

  # LLM configuration
  llm_prompt_config: "${vars.prompts_dir}/catalogue_folder_local_config.jsonl"  # Default prompt config file
  ner_prompt_config: "${vars.prompts_dir}/ner_async_config.jsonl"  # NER async processing config
  ner_gpt4_prompt_config: "${vars.prompts_dir}/ner-chat-gpt4.jsonl"  # NER GPT-4 processing config

directories: ["${vars.scripts_dir}"]

workflows:
  archive-to-word-qwen-max:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - transcribe_qwen_max
    - convert_to_word

  archive-to-word-qwen-max-segmented:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - segment
    - transcribe_qwen_max_segments
    - recombine_segments_qwen_max
    - fuzzy_clean
    - convert_to_word
   
  archive-to-word-lmstudio:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - transcribe_lmstudio
    - convert_to_word

  archive-to-word-lmstudio-segmented:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - segment
    - transcribe_lmstudio_segments
    - recombine_segments
    - fuzzy_clean
    - convert_to_word

  transcriptions-to-catalogue:
    - llm_process_catalogue_folder

  transcriptions-to-ner:
    - llm_process_ner_async

  transcriptions-to-ner-word:
    - llm_process_ner_async
    - llm_ner_to_word

  transcriptions-to-ner-gpt4:
    - llm_process_ner_gpt4

  transcriptions-to-ner-gpt4-word:
    - llm_process_ner_gpt4
    - llm_ner_to_word
  

commands:
  - name: build_documents_manifest
    help: "Generate the documents manifest listing"
    script:
      - "python ${vars.scripts_dir}/build_documents_manifest.py \"${vars.documents_folder}\" \"${vars.documents_manifest}\""
    outputs:
      - ${vars.documents_manifest}

  - name: crop
    help: "Crop documents using computer vision techniques"
    script:
      - "python ${vars.scripts_dir}/crop.py \"${vars.documents_folder}\" \"${vars.documents_manifest}\" \"${vars.crops_folder}\" --model-path \"${vars.yolo_model_path}\" --format \"${vars.crop_format}\""
    outputs:
      - ${vars.crops_folder}
      - ${vars.crops_folder}/crop_manifest.jsonl

  - name: split
    help: "Split cropped images"
    script:
      - "python ${vars.scripts_dir}/split.py \"${vars.crops_folder}\" \"${vars.crops_folder}/crop_manifest.jsonl\" \"${vars.split_image_folder}\" --format \"${vars.split_format}\""
    outputs:
      - ${vars.split_image_folder}
      - ${vars.split_manifest}

  - name: rotate
    help: "Rotate the split images to straighten text."
    script:
      - "python ${vars.scripts_dir}/rotate.py \"${vars.split_image_folder}\" \"${vars.split_manifest}\" \"${vars.rotated_image_folder}\" --format \"${vars.rotate_format}\""
    outputs:
      - ${vars.rotated_image_folder}
      - ${vars.rotated_image_folder}/rotate_manifest.jsonl

  - name: enhance
    help: "Enhance image quality with contrast and clarity improvements"
    script:
      - "python ${vars.scripts_dir}/enhance.py \"${vars.rotated_image_folder}\" \"${vars.rotated_image_folder}/rotate_manifest.jsonl\" \"${vars.enhanced_image_folder}\" --format \"${vars.enhance_format}\""
    outputs:
      - ${vars.enhanced_image_folder}
      - ${vars.enhanced_image_folder}/enhance_manifest.jsonl

  - name: remove_background
    help: "Remove background from enhanced images"
    script:
      - "python ${vars.scripts_dir}/remove_background.py \"${vars.enhanced_image_folder}\" \"${vars.enhanced_image_folder}/enhance_manifest.jsonl\" \"${vars.background_removed_image_folder}\" --format \"${vars.background_removed_format}\""
    outputs:
      - ${vars.background_removed_image_folder}
      - ${vars.background_removed_image_folder}/background_removed_manifest.jsonl

  - name: segment
    help: "Segment images into text regions"
    script:
      - "python ${vars.scripts_dir}/segment.py \"${vars.background_removed_image_folder}\" \"${vars.background_removed_image_folder}/background_removed_manifest.jsonl\" \"${vars.segmented_image_folder}\""
    outputs:
      - ${vars.segmented_image_folder}
      - ${vars.segment_manifest}

  - name: transcribe_qwen_max
    help: "Transcribe documents using Alibaba Qwen"
    script:
      - "python ${vars.scripts_dir}/transcribe_qwen_max.py \"${vars.background_removed_image_folder}\" \"${vars.background_removed_image_folder}/background_removed_manifest.jsonl\" \"${vars.transcriptions_folder}\""
    outputs:
      - ${vars.transcriptions_folder}
      - ${vars.transcription_manifest}

  - name: transcribe_qwen_max_segments
    help: "Transcribe segmented images using Qwen VL Max model"
    script:
      - "python ${vars.scripts_dir}/transcribe_qwen_max.py \"${vars.segmented_image_folder}\" \"${vars.segment_manifest}\" \"${vars.segmented_transcriptions_folder}\""
    outputs:
      - ${vars.segmented_transcriptions_folder}
      - ${vars.segmented_transcription_manifest}

  - name: recombine_segments
    help: "Recombine the transcribed segments into single markdown files"
    script:
      - "python ${vars.scripts_dir}/recombine_segments.py \"${vars.segmented_transcriptions_folder}\" \"${vars.recombined_folder}\" \"${vars.segmented_transcription_manifest}\" \"${vars.background_removed_image_folder}/background_removed_manifest.jsonl\""
    outputs:
      - ${vars.recombined_folder}
      - ${vars.recombined_folder}/recombine_manifest.jsonl

  - name: recombine_segments_qwen_max
    help: "Recombine the transcribed segments from Qwen into single markdown files"
    script:
      - "python ${vars.scripts_dir}/recombine_segments.py \"${vars.segmented_transcriptions_folder}\" \"${vars.recombined_folder}\" \"${vars.segmented_transcription_manifest}\" \"${vars.background_removed_image_folder}/background_removed_manifest.jsonl\""
    outputs:
      - ${vars.recombined_folder}
      - ${vars.recombined_folder}/recombine_manifest.jsonl

  - name: fuzzy_clean
    help: "Clean up text from recombined transcriptions"
    script:
      - "python ${vars.scripts_dir}/fuzzy_clean.py \"${vars.recombined_folder}\" \"${vars.recombined_folder}/recombine_manifest.jsonl\" \"${vars.transcriptions_folder}\""
    outputs:
      - ${vars.transcriptions_folder}
      - ${vars.transcription_manifest}

  - name: convert_to_word
    help: "Convert background-removed images and transcriptions to Word documents with side-by-side layout"
    script:
      - "python ${vars.scripts_dir}/convert_to_word.py \"${vars.background_removed_image_folder}\" \"${vars.transcription_manifest}\" \"${vars.word_folder}\""
    outputs:
      - ${vars.word_folder}

  - name: transcribe_lmstudio
    help: "Transcribe documents using local LMStudio model"
    script:
      - "python ${vars.scripts_dir}/transcribe_lmstudio.py \"${vars.background_removed_image_folder}\" \"${vars.background_removed_image_folder}/background_removed_manifest.jsonl\" \"${vars.transcriptions_folder}\" --model \"${vars.lmstudio_model}\""
    outputs:
      - ${vars.transcriptions_folder}
      - ${vars.transcription_manifest}

  - name: transcribe_lmstudio_segments
    help: "Transcribe segmented documents using local LMStudio model"
    script:
      - "python ${vars.scripts_dir}/transcribe_lmstudio.py \"${vars.segmented_image_folder}/documents\" \"${vars.segment_manifest}\" \"${vars.segmented_transcriptions_folder}\" --model \"${vars.lmstudio_model}\""
    outputs:
      - ${vars.segmented_transcriptions_folder}
      - ${vars.segmented_transcription_manifest}

  - name: llm_process_catalogue_folder
    help: "Process transcribed documents through configurable LLM pipeline for catalogue generation"
    script:
      - "python ${vars.scripts_dir}/llm_process.py \"${vars.transcriptions_folder}\" \"${vars.transcription_manifest}\" \"${vars.llm_catalogue_folder}\" --prompt-config \"${vars.llm_prompt_config}\" --folder-mode"
    outputs:
      - ${vars.llm_catalogue_folder}
      - ${vars.llm_catalogue_folder}/llm_process_manifest.jsonl

  - name: llm_process_ner_async
    help: "Process transcribed documents through configurable LLM pipeline for NER processing"
    script:
      - "python ${vars.scripts_dir}/llm_process.py \"${vars.transcriptions_folder}\" \"${vars.transcription_manifest}\" \"${vars.llm_ner_folder}\" --prompt-config \"${vars.ner_prompt_config}\" --folder-mode"
    outputs:
      - ${vars.llm_ner_folder}
      - ${vars.llm_ner_folder}/llm_process_manifest.jsonl

  - name: llm_process_ner_gpt4
    help: "Process transcribed documents through configurable LLM pipeline for NER processing using GPT-4"
    script:
      - "python ${vars.scripts_dir}/llm_process.py \"${vars.transcriptions_folder}\" \"${vars.transcription_manifest}\" \"${vars.llm_ner_folder}/gpt4\" --prompt-config \"${vars.ner_gpt4_prompt_config}\" --folder-mode"
    outputs:
      - ${vars.llm_ner_folder}/gpt4
      - ${vars.llm_ner_folder}/gpt4/llm_process_manifest.jsonl

  - name: llm_ner_to_word
    help: "Convert LLM NER output to Word documents"
    script:
      - "python ${vars.scripts_dir}/llm_to_word.py \"${vars.llm_ner_folder}\" \"${vars.llm_ner_folder}/word_outputs\""
    outputs:
      - ${vars.llm_ner_folder}/word_outputs
      - ${vars.llm_ner_folder}/word_outputs/llm_to_word_manifest.jsonl