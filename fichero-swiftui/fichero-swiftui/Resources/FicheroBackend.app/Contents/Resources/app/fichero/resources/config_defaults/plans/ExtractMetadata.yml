title: "Extract Library Metadata"
description: >
  Minimal workflow for testing extract_library_metadata tool - extracts library metadata for files.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Extract Metadata only workflow - for testing metadata extraction
  ExtractMetadataTest:
    - build_documents_manifest
    - extract_library_metadata

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: extract_library_metadata
    worker_type: "cpu"
    help: "Extract library metadata for enriched processing context"
    function: "fichero.tools.extract_library_metadata.extract_metadata_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/library_metadata"
      library_db_path: null  # Will use default
      collection_id: null    # Will process all collections
    outputs:
      - "assets/library_metadata"
      - "assets/library_metadata/metadata_manifest.jsonl"
