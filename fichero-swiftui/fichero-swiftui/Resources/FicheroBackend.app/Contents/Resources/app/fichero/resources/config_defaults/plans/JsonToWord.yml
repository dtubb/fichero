title: "JSON to Word"
description: >
  Minimal workflow for testing json_to_word tool - converts JSON catalogue files to Word documents.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # JSON to Word only workflow - for testing Word catalogue export
  JsonToWordTest:
    - build_documents_manifest
    - json_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: json_to_word
    worker_type: "cpu"
    help: "Convert JSON catalogue files to Word documents"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/word_catalogues"
    outputs:
      - "assets/word_catalogues"
      - "assets/word_catalogues/json_to_word_manifest.jsonl"
