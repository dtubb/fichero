title: "plans_title"
description: "plans_description"
window_title: "plans_window_title"
window_size: [1000, 700]

sections:
  - id: "general"
    title: "plans_general_title"
    sections:
      - title: "plans_project_info_title"
        fields:
          - id: "title"
            type: "text_input"
            label: "plans_project_title"
            placeholder: "plans_project_title_placeholder"
            validation:
              required: true
          - id: "description"
            type: "multiline_text"
            label: "plans_description_label"
            height: 200
            placeholder: "plans_description_placeholder"

  - id: "vars"
    title: "plans_variables_title"
    sections:
      - title: "plans_basic_config_title"
        fields:
          - id: "vars.name"
            type: "text_input"
            label: "plans_project_name"
            validation:
              required: true
          - id: "vars.language"
            type: "selection"
            label: "plans_language"
            options: ["es", "en", "fr", "de", "pt", "it"]
          - id: "vars.text_direction"
            type: "selection"
            label: "plans_text_direction"
            options: ["horizontal-lr", "horizontal-rl", "vertical-lr", "vertical-rl"]
          - id: "vars.version"
            type: "text_input"
            label: "plans_version"

      - title: "plans_image_formats_title"
        description: "plans_image_formats_description"
        fields:
          - id: "vars.crop_format"
            type: "selection"
            label: "plans_crop_format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.split_format"
            type: "selection"
            label: "plans_split_format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.rotate_format"
            type: "selection"
            label: "plans_rotate_format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.enhance_format"
            type: "selection"
            label: "plans_enhance_format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.background_removed_format"
            type: "selection"
            label: "plans_background_removed_format"
            options: ["png", "jxl", "jpg"]

      - title: "plans_processing_methods_title"
        description: "plans_processing_methods_description"
        fields:
          - id: "vars.background_removal_method"
            type: "selection"
            label: "plans_background_removal_method"
            options: ["opencv", "ai"]
            help: "plans_background_removal_method_help"
          - id: "vars.background_removal_ai_model"
            type: "selection"
            label: "plans_background_removal_ai_model"
            options: ["default", "u2net", "u2net_human", "silueta"]
            help: "plans_background_removal_ai_model_help"

      - title: "plans_llm_config_title"
        fields:
          - id: "vars.lmstudio_url"
            type: "text_input"
            label: "plans_lmstudio_url"
            placeholder: "plans_lmstudio_url_placeholder"
          - id: "vars.lmstudio_model"
            type: "text_input"
            label: "plans_lmstudio_model"
            placeholder: "plans_lmstudio_model_placeholder"
          - id: "vars.prompt"
            type: "multiline_text"
            label: "plans_default_prompt"
            height: 80
            placeholder: "plans_default_prompt_placeholder"

  - id: "paths"
    title: "plans_paths_title"
    sections:
      - title: "plans_key_paths_title"
        description: "plans_key_paths_description"
        fields:
          - id: "vars.project_folder"
            type: "text_input"
            label: "plans_project_folder"
            help: "plans_project_folder_help"
          - id: "vars.documents_folder"
            type: "text_input"
            label: "plans_documents_folder"
            help: "plans_documents_folder_help"
          - id: "vars.assets_folder"
            type: "text_input"
            label: "plans_assets_folder"
            help: "plans_assets_folder_help"

  - id: "workflows"
    title: "plans_workflows_title"
    sections:
      - title: "plans_workflow_management_title"
        description: "plans_workflow_management_description"
        fields:
          - id: "workflow_manager"
            type: "workflow_editor"
            label: "plans_workflow_editor"
            help: "plans_workflow_editor_help"
      

  - id: "commands"
    title: "plans_commands_title"
    sections:
      - title: "plans_command_config_title"
        description: "plans_command_config_description"
        fields:
          - id: "commands_editor"
            type: "multiline_text"
            label: "plans_commands_yaml"
            height: 500
            help: "plans_commands_yaml_help"
            placeholder: "plans_commands_yaml_placeholder" 