title: "Split"
description: >
  Minimal workflow for testing split tool - splits double-page images into individual pages.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Split only workflow - for testing split tool with OutputView
  SplitTest:
    - build_documents_manifest
    - split

  # Split with auto-detection
  SplitAuto:
    - build_documents_manifest
    - split_auto

  # Split at center (50/50)
  SplitCenter:
    - build_documents_manifest
    - split_center

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: split
    worker_type: "cpu"
    help: "Split double-page images into individual pages"
    function: "fichero.tools.split.split_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/split"
      method: "auto"
      split_count: 2
      overlap: 0
      detection_threshold: 0.5
      output_format: "jpg"
    outputs:
      - "assets/split"
      - "assets/split/split_manifest.jsonl"

  - name: split_auto
    worker_type: "cpu"
    help: "Split using automatic fold detection"
    function: "fichero.tools.split.split_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/split_auto"
      method: "auto"
      split_count: 2
      overlap: 50
      detection_threshold: 0.6
      output_format: "jpg"
    outputs:
      - "assets/split_auto"
      - "assets/split_auto/split_manifest.jsonl"

  - name: split_center
    worker_type: "cpu"
    help: "Split at center (50/50)"
    function: "fichero.tools.split.split_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/split_center"
      method: "center"
      split_count: 2
      overlap: 0
      output_format: "jpg"
    outputs:
      - "assets/split_center"
      - "assets/split_center/split_manifest.jsonl"
