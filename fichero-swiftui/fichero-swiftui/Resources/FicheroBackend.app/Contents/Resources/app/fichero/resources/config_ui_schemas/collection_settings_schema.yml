title: "collection_settings_title"
description: "collection_settings_description"
window_title: "collection_settings_window_title"
window_size: [450, 600]

sections:
  - id: "basic"
    title: "collection_settings_basic_title"
    description: "collection_settings_basic_description"
    fields:
      - id: "name"
        type: "text_input"
        label: "collection_settings_name"
        placeholder: "My Collection"
        help: "collection_settings_name_help"
        required: true
      
      - id: "description"
        type: "text_area"
        label: "collection_settings_description"
        placeholder: "Enter a description for this collection..."
        help: "collection_settings_description_help"
        rows: 3

  - id: "type"
    title: "collection_settings_type_title"
    description: "collection_settings_type_description"
    fields:
      - id: "type"
        type: "selection"
        label: "collection_settings_type"
        options: ["copy", "link"]
        help: "collection_settings_type_help"
        required: true

  - id: "processing"
    title: "collection_settings_processing_title"
    description: "collection_settings_processing_description"
    fields:
      - id: "processing_location"
        type: "selection"
        label: "collection_settings_processing_location"
        options: ["internal", "external"]
        help: "collection_settings_processing_location_help"
        required: true
      
      - id: "processing_path"
        type: "text_input"
        label: "collection_settings_processing_path"
        placeholder: "/path/to/processing/output"
        help: "collection_settings_processing_path_help"
        depends_on:
          field: "processing_location"
          value: "external"

  - id: "metadata"
    title: "collection_settings_metadata_title"
    description: "collection_settings_metadata_description"
    fields:
      - id: "tags"
        type: "text_input"
        label: "collection_settings_tags"
        placeholder: "tag1, tag2, tag3"
        help: "collection_settings_tags_help"
      
      - id: "category"
        type: "text_input"
        label: "collection_settings_category"
        placeholder: "Documents, Photos, etc."
        help: "collection_settings_category_help"
      
      - id: "priority"
        type: "selection"
        label: "collection_settings_priority"
        options: ["low", "normal", "high"]
        help: "collection_settings_priority_help"

  - id: "advanced"
    title: "collection_settings_advanced_title"
    description: "collection_settings_advanced_description"
    fields:
      - id: "auto_process"
        type: "checkbox"
        label: "collection_settings_auto_process"
        help: "collection_settings_auto_process_help"
      
      - id: "process_on_add"
        type: "checkbox"
        label: "collection_settings_process_on_add"
        help: "collection_settings_process_on_add_help"
        depends_on:
          field: "auto_process"
          value: true
      
      - id: "retention_policy"
        type: "selection"
        label: "collection_settings_retention_policy"
        options: ["keep_forever", "keep_30_days", "keep_90_days", "keep_1_year"]
        help: "collection_settings_retention_policy_help" 