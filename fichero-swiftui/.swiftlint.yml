included:
  - fichero-swiftui

excluded:
  - fichero-api-client
  - DerivedData
  - .build

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - first_where
  - sorted_imports

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 250
  error: 500

file_length:
  warning: 400
  error: 1000

function_body_length:
  warning: 50
  error: 100
