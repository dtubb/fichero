# =============================================================================
# Fichero Backend - Briefcase Configuration
# =============================================================================
# This configuration builds a Python backend app that gets embedded inside the
# Swift Fichero.app as a nested .app bundle.
#
# Development workflow:
#   - Use `briefcase dev -a engine` for testing bundled backend
#   - Use `uvicorn fichero.api.main:app --reload` for hot-reload development
#
# Production build:
#   - Run: ./scripts/build_backend_bundle.sh
#   - Output: build/engine/macos/app/Fichero Engine.app
#   - This .app is copied into Fichero.app/Contents/Resources/ by Xcode
# =============================================================================

[tool.briefcase]
project_name = "Fichero"
bundle = "com.fichero.fichero"
version = "2026.7.19.2"
url = "https://www.tubb.ca/fichero/"
license.file = "LICENSE"
author = "Daniel Tubb"
author_email = "dtubb@users.noreply.github.com"

# =============================================================================
# Briefcase App Definition - Embedded Backend
# =============================================================================
# This section defines the backend app that Briefcase will bundle.
# The app is a headless FastAPI server (console_app=true, no GUI).
#
# Sources:
#   - src/fichero: Main backend code (API, workflows, database, etc.)
#   - src/engine: Briefcase entry point wrapper
# =============================================================================

[tool.briefcase.app.engine]
formal_name = "Fichero Engine"
description = "Headless engine for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
long_description = "FastAPI backend service embedded inside the Fichero Swift app. Provides document processing, AI workflows, and data storage."
icon = "src/engine/resources/engine"  # Briefcase strips extension, adds platform suffixes
console_app = true  # Headless app (no window, runs in background)
sources = [
    "src/fichero",          # Main backend code
    "src/engine",  # Briefcase entry point
]
requires = [
    # Core — 0.0.1 release surface (keep slim for bundle size)
    "fastapi",
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    "python-multipart",
    "python-dotenv",
    "aiofiles",
    "aiohttp",
    "httpx",
    "defusedxml",
    "cryptography",
    "zeroconf",
    # Data Layer
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    # AI/LLM — Ollama (local) + LiteLLM (provider routing)
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    "mcp",
    "langgraph",
    "langchain-ollama",
    "litellm",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    "fastembed",
    # Optional KG/NER/image extras are deliberately not shipped in the
    # embedded Mac engine. They pull hundreds of MB into the tester app:
    # pykeen -> torch, spacy -> model/runtime stack, rdflib -> SPARQL stack,
    # opencv-python-headless -> cv2. Install extras locally when working on
    # those features instead.
    # "pykeen",
    # "rdflib",
    # "spacy",
    # "opencv-python-headless",
    # Document Processing
    "PyMuPDF",
    "Pillow>=12.2.0",
]

[tool.briefcase.app.engine.macOS]
universal_build = false  # arm64-only (Apple Silicon)
min_os_version = "15.0"
python_version = "3.12"  # Pin to 3.12 — many ML packages lack 3.14 wheels

# macOS-only PyObjC frameworks for the on-device Apple Vision OCR path
# (Transcribe (Apple Vision) workflow). Listed here, not in the main
# `requires` block above, so non-macOS dev installs don't fail. Without
# these, briefcase silently shipped the bundle without Vision.framework
# Python bindings and every Apple Vision workflow run died with
# "Apple Vision OCR requires macOS with Vision framework" (#790).
requires = [
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]

# Entitlements for network server (listens on port 8765)
entitlement."com.apple.security.network.server" = true
entitlement."com.apple.security.network.client" = true

# Hide backend from Dock (background-only app)
info."LSUIElement" = true

# Build system requirements
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fichero = [
    "resources/bin/*",
    "resources/default_workflows/*.json",
]

# =============================================================================
# Standard Python Package Configuration
# =============================================================================
# This section defines the package for pip installation and uvicorn development.
# Used when running: uvicorn fichero.api.main:app --reload
#
# IMPORTANT: Keep dependencies in sync with [tool.briefcase.app.engine]
# TOML doesn't support variable inheritance, so both sections must be maintained.
# =============================================================================

[project]
name = "fichero"
version = "2026.7.19.2"
description = "Headless engine for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core — these ship in the Briefcase bundle
    "python-dotenv",
    "aiofiles",
    "aiohttp",
    "httpx",
    "defusedxml",
    "cryptography",
    "zeroconf",
    "fastapi",
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    "mcp",
    "langgraph",
    "langchain-ollama",
    "litellm",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    "fastembed",
    # Optional KG/NER/image extras are intentionally out of core so Briefcase
    # does not bundle pykeen/torch, rdflib, spacy, or OpenCV into every app.
    # "pykeen",
    # "rdflib",
    # "spacy",
    # "opencv-python-headless",
    "PyMuPDF",
    "Pillow>=12.2.0",
]

[project.optional-dependencies]
kg = [
    "pykeen",
    "rdflib",
    "spacy",
]
image = [
    "opencv-python-headless",
]
# Full dev dependencies — install with: pip install -e ".[dev]"
dev = [
    "pathvalidate",
    "nest-asyncio",
    "openai",
    "dashscope",
    "Pillow",
    "numpy",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "typer",
    "rich",
    "requests",
    "cryptography",
    "ruamel.yaml",
    "openapi-python-client",
]

[project.scripts]
fichero = "fichero.__main__:main"
fichero-mcp = "fichero.mcp_server:main"
fichero-mcp-simple = "fichero.mcp_simple:main"

[tool.pytest.ini_options]
markers = [
    "asyncio: mark async tests that run with the asyncio event loop",
    "anyio: mark async tests compatible with anyio backends",
    "requires_apple_vision: mark test as needing macOS Vision framework (auto-skipped on non-mac / when fm-bridge probe fails)",
    "requires_apple_intelligence: mark test as needing on-device Apple Intelligence (auto-skipped via fm-bridge --probe)",
]
