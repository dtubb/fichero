tool: catalogue
scenario: court_file_choco_1930_bonilla
checks:
  - kind: not_contains
    value: "vibrant tapestry"
    rationale: "Purple prose blacklist."
  - kind: not_contains
    value: "**Catalogue Entry**"
    rationale: "Narrative starts with the document type, not a title."
  - kind: starts_with
    value: ["Demanda", "Lawsuit", "Juicio", "El expediente"]
    rationale: "Court-file narrative opens with the document type per #824."
  - kind: word_count_between
    min: 100
    max: 450
    rationale: "Single-event court file ~150-300 words."
  - kind: contains
    value: "Bonilla"
    rationale: "Plaintiff named in source."
  - kind: contains
    value: "Ibarguen"
    rationale: "Defendant named in source."
  - kind: contains
    value: "1930"
    rationale: "Date is in the source — narrative must preserve it."
