tool: catalogue
scenario: book_preface_tubb_2020
checks:
- kind: not_contains
  value: vibrant tapestry
  rationale: Purple prose the small-model default leaks; must be absent.
- kind: not_contains
  value: lush, verdant
  rationale: Same family of stock travel-writing register.
- kind: not_contains
  value: resilient spirit
  rationale: Stock LLM register; archive cataloguing avoids it.
- kind: not_contains
  value: Antonio Asprilla
  rationale: Prompt-bleed sentinel — leaked from prior prompt examples.
- kind: not_contains
  value: '**Catalogue Entry**'
  rationale: Header strip (#828) — narrative must not start with title.
- kind: not_contains
  value: 'Summary:'
  rationale: Same — labels/headers stripped from narrative output.
- kind: word_count_between
  min: 80
  max: 450
  rationale: Chapter preface should produce 200-450; allow 80 for Apple early.
- kind: contains
  value: Chocó
  rationale: Source mentions Chocó repeatedly; narrative must preserve it.
