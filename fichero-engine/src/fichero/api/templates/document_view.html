<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ document.name }}</title>
    <style>
        :root {
            color-scheme: light dark;
            /* Apple system defaults — match the native app chrome (#1228). */
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
            --bg: #f7f4ee;
            --panel: rgba(255, 255, 255, 0.85);
            --text: #1f1d1a;
            --muted: #6a6258;
            --line: rgba(64, 53, 39, 0.14);
            --accent: #0d6b6f;
            --accent-soft: rgba(13, 107, 111, 0.14);
            --claim: #b45014;
            --claim-soft: rgba(180, 80, 20, 0.14);
        }

        /* Browser fallback for dark mode. In the Fichero app these are
           overridden by live macOS system colors injected from Swift
           (DocumentKGPaneRoute.systemThemeCSS), so the pane matches the OS
           appearance + accent exactly. */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1b18;
                --panel: rgba(44, 40, 36, 0.85);
                --text: #ece7df;
                --muted: #a59b8d;
                --line: rgba(236, 231, 223, 0.16);
                --accent: #3fb6ba;
                --accent-soft: rgba(63, 182, 186, 0.18);
                --claim: #e0793a;
                --claim-soft: rgba(224, 121, 58, 0.20);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-system);
            /* Flat macOS-style surface that matches the Document Inspector:
               the live system background (var(--bg) is overridden from Swift
               with .textBackgroundColor), not a cream "paper" gradient (#1280). */
            background: var(--bg);
            color: var(--text);
            /* Reader paragraph wrapping (#3684): inherited by prose paragraphs.
               Swift injects --reader-text-wrap from the Reader setting (pretty =
               no orphan last-lines); "pretty" is the on-target default. */
            text-wrap: var(--reader-text-wrap, pretty);
        }

        .shell {
            /* Fixed viewport height so only `.content` scrolls. The native
               Swift toolbar owns tab switching, and the page no longer carries
               its own title/eyebrow header — the app's selection already says
               what's shown, so the chrome would be redundant (#1244). */
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr;
        }

        /* The native Swift toolbar (DocumentKGSurface) now owns the
           Transcript/Digest/Graph switcher, so the in-page tab bar is hidden.
           The markup is retained: `fichero.showTab` drives it, and it remains
           a working fallback when the page is opened directly in a browser. */
        .tabs {
            display: none;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .tabs button {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font: 600 12px/1.2 var(--font-system);
            padding: 7px 12px;
            cursor: pointer;
        }

        .tabs button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .content {
            overflow: auto;
            padding: 12px;
            min-height: 0;
        }

        .panel {
            /* Flat, square, seamless with the page background — no rounded
               "paper card" border-radius/shadow. Matches the inspector's flat
               treatment (#1280). */
            background: var(--bg);
            padding: 12px;
        }

        .hidden { display: none; }

        .empty {
            color: var(--muted);
            font: 500 13px/1.5 var(--font-system);
            padding: 16px;
        }

        .transcript {
            /* Reader body text derives from the Swift-injected semantic base
               size (--reader-base-size); the 14px fallback keeps it readable in
               a plain browser. The Reader font-size setting scales the var (#3681). */
            font-size: var(--reader-base-size, 14px);
            line-height: 1.6;
            display: grid;
            gap: 1em;
        }

        .transcript-page {
            scroll-margin-block-start: 0.75em;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.8em;
            box-shadow: 0 0.15em 0.6em var(--line);
            padding: 1.25em;
        }

        .page-marker {
            color: var(--muted);
            font: 600 0.72em/1 var(--font-system);
            letter-spacing: 0.08em;
            margin-bottom: 1em;
            text-transform: uppercase;
        }

        .transcript-page-body {
            white-space: pre-wrap;
        }

        .transcript mark {
            background: rgba(255, 223, 128, 0.75);
            border-radius: 3px;
            padding: 0 2px;
        }

        .digest-group + .digest-group {
            margin-top: 18px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
        }

        .digest-group h3 {
            margin: 0 0 10px;
            font: 700 14px/1.3 var(--font-system);
        }

        /* Entity names render as clickable macOS-accent lozenges, not bold
           text — clicking opens that entity across the library via the bridge
           (#1466 / #1363). */
        .entity-lozenge {
            font: 600 13px/1.2 var(--font-system);
            color: var(--accent);
            background: var(--accent-soft);
            border: none;
            border-radius: 999px;
            padding: 3px 11px;
            cursor: pointer;
        }

        .entity-lozenge:hover {
            text-decoration: underline;
        }

        .claim-row {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: var(--panel);
            cursor: pointer;
        }

        .claim-row + .claim-row { margin-top: 8px; }

        .claim-row.active {
            border-color: var(--claim);
            background: var(--claim-soft);
        }

        .claim-meta {
            margin-top: 6px;
            color: var(--muted);
            font: 500 11px/1.4 var(--font-mono);
        }

        /* Provenance + click-to-expand source passage, inline under the claim
           (#1467). The hint is always visible; the source box reveals on click
           (the .source-open class is toggled on the .claim-row). */
        .claim-source-hint {
            margin-top: 6px;
            color: var(--accent);
            font: 600 11px/1.4 var(--font-system);
        }

        .claim-source-hint::before { content: "\25B8  "; }
        .claim-row.source-open .claim-source-hint::before { content: "\25BE  "; }

        .claim-source {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 4px;
            color: var(--text);
            font: 400 12px/1.55 var(--font-system);
            white-space: pre-wrap;
        }

        .claim-row.source-open .claim-source { display: block; }

        /* Let the graph fill the whole pane instead of a tiny fixed box (#1465).
           The WebKit pane itself owns the viewport height; give the graph a
           real, definite drawing area and compute the SVG viewBox from that
           size so it does not sit in a small fixed 440x340 square. */
        #graph-panel:not(.hidden) {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 24px);
        }

        .graph-wrap {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 96px);
            display: block;
        }

        .graph-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
        }

        .graph-scope-toggle {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            font: 600 12px/1.2 var(--font-system);
            padding: 5px 8px;
            cursor: pointer;
        }

        .node {
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        .node.dimmed { opacity: 0.35; }
        .node.active circle { fill: var(--accent); }
        .node.active text { fill: var(--accent); font-weight: 700; }
        .node circle {
            fill: rgba(13, 107, 111, 0.16);
            stroke: var(--accent);
            stroke-width: 1.5;
        }

        .node text {
            font: 600 12px/1.2 var(--font-system);
            fill: var(--text);
        }

        .edge {
            stroke: rgba(64, 53, 39, 0.24);
            stroke-linecap: round;
        }

        .legend {
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
            margin-bottom: 10px;
        }

        .timeline-list,
        .map-shell {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-meta,
        .map-meta {
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
        }

        .timeline-list-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .timeline-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            padding: 10px 12px;
            cursor: pointer;
        }

        .timeline-item.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .timeline-item-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .timeline-item-title {
            font: 700 13px/1.4 var(--font-system);
        }

        .timeline-item-date {
            color: var(--muted);
            font: 600 11px/1.4 var(--font-mono);
            white-space: nowrap;
        }

        .timeline-item-body {
            margin-top: 6px;
            color: var(--text);
            font: 400 12px/1.55 var(--font-system);
        }

        .timeline-item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .timeline-tag {
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.06);
            color: var(--muted);
            font: 600 10px/1.2 var(--font-system);
            padding: 4px 8px;
        }

        .map-shell {
            min-height: calc(100vh - 24px);
        }

        .map-viewport {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 14px;
            background:
                linear-gradient(180deg, rgba(13, 107, 111, 0.08), rgba(13, 107, 111, 0.02)),
                repeating-linear-gradient(
                    0deg,
                    transparent 0,
                    transparent 51px,
                    rgba(64, 53, 39, 0.06) 52px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 71px,
                    rgba(64, 53, 39, 0.06) 72px
                ),
                var(--bg);
            min-height: 420px;
            overflow: hidden;
        }

        .map-viewport svg {
            min-height: 420px;
        }

        .map-caption {
            position: absolute;
            top: 12px;
            left: 12px;
            display: inline-flex;
            flex-direction: column;
            gap: 3px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            padding: 8px 10px;
            color: var(--text);
            font: 600 11px/1.4 var(--font-system);
            backdrop-filter: blur(6px);
        }

        .map-caption span:last-child {
            color: var(--muted);
            font-weight: 500;
        }

        .map-place-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 8px;
        }

        .map-place-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            padding: 10px;
            cursor: pointer;
        }

        .map-place-card.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .map-place-name {
            font: 700 13px/1.35 var(--font-system);
        }

        .map-place-detail {
            margin-top: 4px;
            color: var(--muted);
            font: 500 11px/1.5 var(--font-system);
        }
    </style>
</head>
<body>
<div class="shell">
    <nav class="tabs">
        <button type="button" data-tab="transcript" class="active">Transcript</button>
        <button type="button" data-tab="digest">Digest</button>
        <button type="button" data-tab="graph">Graph</button>
        <button type="button" data-tab="timeline">Timeline</button>
        <button type="button" data-tab="map">Map</button>
    </nav>
    <main class="content">
        <section id="transcript-panel" class="panel"></section>
        <section id="digest-panel" class="panel hidden"></section>
        <section id="graph-panel" class="panel hidden"></section>
        <section id="timeline-panel" class="panel hidden"></section>
        <section id="map-panel" class="panel hidden"></section>
    </main>
</div>

<script>
const documentData = {{ document_json|safe }};
const entities = {{ entities_json|safe }};
const claims = {{ claims_json|safe }};
const graphSummary = documentData.graph_summary || null;

const state = {
    tab: "transcript",
    activeClaimId: null,
    activeEntityId: null,
    activePage: null,
    showAllClaims: false,
};

const DEMO_PLACE_LOOKUP = {
    andagoya: { lat: 5.093, lon: -76.695, label: "Andagoya, Chocó, Colombia" },
    "la cumbre": { lat: 3.648, lon: -76.568, label: "La Cumbre, Valle del Cauca, Colombia" },
    "buenos aires": { lat: 2.914, lon: -76.672, label: "Buenos Aires, Cauca, Colombia" },
    bogota: { lat: 4.711, lon: -74.072, label: "Bogotá, Colombia" },
    "bogotá": { lat: 4.711, lon: -74.072, label: "Bogotá, Colombia" },
    choco: { lat: 5.7, lon: -76.7, label: "Chocó, Colombia" },
    "chocó": { lat: 5.7, lon: -76.7, label: "Chocó, Colombia" },
    quibdo: { lat: 5.6947, lon: -76.6611, label: "Quibdó, Chocó, Colombia" },
    "quibdó": { lat: 5.6947, lon: -76.6611, label: "Quibdó, Chocó, Colombia" },
    istmina: { lat: 5.1611, lon: -76.6839, label: "Istmina, Chocó, Colombia" },
    popayan: { lat: 2.4448, lon: -76.6147, label: "Popayán, Cauca, Colombia" },
    "popayán": { lat: 2.4448, lon: -76.6147, label: "Popayán, Cauca, Colombia" },
};

const COLOMBIA_BOUNDS = {
    north: 13.6,
    south: -4.3,
    west: -79.2,
    east: -66.7,
};

function sourceHeaders() {
    const headers = {};
    if (window.ficheroToken) {
        headers["Authorization"] = "Bearer " + window.ficheroToken;
    }
    if (window.ficheroLibrary) {
        headers["X-Fichero-Library-Path"] = window.ficheroLibrary;
    }
    return headers;
}

function notify(kind, payload) {
    const handler = window.webkit?.messageHandlers?.ficheroBridge;
    if (handler) {
        handler.postMessage({ kind, ...payload });
    }
}

function normalisePlaceKey(text) {
    return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function parseFlexibleDate(raw) {
    const text = String(raw || "").trim();
    if (!text || text.toLowerCase() === "unknown") return null;
    if (/^\d{4}-\d{2}-\d{2}(t.*)?$/i.test(text) || /^\d{4}-\d{2}$/i.test(text) || /^\d{4}$/i.test(text)) {
        const isoLike = text.length === 4 ? `${text}-01-01` : (text.length === 7 ? `${text}-01` : text);
        const date = new Date(isoLike);
        return Number.isNaN(date.getTime()) ? null : date;
    }
    const withoutWeekday = text.replace(/^[A-Za-z]+,\s*/, "");
    const parsed = new Date(withoutWeekday);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
}

function displayDateRange(start, end, fallbackLabel) {
    if (fallbackLabel) return fallbackLabel;
    if (!start) return "Undated";
    const startLabel = start.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    if (!end || start.getTime() === end.getTime()) return startLabel;
    const endLabel = end.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    return `${startLabel} to ${endLabel}`;
}

function bestDateValue(values, fallbackStart, fallbackEnd) {
    for (const value of values || []) {
        const start = parseFlexibleDate(value.start || value.label);
        const end = parseFlexibleDate(value.end || value.start || value.label);
        if (start) {
            return { start, end: end || start, label: value.label || null, basis: value.basis || "asserted" };
        }
    }
    const parsedStart = parseFlexibleDate(fallbackStart);
    if (!parsedStart) return null;
    return {
        start: parsedStart,
        end: parseFlexibleDate(fallbackEnd) || parsedStart,
        label: null,
        basis: "inferred",
    };
}

function inferGeoContext() {
    const haystack = [
        documentData.name,
        documentData.page_content,
        ...entities.map((entity) => entity.canonical_name),
        ...claims.flatMap((claim) => [claim.claim_location, claim.subject_canonical, claim.object_phrase]),
    ].join(" ").toLowerCase();
    const colombiaSignals = ["colombia", "chocó", "choco", "andagoya", "bogotá", "bogota", "quibdó", "quibdo", "istmina", "popayán", "popayan"];
    const inferredCountry = colombiaSignals.some((signal) => haystack.includes(signal)) ? "Colombia" : "Unknown";
    return {
        country: inferredCountry,
        bounds: inferredCountry === "Colombia" ? COLOMBIA_BOUNDS : {
            north: 15,
            south: -15,
            west: -90,
            east: -60,
        },
    };
}

function claimSummary(claim) {
    if (claim.subject_canonical && claim.predicate_verb && claim.object_phrase) {
        return `${claim.subject_canonical} ${claim.predicate_verb} ${claim.object_phrase}`;
    }
    return claim.text;
}

function groupedClaims() {
    const groups = new Map();
    entities.forEach((entity) => groups.set(entity.id, { entity, claims: [] }));
    claims.forEach((claim) => {
        if ((claim.entity_ids || []).length === 0) {
            if (!groups.has("__ungrouped__")) {
                groups.set("__ungrouped__", {
                    entity: { id: "__ungrouped__", canonical_name: "Ungrouped claims" },
                    claims: [],
                });
            }
            groups.get("__ungrouped__").claims.push(claim);
            return;
        }
        claim.entity_ids.forEach((entityId) => {
            if (groups.has(entityId)) {
                groups.get(entityId).claims.push(claim);
            }
        });
    });
    return Array.from(groups.values()).filter((group) => group.claims.length > 0);
}

function transcriptPages() {
    const transcript = documentData.page_content || "";
    const markers = [...transcript.matchAll(/^Page\s+(\d+)\s*\n/gm)];
    if (!markers.length) {
        return [{ number: 1, content: transcript }];
    }
    return markers.map((marker, index) => ({
        number: marker[1],
        content: transcript.slice(
            marker.index + marker[0].length,
            markers[index + 1]?.index
        ),
    }));
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function renderTranscript() {
    const panel = document.getElementById("transcript-panel");
    if (!documentData.page_content) {
        panel.innerHTML = `<div class="empty">No transcript is available for this selection yet.</div>`;
        return;
    }
    panel.innerHTML = `
        <div class="transcript">${transcriptPages().map((page) => `
            <article class="transcript-page" data-page="${page.number}">
                <div class="page-marker">Page ${page.number}</div>
                <div class="transcript-page-body">${escapeHtml(page.content)}</div>
            </article>
        `).join("")}</div>
    `;
}

// Update the transcript highlight in-place without replacing the whole DOM
// (preserves scrollTop). Only falls back to a full re-render when the panel
// hasn't been rendered yet.
function updateTranscriptHighlight() {
    const panel = document.getElementById("transcript-panel");
    const transcriptEl = panel.querySelector(".transcript");
    if (!transcriptEl) {
        renderTranscript();
        return;
    }
    // Remove the existing mark, then re-apply for the active claim.
    // Replace each <mark> with its text content first.
    transcriptEl.querySelectorAll("mark[data-highlight]").forEach((mark) => {
        mark.replaceWith(document.createTextNode(mark.textContent));
        transcriptEl.normalize();
    });
    const activeClaim = claims.find((claim) => claim.id === state.activeClaimId);
    const excerpt = activeClaim?.source_excerpt;
    if (!excerpt) return;
    // Walk text nodes to find and wrap the excerpt without serialising the whole DOM.
    const walker = document.createTreeWalker(transcriptEl, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
        const idx = node.nodeValue.indexOf(excerpt);
        if (idx === -1) continue;
        const before = node.nodeValue.slice(0, idx);
        const after = node.nodeValue.slice(idx + excerpt.length);
        const mark = document.createElement("mark");
        mark.setAttribute("data-highlight", "claim");
        mark.textContent = excerpt;
        const parent = node.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(mark, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);
        break; // highlight first occurrence only
    }
}

function claimMeta(claim) {
    const bits = [];
    if (claim.source_page_label) bits.push(claim.source_page_label);
    if (claim.entity_names?.length) bits.push(claim.entity_names.join(", "));
    return bits.join(" · ");
}

function renderDigest() {
    const panel = document.getElementById("digest-panel");
    const groups = groupedClaims();
    if (groups.length === 0) {
        panel.innerHTML = `<div class="empty">No extracted claims yet for this document.</div>`;
        return;
    }
    panel.innerHTML = groups.map((group) => `
        <section class="digest-group">
            <h3>${group.entity.id && group.entity.id !== "__ungrouped__"
                ? `<button type="button" class="entity-lozenge" data-entity-id="${escapeHtml(group.entity.id)}">${escapeHtml(group.entity.canonical_name)}</button>`
                : escapeHtml(group.entity.canonical_name)}</h3>
            ${group.claims.map((claim) => `
                <div class="claim-row ${state.activeClaimId === claim.id ? "active" : ""}" data-claim-id="${claim.id}">
                    <div>${escapeHtml(claimSummary(claim))}</div>
                    <div class="claim-meta">${escapeHtml(claimMeta(claim))}</div>
                    ${claim.source_excerpt ? `<div class="claim-source-hint">Source</div>
                    <div class="claim-source">${escapeHtml(claim.source_excerpt)}</div>` : ""}
                </div>
            `).join("")}
        </section>
    `).join("");

    panel.querySelectorAll(".claim-row").forEach((row) => {
        row.addEventListener("click", () => {
            const claim = claims.find((item) => item.id === row.dataset.claimId);
            if (!claim) return;
            // Expand/collapse the claim's source passage inline, right under the
            // statement — an in-place disclosure, not a jump-away (#1467).
            row.classList.toggle("source-open");
            state.activeClaimId = claim.id;
            state.activeEntityId = claim.entity_ids?.[0] || null;
            // Update active class in-place so scroll position is preserved.
            panel.querySelectorAll(".claim-row").forEach((r) => {
                r.classList.toggle("active", r.dataset.claimId === claim.id);
            });
            updateTranscriptHighlight();
            updateGraphActiveNode();
            notify("claimSelected", {
                claimId: claim.id,
                sourceDocumentId: claim.source_document_id,
                passage: claim.source_excerpt,
                pageNumber: claim.page_number,
            });
        });
    });

    // Clicking an entity-name lozenge opens that entity (#1466). The native
    // bridge handles `entitySelected` → KGFocusState → retargets the Document
    // Inspector to the entity (#1484). stopPropagation so it doesn't also fire
    // the surrounding section's handlers.
    panel.querySelectorAll(".entity-lozenge").forEach((el) => {
        el.addEventListener("click", (event) => {
            event.stopPropagation();
            const entityId = el.dataset.entityId;
            if (!entityId) return;
            const entityClaims = claims.filter((item) => (item.entity_ids || []).includes(entityId));
            state.activeEntityId = entityId;
            updateGraphActiveNode();
            notify("entitySelected", {
                entityId: entityId,
                sourceDocumentId: entityClaims[0]?.source_document_id || null,
            });
        });
    });
}

function graphPageMatches(claim) {
    if (state.activePage == null || state.showAllClaims) return true;
    return Number(claim.page_number) === Number(state.activePage);
}

function graphClaims() {
    return claims.filter(graphPageMatches);
}

function graphData() {
    const scopedClaims = graphClaims();
    const scopedEntityIds = new Set();
    scopedClaims.forEach((claim) => {
        (claim.entity_ids || []).forEach((id) => scopedEntityIds.add(id));
    });
    const visibleEntities = entities.filter((entity) => scopedEntityIds.has(entity.id));
    const nodes = visibleEntities.map((entity) => {
        const entityClaims = scopedClaims.filter((claim) => (claim.entity_ids || []).includes(entity.id));
        return {
            ...entity,
            claimCount: entityClaims.length,
            radius: 16 + Math.min(14, Math.sqrt(Math.max(entityClaims.length, 1)) * 5),
            x: 220,
            y: 170,
            vx: 0,
            vy: 0,
            pages: new Set(entityClaims.map((claim) => claim.page_number).filter((page) => page != null)),
        };
    });
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    const edgeMap = new Map();
    scopedClaims.forEach((claim) => {
        const ids = [...new Set(claim.entity_ids || [])].filter((id) => nodeLookup.has(id));
        for (let idx = 0; idx < ids.length; idx += 1) {
            for (let other = idx + 1; other < ids.length; other += 1) {
                const pair = [ids[idx], ids[other]].sort();
                const key = pair.join("::");
                const edge = edgeMap.get(key) || { from: pair[0], to: pair[1], weight: 0 };
                edge.weight += 1;
                edgeMap.set(key, edge);
            }
        }
    });
    return { nodes, edges: [...edgeMap.values()] };
}

function forceLayout(nodes, edges, width = 440, height = 340) {
    if (nodes.length === 1) {
        nodes[0].x = width / 2;
        nodes[0].y = height / 2;
        return nodes;
    }
    nodes.forEach((node, index) => {
        const angle = (Math.PI * 2 * index) / Math.max(nodes.length, 1);
        const radius = 80 + (index % 3) * 22;
        node.x = width / 2 + Math.cos(angle) * radius;
        node.y = height / 2 + Math.sin(angle) * radius;
    });
    const lookup = new Map(nodes.map((node) => [node.id, node]));
    for (let tick = 0; tick < 180; tick += 1) {
        for (let i = 0; i < nodes.length; i += 1) {
            for (let j = i + 1; j < nodes.length; j += 1) {
                const a = nodes[i];
                const b = nodes[j];
                const dx = b.x - a.x || 0.01;
                const dy = b.y - a.y || 0.01;
                const dist2 = Math.max(dx * dx + dy * dy, 64);
                const force = 5200 / dist2;
                const fx = (dx / Math.sqrt(dist2)) * force;
                const fy = (dy / Math.sqrt(dist2)) * force;
                a.vx -= fx;
                a.vy -= fy;
                b.vx += fx;
                b.vy += fy;
            }
        }
        edges.forEach((edge) => {
            const source = lookup.get(edge.from);
            const target = lookup.get(edge.to);
            if (!source || !target) return;
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
            const desired = Math.max(62, 130 - Math.min(edge.weight, 8) * 8);
            const pull = (dist - desired) * (0.018 + Math.min(edge.weight, 8) * 0.004);
            const fx = (dx / dist) * pull;
            const fy = (dy / dist) * pull;
            source.vx += fx;
            source.vy += fy;
            target.vx -= fx;
            target.vy -= fy;
        });
        nodes.forEach((node) => {
            node.vx += (width / 2 - node.x) * 0.004;
            node.vy += (height / 2 - node.y) * 0.004;
            node.vx *= 0.72;
            node.vy *= 0.72;
            node.x = Math.max(node.radius + 8, Math.min(width - node.radius - 8, node.x + node.vx));
            node.y = Math.max(node.radius + 8, Math.min(height - node.radius - 8, node.y + node.vy));
        });
    }
    return nodes;
}

function renderGraph() {
    const panel = document.getElementById("graph-panel");
    const { nodes, edges } = graphData();
    const panelRect = panel.getBoundingClientRect();
    const width = Math.max(440, Math.floor(panelRect.width - 24));
    const height = Math.max(340, Math.floor(panelRect.height - 56));
    const pageScoped = state.activePage != null && !state.showAllClaims;
    const scopeLabel = state.activePage == null
        ? "Showing all claims in this document."
        : (pageScoped
            ? `Showing page ${state.activePage} claims.`
            : `Showing all claims in this document.`);
    const summary = graphSummary && (
        graphSummary.shown_entities < graphSummary.total_entities ||
        graphSummary.shown_claims < graphSummary.total_claims
    ) ? ` Showing ${graphSummary.shown_entities} of ${graphSummary.total_entities} entities and ${graphSummary.shown_claims} of ${graphSummary.total_claims} claims; select a node to load its neighborhood.` : "";
    const toggle = state.activePage == null ? "" : `
        <button type="button" class="graph-scope-toggle" data-graph-scope-toggle="true">
            ${state.showAllClaims ? "Show current page only" : "Show all claims"}
        </button>
    `;
    if (nodes.length === 0) {
        panel.innerHTML = `
            <div class="graph-toolbar">
                <span>${escapeHtml(scopeLabel + summary)}</span>
                ${toggle}
            </div>
            <div class="empty">No entities yet for this ${pageScoped ? "page" : "document"}.</div>
        `;
        bindGraphScopeToggle(panel);
        return;
    }
    forceLayout(nodes, edges, width, height);
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    panel.innerHTML = `
        <div class="graph-toolbar">
            <span>${escapeHtml(scopeLabel + summary)} ${nodes.length} node${nodes.length === 1 ? "" : "s"}.</span>
            ${toggle}
        </div>
        <div class="graph-wrap">
            <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph: entities for this document. Page scope filters claims unless all claims are shown.">
                ${edges.map((edge) => {
                    const source = nodeLookup.get(edge.from);
                    const target = nodeLookup.get(edge.to);
                    if (!source || !target) return "";
                    const width = 1 + Math.min(6, edge.weight);
                    return `<line class="edge" x1="${source.x.toFixed(1)}" y1="${source.y.toFixed(1)}" x2="${target.x.toFixed(1)}" y2="${target.y.toFixed(1)}" stroke-width="${width}"></line>`;
                }).join("")}
                ${nodes.map((node) => {
                    const active = state.activeEntityId === node.id;
                    return `
                        <g class="node ${active ? "active" : ""}" data-entity-id="${node.id}" transform="translate(${node.x.toFixed(1)}, ${node.y.toFixed(1)})">
                            <circle r="${node.radius.toFixed(1)}"></circle>
                            <text text-anchor="middle" y="4">${escapeHtml(node.canonical_name.slice(0, 14))}</text>
                            <text text-anchor="middle" y="20" font-size="10">${node.claimCount} claim${node.claimCount === 1 ? "" : "s"}</text>
                        </g>
                    `;
                }).join("")}
            </svg>
        </div>
    `;

    bindGraphScopeToggle(panel);

    panel.querySelectorAll(".node").forEach((nodeEl) => {
        nodeEl.addEventListener("click", async () => {
            const entityId = nodeEl.dataset.entityId;
            const entityClaims = graphClaims().filter((claim) => (claim.entity_ids || []).includes(entityId));
            const sourceDocumentId = entityClaims[0]?.source_document_id || null;
            state.activeEntityId = entityId;
            state.activeClaimId = entityClaims[0]?.id || null;
            // Update graph active/dimmed classes in-place; preserve scrollTop.
            updateGraphActiveNode();
            updateTranscriptHighlight();
            notify("entitySelected", {
                entityId,
                sourceDocumentId,
                pageNumber: entityClaims[0]?.page_number || null,
            });
            if (window.ficheroToken && sourceHeaders()["X-Fichero-Library-Path"]) {
                try {
                    await fetch(`/api/kg/graph/neighborhood/${entityId}`, {
                        headers: sourceHeaders(),
                    });
                } catch (_error) {
                    // Best-effort warm-up only.
                }
            }
        });
    });
}

function bindGraphScopeToggle(panel) {
    const toggle = panel.querySelector("[data-graph-scope-toggle='true']");
    if (!toggle) return;
    toggle.addEventListener("click", () => {
        state.showAllClaims = !state.showAllClaims;
        renderGraph();
    });
}

function timelineItems() {
    const eventItems = entities
        .filter((entity) => entity.entity_type === "event")
        .map((entity) => {
            const range = bestDateValue(entity.date_values, null, null);
            if (!range) return null;
            return {
                id: `entity-${entity.id}`,
                itemType: "entity",
                entityId: entity.id,
                claimId: null,
                title: entity.canonical_name,
                body: entity.description || "Event entity",
                start: range.start,
                end: range.end,
                dateLabel: displayDateRange(range.start, range.end, range.label),
                basis: range.basis,
                tags: ["Event"],
            };
        })
        .filter(Boolean);

    const claimItems = claims
        .map((claim) => {
            const range = bestDateValue(claim.date_values, claim.time_start, claim.time_end);
            if (!range) return null;
            return {
                id: `claim-${claim.id}`,
                itemType: "claim",
                entityId: claim.subject_entity_id || claim.entity_ids?.[0] || null,
                claimId: claim.id,
                title: claimSummary(claim),
                body: claim.source_excerpt || claim.text,
                start: range.start,
                end: range.end,
                dateLabel: displayDateRange(range.start, range.end, range.label),
                basis: range.basis,
                tags: ["Claim"].concat(claim.subject_canonical ? [claim.subject_canonical] : []),
            };
        })
        .filter(Boolean);

    return [...eventItems, ...claimItems].sort((lhs, rhs) => lhs.start - rhs.start);
}

function renderTimeline() {
    const panel = document.getElementById("timeline-panel");
    const items = timelineItems();
    if (items.length === 0) {
        panel.innerHTML = `<div class="empty">No dated events or claims are available for this document yet.</div>`;
        return;
    }

    panel.innerHTML = `
        <div class="timeline-list">
            <div class="timeline-meta">${items.length} chronological item${items.length === 1 ? "" : "s"} from event entities and dated claims.</div>
            <div class="timeline-list-items">
                ${items.map((item) => `
                    <article class="timeline-item ${state.activeClaimId === item.claimId || state.activeEntityId === item.entityId ? "active" : ""}" data-timeline-id="${item.id}">
                        <div class="timeline-item-header">
                            <div class="timeline-item-title">${escapeHtml(item.title)}</div>
                            <div class="timeline-item-date">${escapeHtml(item.dateLabel)}</div>
                        </div>
                        <div class="timeline-item-body">${escapeHtml(item.body || "")}</div>
                        <div class="timeline-item-tags">
                            ${item.tags.map((tag) => `<span class="timeline-tag">${escapeHtml(tag)}</span>`).join("")}
                            <span class="timeline-tag">${item.basis === "inferred" ? "Inferred" : "Asserted"}</span>
                        </div>
                    </article>
                `).join("")}
            </div>
        </div>
    `;

    panel.querySelectorAll(".timeline-item").forEach((element) => {
        element.addEventListener("click", () => {
            const item = items.find((entry) => entry.id === element.dataset.timelineId);
            if (!item) return;
            state.activeEntityId = item.entityId;
            state.activeClaimId = item.claimId;
            if (item.claimId) {
                const claim = claims.find((entry) => entry.id === item.claimId);
                notify("claimSelected", {
                    claimId: item.claimId,
                    sourceDocumentId: claim?.source_document_id || documentData.id,
                    pageNumber: claim?.page_number || null,
                    pageLabel: claim?.source_page_label || null,
                });
            } else if (item.entityId) {
                notify("entitySelected", {
                    entityId: item.entityId,
                    sourceDocumentId: documentData.id,
                });
            }
            renderTimeline();
            updateTranscriptHighlight();
            updateGraphActiveNode();
            renderMap();
        });
    });
}

function resolvePlaceEntity(entity, inferredCountry) {
    for (const place of entity.place_values || []) {
        if (place.lat != null && place.lon != null) {
            return {
                entityId: entity.id,
                name: entity.canonical_name,
                label: place.label || entity.canonical_name,
                lat: place.lat,
                lon: place.lon,
                basis: place.basis || "asserted",
                detail: place.label || "Entity place evidence",
            };
        }
    }

    const candidates = [entity.canonical_name, ...(entity.aliases || [])];
    for (const candidate of candidates) {
        const lookup = DEMO_PLACE_LOOKUP[normalisePlaceKey(candidate)];
        if (lookup) {
            return {
                entityId: entity.id,
                name: entity.canonical_name,
                label: lookup.label,
                lat: lookup.lat,
                lon: lookup.lon,
                basis: inferredCountry === "Colombia" ? "inferred" : "asserted",
                detail: "Resolved by Colombia-biased demo lookup",
            };
        }
    }
    return null;
}

function projectPoint(lat, lon, width, height, padding, bounds) {
    const usableWidth = width - padding * 2;
    const usableHeight = height - padding * 2;
    const x = padding + ((lon - bounds.west) / (bounds.east - bounds.west)) * usableWidth;
    const y = padding + ((bounds.north - lat) / (bounds.north - bounds.south)) * usableHeight;
    return { x, y };
}

function renderMap() {
    const panel = document.getElementById("map-panel");
    const geoContext = inferGeoContext();
    const resolved = entities
        .filter((entity) => entity.entity_type === "location")
        .map((entity) => resolvePlaceEntity(entity, geoContext.country))
        .filter(Boolean);
    const unresolvedCount = entities.filter((entity) => entity.entity_type === "location").length - resolved.length;

    if (resolved.length === 0) {
        panel.innerHTML = `<div class="empty">No place entities could be resolved to map coordinates for this document yet.</div>`;
        return;
    }

    const width = 900;
    const height = 500;
    const padding = 54;

    panel.innerHTML = `
        <div class="map-shell">
            <div class="map-meta">${resolved.length} mapped place entit${resolved.length === 1 ? "y" : "ies"} · ${unresolvedCount} unresolved.</div>
            <div class="map-viewport">
                <div class="map-caption">
                    <span>${escapeHtml(geoContext.country === "Colombia" ? "Colombia-focused extent" : "Document-focused extent")}</span>
                    <span>${escapeHtml(geoContext.country === "Colombia" ? "Fallback lookup is biased to Colombia for this diary demo." : "Exact basemap geocoding is still a TODO(demo).")}</span>
                </div>
                <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Resolved places for this document">
                    <rect x="${padding}" y="${padding}" width="${width - padding * 2}" height="${height - padding * 2}" rx="18" ry="18" fill="rgba(13, 107, 111, 0.04)" stroke="rgba(64, 53, 39, 0.12)"></rect>
                    ${resolved.map((place) => {
                        const point = projectPoint(place.lat, place.lon, width, height, padding, geoContext.bounds);
                        const active = state.activeEntityId === place.entityId;
                        const fill = place.basis === "inferred" ? "rgba(13, 107, 111, 0.22)" : "rgba(13, 107, 111, 0.9)";
                        const stroke = active ? "var(--claim)" : "var(--accent)";
                        return `
                            <g class="map-marker" data-entity-id="${escapeHtml(place.entityId)}">
                                <circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="${active ? 9 : 7}" fill="${fill}" stroke="${stroke}" stroke-width="${active ? 3 : 2}"></circle>
                                <text x="${(point.x + 12).toFixed(1)}" y="${(point.y + 4).toFixed(1)}" font-size="12" font-weight="600" fill="var(--text)">${escapeHtml(place.name)}</text>
                            </g>
                        `;
                    }).join("")}
                </svg>
            </div>
            <div class="map-place-list">
                ${resolved.map((place) => `
                    <article class="map-place-card ${state.activeEntityId === place.entityId ? "active" : ""}" data-entity-id="${escapeHtml(place.entityId)}">
                        <div class="map-place-name">${escapeHtml(place.name)}</div>
                        <div class="map-place-detail">${escapeHtml(place.label)}</div>
                        <div class="map-place-detail">${escapeHtml(`${place.lat.toFixed(3)}, ${place.lon.toFixed(3)} · ${place.basis === "inferred" ? "Inferred" : "Asserted"}`)}</div>
                    </article>
                `).join("")}
            </div>
        </div>
    `;

    panel.querySelectorAll("[data-entity-id]").forEach((element) => {
        element.addEventListener("click", () => {
            const entityId = element.dataset.entityId;
            state.activeEntityId = entityId;
            notify("entitySelected", {
                entityId,
                sourceDocumentId: documentData.id,
            });
            renderMap();
            renderTimeline();
            updateGraphActiveNode();
        });
    });
}

function renderAll() {
    renderTranscript();
    renderDigest();
    renderGraph();
    renderTimeline();
    renderMap();
    document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
    });
    ["transcript", "digest", "graph", "timeline", "map"].forEach((tab) => {
        document.getElementById(`${tab}-panel`).classList.toggle("hidden", tab !== state.tab);
    });
}

// Update graph node active/dimmed state in-place (no innerHTML swap, no scrollTop loss).
function updateGraphActiveNode() {
    const panel = document.getElementById("graph-panel");
    panel.querySelectorAll(".node").forEach((nodeEl) => {
        const id = nodeEl.dataset.entityId;
        const active = state.activeEntityId === id;
        nodeEl.classList.toggle("active", active);
    });
}

// Show/hide tab panels without a full re-render.
function applyTabVisibility() {
    document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
    });
    ["transcript", "digest", "graph", "timeline", "map"].forEach((tab) => {
        document.getElementById(`${tab}-panel`).classList.toggle("hidden", tab !== state.tab);
    });
}

// Scroll the transcript to a character range and highlight it.
// page is informational (reserved for multi-page support); charStart/charEnd
// are byte offsets into documentData.page_content.
function scrollToCharRange(charStart, charEnd) {
    const panel = document.getElementById("transcript-panel");
    const transcriptEl = panel.querySelector(".transcript");
    if (!transcriptEl) return;

    // Remove existing range highlights.
    transcriptEl.querySelectorAll("mark[data-highlight='span']").forEach((mark) => {
        mark.replaceWith(document.createTextNode(mark.textContent));
        transcriptEl.normalize();
    });

    if (charStart == null || charEnd == null || charEnd <= charStart) return;

    const transcript = documentData.page_content || "";
    const excerpt = transcript.slice(charStart, charEnd);
    if (!excerpt) return;

    // Walk text nodes to find and wrap the range.
    let charOffset = 0;
    const walker = document.createTreeWalker(transcriptEl, NodeFilter.SHOW_TEXT);
    let targetMark = null;
    let node;
    while ((node = walker.nextNode())) {
        const nodeLen = node.nodeValue.length;
        const nodeStart = charOffset;
        const nodeEnd = charOffset + nodeLen;
        charOffset = nodeEnd;

        if (nodeEnd <= charStart || nodeStart >= charEnd) continue;

        // This node overlaps the range — for simplicity, match the first node
        // that contains the start of the range.
        const localStart = charStart - nodeStart;
        const localEnd = Math.min(charEnd - nodeStart, nodeLen);
        if (localStart < 0 || localStart >= nodeLen) continue;

        const before = node.nodeValue.slice(0, localStart);
        const highlighted = node.nodeValue.slice(localStart, localEnd);
        const after = node.nodeValue.slice(localEnd);
        const mark = document.createElement("mark");
        mark.setAttribute("data-highlight", "span");
        mark.textContent = highlighted;
        const parent = node.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(mark, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);
        targetMark = mark;
        break;
    }

    if (targetMark) {
        targetMark.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

document.querySelectorAll(".tabs button").forEach((button) => {
    button.addEventListener("click", () => {
        state.tab = button.dataset.tab;
        applyTabVisibility();
        if (state.tab === "graph") {
            requestAnimationFrame(renderGraph);
        } else if (state.tab === "map") {
            requestAnimationFrame(renderMap);
        }
    });
});

let graphResizeTimer = null;
window.addEventListener("resize", () => {
    if (state.tab !== "graph" && state.tab !== "map") return;
    window.clearTimeout(graphResizeTimer);
    graphResizeTimer = window.setTimeout(() => {
        if (state.tab === "graph") {
            renderGraph();
        } else if (state.tab === "map") {
            renderMap();
        }
    }, 80);
});

window.fichero = {
    // Switch visible tab without re-rendering content panels.
    showTab(tab) {
        if (!["transcript", "digest", "graph", "timeline", "map"].includes(tab)) return;
        state.tab = tab;
        applyTabVisibility();
        if (tab === "graph") {
            requestAnimationFrame(renderGraph);
        } else if (tab === "map") {
            requestAnimationFrame(renderMap);
        }
    },

    // Highlight a graph node in-place; no innerHTML swap, no scrollTop loss.
    pulseNode(entityId) {
        state.activeEntityId = entityId;
        updateGraphActiveNode();
    },

    // Highlight a claim in the digest and transcript in-place.
    // Preserves .content scrollTop.
    highlightClaim(claimId) {
        state.activeClaimId = claimId;
        const claim = claims.find((item) => item.id === claimId);
        if (claim?.entity_ids?.length) {
            state.activeEntityId = claim.entity_ids[0];
        }
        // Update digest active class in-place.
        document.getElementById("digest-panel").querySelectorAll(".claim-row").forEach((row) => {
            row.classList.toggle("active", row.dataset.claimId === claimId);
        });
        updateTranscriptHighlight();
        updateGraphActiveNode();
        renderTimeline();
        renderMap();
    },

    // Re-scope the graph to the active page unless the user asks for all claims.
    setActivePage(pageNumber) {
        if (Number(state.activePage) !== Number(pageNumber)) {
            state.showAllClaims = false;
        }
        state.activePage = pageNumber;
        renderGraph();
    },

    // Scroll the transcript to a character span and highlight it.
    // Called from Swift (Coordinator.syncSelection) when a claim is focused.
    // page is reserved for future multi-page documents.
    scrollToSpan(page, charStart, charEnd) {
        // Ensure transcript tab is visible.
        if (state.tab !== "transcript") {
            state.tab = "transcript";
            applyTabVisibility();
        }
        scrollToCharRange(charStart, charEnd);
    },

    // Highlight an entity node in the graph in-place.
    // Previously a no-op (called via optional chaining from Swift).
    highlightEntity(entityId) {
        state.activeEntityId = entityId;
        // Find and set the first associated claim as active for digest sync.
        const firstClaim = claims.find((c) => (c.entity_ids || []).includes(entityId));
        if (firstClaim) {
            state.activeClaimId = firstClaim.id;
            document.getElementById("digest-panel").querySelectorAll(".claim-row").forEach((row) => {
                row.classList.toggle("active", row.dataset.claimId === firstClaim.id);
            });
            updateTranscriptHighlight();
        }
        updateGraphActiveNode();
        renderTimeline();
        renderMap();
    },
};

renderAll();
</script>
