<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ document.name }}</title>
    <style>
        :root {
            color-scheme: light dark;
            /* Apple system defaults — match the native app chrome (#1228). */
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
            --bg: #f7f4ee;
            --panel: rgba(255, 255, 255, 0.85);
            --text: #1f1d1a;
            --muted: #6a6258;
            --line: rgba(64, 53, 39, 0.14);
            --accent: #0d6b6f;
            --accent-soft: rgba(13, 107, 111, 0.14);
            --claim: #b45014;
            --claim-soft: rgba(180, 80, 20, 0.14);
        }

        /* Browser fallback for dark mode. In the Fichero app these are
           overridden by live macOS system colors injected from Swift
           (DocumentKGPaneRoute.systemThemeCSS), so the pane matches the OS
           appearance + accent exactly. */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1b18;
                --panel: rgba(44, 40, 36, 0.85);
                --text: #ece7df;
                --muted: #a59b8d;
                --line: rgba(236, 231, 223, 0.16);
                --accent: #3fb6ba;
                --accent-soft: rgba(63, 182, 186, 0.18);
                --claim: #e0793a;
                --claim-soft: rgba(224, 121, 58, 0.20);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-system);
            /* Flat macOS-style surface that matches the Document Inspector:
               the live system background (var(--bg) is overridden from Swift
               with .textBackgroundColor), not a cream "paper" gradient (#1280). */
            background: var(--bg);
            color: var(--text);
        }

        .shell {
            /* Fixed viewport height so only `.content` scrolls. The native
               Swift toolbar owns tab switching, and the page no longer carries
               its own title/eyebrow header — the app's selection already says
               what's shown, so the chrome would be redundant (#1244). */
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr;
        }

        /* The native Swift toolbar (DocumentKGSurface) now owns the
           Transcript/Digest/Graph switcher, so the in-page tab bar is hidden.
           The markup is retained: `fichero.showTab` drives it, and it remains
           a working fallback when the page is opened directly in a browser. */
        .tabs {
            display: none;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.6);
        }

        .tabs button {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font: 600 12px/1.2 var(--font-system);
            padding: 7px 12px;
            cursor: pointer;
        }

        .tabs button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .content {
            overflow: auto;
            padding: 12px;
        }

        .panel {
            /* Flat, square, seamless with the page background — no rounded
               "paper card" border-radius/shadow. Matches the inspector's flat
               treatment (#1280). */
            background: var(--bg);
            padding: 12px;
        }

        .hidden { display: none; }

        .empty {
            color: var(--muted);
            font: 500 13px/1.5 var(--font-system);
            padding: 16px;
        }

        .transcript {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .transcript mark {
            background: rgba(255, 223, 128, 0.75);
            border-radius: 3px;
            padding: 0 2px;
        }

        .digest-group + .digest-group {
            margin-top: 18px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
        }

        .digest-group h3 {
            margin: 0 0 10px;
            font: 700 14px/1.3 var(--font-system);
        }

        .claim-row {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .claim-row + .claim-row { margin-top: 8px; }

        .claim-row.active {
            border-color: var(--claim);
            background: var(--claim-soft);
        }

        .claim-meta {
            margin-top: 6px;
            color: var(--muted);
            font: 500 11px/1.4 var(--font-mono);
        }

        .graph-wrap {
            min-height: 340px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 360px;
            display: block;
        }

        .node {
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        .node.dimmed { opacity: 0.35; }
        .node.active circle { fill: var(--accent); }
        .node.active text { fill: var(--accent); font-weight: 700; }
        .node circle {
            fill: rgba(13, 107, 111, 0.16);
            stroke: var(--accent);
            stroke-width: 1.5;
        }

        .node text {
            font: 600 12px/1.2 var(--font-system);
            fill: var(--text);
        }

        .edge {
            stroke: rgba(64, 53, 39, 0.24);
            stroke-linecap: round;
        }

        .legend {
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="shell">
    <nav class="tabs">
        <button type="button" data-tab="transcript" class="active">Transcript</button>
        <button type="button" data-tab="digest">Digest</button>
        <button type="button" data-tab="graph">Graph</button>
    </nav>
    <main class="content">
        <section id="transcript-panel" class="panel"></section>
        <section id="digest-panel" class="panel hidden"></section>
        <section id="graph-panel" class="panel hidden"></section>
    </main>
</div>

<script>
const documentData = {{ document_json|safe }};
const entities = {{ entities_json|safe }};
const claims = {{ claims_json|safe }};

const state = {
    tab: "transcript",
    activeClaimId: null,
    activeEntityId: null,
    activePage: null,
};

function sourceHeaders() {
    const headers = {};
    if (window.ficheroToken) {
        headers["Authorization"] = "Bearer " + window.ficheroToken;
    }
    if (window.ficheroLibrary) {
        headers["X-Fichero-Library-Path"] = window.ficheroLibrary;
    }
    return headers;
}

function notify(kind, payload) {
    const handler = window.webkit?.messageHandlers?.ficheroBridge;
    if (handler) {
        handler.postMessage({ kind, ...payload });
    }
}

function claimSummary(claim) {
    if (claim.subject_canonical && claim.predicate_verb && claim.object_phrase) {
        return `${claim.subject_canonical} ${claim.predicate_verb} ${claim.object_phrase}`;
    }
    return claim.text;
}

function groupedClaims() {
    const groups = new Map();
    entities.forEach((entity) => groups.set(entity.id, { entity, claims: [] }));
    claims.forEach((claim) => {
        if ((claim.entity_ids || []).length === 0) {
            if (!groups.has("__ungrouped__")) {
                groups.set("__ungrouped__", {
                    entity: { id: "__ungrouped__", canonical_name: "Ungrouped claims" },
                    claims: [],
                });
            }
            groups.get("__ungrouped__").claims.push(claim);
            return;
        }
        claim.entity_ids.forEach((entityId) => {
            if (groups.has(entityId)) {
                groups.get(entityId).claims.push(claim);
            }
        });
    });
    return Array.from(groups.values()).filter((group) => group.claims.length > 0);
}

function highlightedTranscript() {
    const transcript = documentData.page_content || "";
    const activeClaim = claims.find((claim) => claim.id === state.activeClaimId);
    const excerpt = activeClaim?.source_excerpt;
    if (!excerpt || !transcript.includes(excerpt)) {
        return escapeHtml(transcript);
    }
    return escapeHtml(transcript).replace(
        escapeRegExpHtml(excerpt),
        `<mark>${escapeHtml(excerpt)}</mark>`
    );
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function escapeRegExpHtml(text) {
    return escapeHtml(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function renderTranscript() {
    const panel = document.getElementById("transcript-panel");
    if (!documentData.page_content) {
        panel.innerHTML = `<div class="empty">No transcript is available for this selection yet.</div>`;
        return;
    }
    panel.innerHTML = `
        <div class="transcript">${highlightedTranscript()}</div>
    `;
}

function claimMeta(claim) {
    const bits = [];
    if (claim.source_page_label) bits.push(claim.source_page_label);
    if (claim.entity_names?.length) bits.push(claim.entity_names.join(", "));
    return bits.join(" · ");
}

function renderDigest() {
    const panel = document.getElementById("digest-panel");
    const groups = groupedClaims();
    if (groups.length === 0) {
        panel.innerHTML = `<div class="empty">No extracted claims yet for this document.</div>`;
        return;
    }
    panel.innerHTML = groups.map((group) => `
        <section class="digest-group">
            <h3>${escapeHtml(group.entity.canonical_name)}</h3>
            ${group.claims.map((claim) => `
                <div class="claim-row ${state.activeClaimId === claim.id ? "active" : ""}" data-claim-id="${claim.id}">
                    <div>${escapeHtml(claimSummary(claim))}</div>
                    ${claim.source_excerpt ? `<div class="claim-meta">${escapeHtml(claim.source_excerpt)}</div>` : ""}
                    <div class="claim-meta">${escapeHtml(claimMeta(claim))}</div>
                </div>
            `).join("")}
        </section>
    `).join("");

    panel.querySelectorAll(".claim-row").forEach((row) => {
        row.addEventListener("click", () => {
            const claim = claims.find((item) => item.id === row.dataset.claimId);
            if (!claim) return;
            state.activeClaimId = claim.id;
            state.activeEntityId = claim.entity_ids?.[0] || null;
            renderAll();
            notify("claimSelected", {
                claimId: claim.id,
                sourceDocumentId: claim.source_document_id,
                passage: claim.source_excerpt,
                pageNumber: claim.page_number,
            });
        });
    });
}

function graphData() {
    const nodes = entities.map((entity) => {
        const entityClaims = claims.filter((claim) => (claim.entity_ids || []).includes(entity.id));
        return {
            ...entity,
            claimCount: entityClaims.length,
            radius: 16 + Math.min(14, Math.sqrt(Math.max(entityClaims.length, 1)) * 5),
            x: 220,
            y: 170,
            vx: 0,
            vy: 0,
            pages: new Set(entityClaims.map((claim) => claim.page_number).filter((page) => page != null)),
        };
    });
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    const edgeMap = new Map();
    claims.forEach((claim) => {
        const ids = [...new Set(claim.entity_ids || [])].filter((id) => nodeLookup.has(id));
        for (let idx = 0; idx < ids.length; idx += 1) {
            for (let other = idx + 1; other < ids.length; other += 1) {
                const pair = [ids[idx], ids[other]].sort();
                const key = pair.join("::");
                const edge = edgeMap.get(key) || { from: pair[0], to: pair[1], weight: 0 };
                edge.weight += 1;
                edgeMap.set(key, edge);
            }
        }
    });
    return { nodes, edges: [...edgeMap.values()] };
}

function forceLayout(nodes, edges, width = 440, height = 340) {
    if (nodes.length === 1) {
        nodes[0].x = width / 2;
        nodes[0].y = height / 2;
        return nodes;
    }
    nodes.forEach((node, index) => {
        const angle = (Math.PI * 2 * index) / Math.max(nodes.length, 1);
        const radius = 80 + (index % 3) * 22;
        node.x = width / 2 + Math.cos(angle) * radius;
        node.y = height / 2 + Math.sin(angle) * radius;
    });
    const lookup = new Map(nodes.map((node) => [node.id, node]));
    for (let tick = 0; tick < 180; tick += 1) {
        for (let i = 0; i < nodes.length; i += 1) {
            for (let j = i + 1; j < nodes.length; j += 1) {
                const a = nodes[i];
                const b = nodes[j];
                const dx = b.x - a.x || 0.01;
                const dy = b.y - a.y || 0.01;
                const dist2 = Math.max(dx * dx + dy * dy, 64);
                const force = 5200 / dist2;
                const fx = (dx / Math.sqrt(dist2)) * force;
                const fy = (dy / Math.sqrt(dist2)) * force;
                a.vx -= fx;
                a.vy -= fy;
                b.vx += fx;
                b.vy += fy;
            }
        }
        edges.forEach((edge) => {
            const source = lookup.get(edge.from);
            const target = lookup.get(edge.to);
            if (!source || !target) return;
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
            const desired = Math.max(62, 130 - Math.min(edge.weight, 8) * 8);
            const pull = (dist - desired) * (0.018 + Math.min(edge.weight, 8) * 0.004);
            const fx = (dx / dist) * pull;
            const fy = (dy / dist) * pull;
            source.vx += fx;
            source.vy += fy;
            target.vx -= fx;
            target.vy -= fy;
        });
        nodes.forEach((node) => {
            node.vx += (width / 2 - node.x) * 0.004;
            node.vy += (height / 2 - node.y) * 0.004;
            node.vx *= 0.72;
            node.vy *= 0.72;
            node.x = Math.max(node.radius + 8, Math.min(width - node.radius - 8, node.x + node.vx));
            node.y = Math.max(node.radius + 8, Math.min(height - node.radius - 8, node.y + node.vy));
        });
    }
    return nodes;
}

function renderGraph() {
    const panel = document.getElementById("graph-panel");
    if (entities.length === 0) {
        panel.innerHTML = `<div class="empty">No entities yet for this document.</div>`;
        return;
    }
    const { nodes, edges } = graphData();
    forceLayout(nodes, edges);
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    panel.innerHTML = `
        <div class="legend">Entity graph for the current document. Active page filtering dims off-page entities.</div>
        <div class="graph-wrap">
            <svg viewBox="0 0 440 340" role="img" aria-label="Knowledge graph">
                ${edges.map((edge) => {
                    const source = nodeLookup.get(edge.from);
                    const target = nodeLookup.get(edge.to);
                    if (!source || !target) return "";
                    const width = 1 + Math.min(6, edge.weight);
                    return `<line class="edge" x1="${source.x.toFixed(1)}" y1="${source.y.toFixed(1)}" x2="${target.x.toFixed(1)}" y2="${target.y.toFixed(1)}" stroke-width="${width}"></line>`;
                }).join("")}
                ${nodes.map((node) => {
                    const active = state.activeEntityId === node.id;
                    const dimmed = state.activePage && !node.pages.has(state.activePage);
                    return `
                        <g class="node ${active ? "active" : ""} ${dimmed ? "dimmed" : ""}" data-entity-id="${node.id}" transform="translate(${node.x.toFixed(1)}, ${node.y.toFixed(1)})">
                            <circle r="${node.radius.toFixed(1)}"></circle>
                            <text text-anchor="middle" y="4">${escapeHtml(node.canonical_name.slice(0, 14))}</text>
                            <text text-anchor="middle" y="20" font-size="10">${node.claimCount} claim${node.claimCount === 1 ? "" : "s"}</text>
                        </g>
                    `;
                }).join("")}
            </svg>
        </div>
    `;

    panel.querySelectorAll(".node").forEach((nodeEl) => {
        nodeEl.addEventListener("click", async () => {
            const entityId = nodeEl.dataset.entityId;
            const entityClaims = claims.filter((claim) => (claim.entity_ids || []).includes(entityId));
            const sourceDocumentId = entityClaims[0]?.source_document_id || null;
            state.activeEntityId = entityId;
            state.activeClaimId = entityClaims[0]?.id || null;
            renderAll();
            notify("entitySelected", {
                entityId,
                sourceDocumentId,
                pageNumber: entityClaims[0]?.page_number || null,
            });
            if (window.ficheroToken && sourceHeaders()["X-Fichero-Library-Path"]) {
                try {
                    await fetch(`http://localhost:8765/api/kg/graph/neighborhood/${entityId}`, {
                        headers: sourceHeaders(),
                    });
                } catch (_error) {
                    // Best-effort warm-up only.
                }
            }
        });
    });
}

function renderAll() {
    renderTranscript();
    renderDigest();
    renderGraph();
    document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
    });
    ["transcript", "digest", "graph"].forEach((tab) => {
        document.getElementById(`${tab}-panel`).classList.toggle("hidden", tab !== state.tab);
    });
}

document.querySelectorAll(".tabs button").forEach((button) => {
    button.addEventListener("click", () => {
        state.tab = button.dataset.tab;
        renderAll();
    });
});

window.fichero = {
    showTab(tab) {
        if (!["transcript", "digest", "graph"].includes(tab)) return;
        state.tab = tab;
        renderAll();
    },
    pulseNode(entityId) {
        state.activeEntityId = entityId;
        renderAll();
    },
    highlightClaim(claimId) {
        state.activeClaimId = claimId;
        const claim = claims.find((item) => item.id === claimId);
        if (claim?.entity_ids?.length) {
            state.activeEntityId = claim.entity_ids[0];
        }
        renderAll();
    },
    setActivePage(pageNumber) {
        state.activePage = pageNumber;
        renderAll();
    },
};

renderAll();
</script>
</body>
</html>
