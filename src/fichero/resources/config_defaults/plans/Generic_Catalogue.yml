title: "Generic Document Cataloguing"
description: >
  Full image enhancement pipeline with segmentation and generic cataloguing. Extracts people, places, organizations, and dates from any type of documents. Ideal for large archival scans that need both quality improvement and basic metadata extraction.

vars:
  name: "Fichero"
  language: "en"
  version: "0.1.0"

  # User-configurable file formats
  crop_format: "jpg"
  split_format: "jpg"
  rotate_format: "jpg"
  enhance_format: "jpg"
  background_removed_format: "png"

  # Background removal method
  background_removal_method: "opencv"      # "opencv" (fast, document-optimized) or "ai" (high quality, slower)
  # AI model for background removal (when method is "ai")
  background_removal_ai_model: ""    # "default", "u2net", "u2net_human", "silueta"

  # Segmentation settings
  segment_tile_size: 2048  # Tile size in pixels (2048x2048 is good for most archival scans)
  segment_overlap: 256     # Overlap between tiles in pixels

  project_folder: ''
  documents_folder: ''
  assets_folder: ''
  text_direction: horizontal-lr
  lmstudio_url: ''
  lmstudio_model: ''
  prompt: ''

workflows:
  # Simple enhance + segment workflow with generic cataloguing - recommended for any document type
  Default:
    - build_documents_manifest
    - extract_library_metadata
    - enhance
    - describe_images
    - analyze_document_groups
    - segment
    - transcribe_qwen_max_segmented
    - recombine_segments
    - fuzzy_clean
    - catalogue_folder
    - convert_to_word_segmented
    - catalogue_to_word

  # Full enhancement pipeline + segmentation with generic cataloguing
  Full:
    - build_documents_manifest
    - extract_library_metadata
    - crop
    - split
    - rotate
    - enhance
    - describe_images
    - analyze_document_groups
    - remove_background
    - segment
    - transcribe_qwen_max_segmented
    - catalogue_folder
    - convert_to_word_segmented
    - catalogue_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: crop
    worker_type: "cpu"
    help: "Crop documents using computer vision techniques"
    function: "fichero.tools.crop.crop_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/crops"
      model_path: "yolov8s-fichero.pt"
      output_format: "{crop_format}"
      add_documents_prefix: false
    outputs:
      - "assets/crops"
      - "assets/crops/crop_manifest.jsonl"

  - name: split
    worker_type: "cpu"
    help: "Split cropped images"
    function: "fichero.tools.split.split_batch"
    args:
      source_folder: "assets/crops"
      source_manifest: "assets/crops/crop_manifest.jsonl"
      output_folder: "assets/split"
      output_format: "{split_format}"
      disable_splitting: true
    outputs:
      - "assets/split"
      - "assets/split/split_manifest.jsonl"

  - name: rotate
    worker_type: "cpu"
    help: "Rotate the split images to straighten text."
    function: "fichero.tools.rotate.rotate_batch"
    args:
      source_folder: "assets/split"
      source_manifest: "assets/split/split_manifest.jsonl"
      output_folder: "assets/rotated"
      output_format: "{rotate_format}"
    outputs:
      - "assets/rotated"
      - "assets/rotated/rotate_manifest.jsonl"

  - name: enhance
    worker_type: "cpu"
    help: "Enhance image quality with contrast and clarity improvements"
    function: "fichero.tools.enhance.enhance_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/enhanced"
      output_format: "{enhance_format}"
      add_documents_prefix: false
    outputs:
      - "assets/enhanced"
      - "assets/enhanced/enhance_manifest.jsonl"

  - name: remove_background
    worker_type: "cpu"
    help: "Remove background from enhanced images"
    function: "fichero.tools.remove_background.remove_background_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      output_folder: "assets/background_removed"
      output_format: "{background_removed_format}"
      method: "{background_removal_method}"
      ai_model: "{background_removal_ai_model}"
    outputs:
      - "assets/background_removed"
      - "assets/background_removed/background_removed_manifest.jsonl"

  - name: segment
    worker_type: "cpu"
    help: "Segment large enhanced images into smaller tiles for better transcription"
    function: "fichero.tools.segment.segment_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      output_folder: "assets/segmented"
      tile_size: "{segment_tile_size}"
      overlap: "{segment_overlap}"
      output_format: "jpg"
    outputs:
      - "assets/segmented"
      - "assets/segmented/segment_manifest.jsonl"

  - name: transcribe_qwen_max_segmented
    worker_type: "io"
    help: "Transcribe segmented images using Qwen VL Max model"
    function: "fichero.tools.transcribe.transcribe_batch"
    args:
      source_folder: "assets/segmented"
      source_manifest: "assets/segmented/segment_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: recombine_segments
    worker_type: "io"
    help: "Recombine transcribed segments into complete documents"
    function: "fichero.tools.recombine_segments.recombine_segments_batch"
    args:
      transcriptions_folder: "assets/transcriptions"
      output_folder: "assets/recombined"
      transcription_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"
      image_manifest: "assets/segmented/segment_manifest.jsonl"
    outputs:
      - "assets/recombined"
      - "assets/recombined/recombine_manifest.jsonl"

  - name: fuzzy_clean
    worker_type: "io"
    help: "Clean up repeated text from recombined transcriptions"
    function: "fichero.tools.fuzzy_clean.fuzzy_clean_batch"
    args:
      source_folder: "assets/recombined"
      source_manifest: "assets/recombined/recombine_manifest.jsonl"
      output_folder: "assets/cleaned"
    outputs:
      - "assets/cleaned"
      - "assets/cleaned/cleaned_manifest.jsonl"

  - name: catalogue_folder
    worker_type: "io"
    help: "Extract people, places, organizations, dates and create brief summary using generic catalogue prompts"
    function: "fichero.tools.llm_process.process_documents_batch"
    args:
      source_folder: "assets/cleaned"
      source_manifest: "assets/cleaned/cleaned_manifest.jsonl"
      output_folder: "assets/llm_catalogue"
      prompt_config: "Generic_Catalogue.jsonl"
      folder_mode: true
      metadata_manifest: "assets/library_metadata/metadata_manifest.jsonl"
      visual_descriptions_manifest: "assets/visual_descriptions/descriptions_manifest.jsonl"
    outputs:
      - "assets/llm_catalogue"

  - name: convert_to_word_segmented
    worker_type: "io"
    help: "Convert enhanced images and recombined transcriptions to Word documents with side-by-side layout"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    depends_on:
      - "fuzzy_clean"
    args:
      images_folder: "assets/enhanced"
      transcription_manifest: "assets/enhanced/enhance_manifest.jsonl"
      transcription_folder: "assets/cleaned"
      output_folder: "assets/word"
    outputs:
      - "assets/word"

  - name: catalogue_to_word
    worker_type: "io"
    help: "Convert catalogue JSON files to Word documents"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    args:
      source_folder: "assets/llm_catalogue"
      source_manifest: "assets/llm_catalogue/llm_process_manifest.jsonl"
      output_folder: "assets/llm_catalogue_word"
    outputs:
      - "assets/llm_catalogue_word"

  - name: extract_library_metadata
    worker_type: "io"
    help: "Extract library metadata from database for each document"
    function: "fichero.tools.extract_library_metadata.extract_metadata_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/library_metadata"
      library_db_path: null
      collection_id: null
    outputs:
      - "assets/library_metadata"
      - "assets/library_metadata/metadata_manifest.jsonl"

  - name: describe_images
    worker_type: "io"
    help: "Generate detailed visual descriptions of documents using Qwen VL Max"
    function: "fichero.tools.describe_images.describe_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      output_folder: "assets/visual_descriptions"
    outputs:
      - "assets/visual_descriptions"
      - "assets/visual_descriptions/descriptions_manifest.jsonl"

  - name: analyze_document_groups
    worker_type: "io"
    help: "Analyze document groups using video-based visual similarity"
    function: "fichero.tools.analyze_document_groups.analyze_document_groups_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      output_folder: "assets/document_groups"
      fps: 2
      thumbnail_size: 512
    outputs:
      - "assets/document_groups"
      - "assets/document_groups/groups_manifest.jsonl"

  - name: convert_to_svg
    worker_type: "io"
    help: "Convert documents to semantic SVG with embedded metadata"
    function: "fichero.tools.convert_to_svg.convert_to_svg_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      transcription_folder: "assets/cleaned"
      transcription_manifest: "assets/cleaned/cleaned_manifest.jsonl"
      output_folder: "assets/svg"
      metadata_manifest: "assets/library_metadata/metadata_manifest.jsonl"
      visual_descriptions_manifest: "assets/visual_descriptions/descriptions_manifest.jsonl"
    outputs:
      - "assets/svg"
      - "assets/svg/svg_manifest.jsonl"
