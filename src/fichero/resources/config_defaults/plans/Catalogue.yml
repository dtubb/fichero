title: "Catalogue"
description: > 
  Transcribe, catalogues and export to Word documents archival materials using QWEN for transcription and Open AI for catalogue generation.
  
vars:
  name: "Fichero"
  language: "es"
  version: "0.0.6"
  
  # User-configurable file formats
  crop_format: "jpg"
  split_format: "jpg"
  rotate_format: "jpg"
  enhance_format: "jpg"
  background_removed_format: "png"
  
workflows:
  # Full workflow with segmentation (best for complex documents)
  00) default:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - segment
    - transcribe_qwen_max_segments
    - recombine_segments_qwen_max
    - fuzzy_clean
    - catalogue_folder
    - convert_to_word
    - catalogue_to_word

  # Direct transcription workflow (no segmentation - faster for simple documents)
  Direct (No Segmentation):
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - transcribe_qwen_max_direct
    - catalogue_folder
    - convert_to_word
    - catalogue_to_word

  # Individual step workflows for flexibility
  1) Archive to Segment:
    - build_documents_manifest
    - crop
    - split
    - rotate
    - enhance
    - remove_background
    - segment

  2) Transcribe Segments:
    - transcribe_qwen_max_segments

  3) Transcribe Direct:
    - transcribe_qwen_max_direct

  4) Recombine:
    - recombine_segments_qwen_max

  5) Fuzzy Clean:
    - fuzzy_clean

  6) Catalogue:
    - catalogue_folder
  
  7) Convert to Word:
    - convert_to_word
    - catalogue_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: crop
    worker_type: "cpu"
    help: "Crop documents using computer vision techniques"
    function: "fichero.tools.crop.crop_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/crops"
      model_path: "yolov8s-fichero.pt"
      output_format: "{crop_format}"
    outputs:
      - "assets/crops"
      - "assets/crops/crop_manifest.jsonl"

  - name: split
    worker_type: "cpu"
    help: "Split cropped images"
    function: "fichero.tools.split.split_batch"
    args:
      source_folder: "assets/crops"
      source_manifest: "assets/crops/crop_manifest.jsonl"
      output_folder: "assets/split"
      output_format: "{split_format}"
      disable_splitting: true
    outputs:
      - "assets/split"
      - "assets/split/split_manifest.jsonl"

  - name: rotate
    worker_type: "cpu"
    help: "Rotate the split images to straighten text."
    function: "fichero.tools.rotate.rotate_batch"
    args:
      source_folder: "assets/split"
      source_manifest: "assets/split/split_manifest.jsonl"
      output_folder: "assets/rotated"
      output_format: "{rotate_format}"
    outputs:
      - "assets/rotated"
      - "assets/rotated/rotate_manifest.jsonl"

  - name: enhance
    worker_type: "cpu"
    help: "Enhance image quality with contrast and clarity improvements"
    function: "fichero.tools.enhance.enhance_batch"
    args:
      source_folder: "assets/rotated"
      source_manifest: "assets/rotated/rotate_manifest.jsonl"
      output_folder: "assets/enhanced"
      output_format: "{enhance_format}"
    outputs:
      - "assets/enhanced"
      - "assets/enhanced/enhance_manifest.jsonl"

  - name: remove_background
    worker_type: "cpu"
    help: "Remove background from enhanced images"
    function: "fichero.tools.remove_background.remove_background_batch"
    args:
      source_folder: "assets/enhanced"
      source_manifest: "assets/enhanced/enhance_manifest.jsonl"
      output_folder: "assets/background_removed"
      output_format: "{background_removed_format}"
    outputs:
      - "assets/background_removed"
      - "assets/background_removed/background_removed_manifest.jsonl"

  - name: segment
    worker_type: "cpu"
    help: "Segment images into text regions"
    function: "fichero.tools.segment.segment_batch"
    args:
      source_folder: "assets/background_removed"
      source_manifest: "assets/background_removed/background_removed_manifest.jsonl"
      output_folder: "assets/segmented"
    outputs:
      - "assets/segmented"
      - "assets/segmented/segment_manifest.jsonl"

  - name: transcribe_qwen_max_segments
    worker_type: "io"
    help: "Transcribe segmented images using Qwen VL Max model"
    function: "fichero.tools.transcribe_qwen_max.transcribe_batch"
    args:
      source_folder: "assets/segmented"
      source_manifest: "assets/segmented/segment_manifest.jsonl"
      output_folder: "assets/segmented_transcriptions"
    outputs:
      - "assets/segmented_transcriptions"
      - "assets/segmented_transcriptions/segmented_transcription_manifest.jsonl"

  - name: transcribe_qwen_max_direct
    worker_type: "io"
    help: "Transcribe background-removed images directly using Qwen VL Max model (no segmentation)"
    function: "fichero.tools.transcribe_qwen_max.transcribe_batch"
    args:
      source_folder: "assets/background_removed"
      source_manifest: "assets/background_removed/background_removed_manifest.jsonl"
      output_folder: "assets/transcriptions"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcription_manifest.jsonl"

  - name: recombine_segments_qwen_max
    worker_type: "io"
    help: "Recombine the transcribed segments from Qwen into single markdown files"
    function: "fichero.tools.recombine_segments.recombine_segments_batch"
    args:
      transcriptions_folder: "assets/segmented_transcriptions"
      output_folder: "assets/recombined"
      transcription_manifest: "assets/segmented_transcriptions/segmented_transcription_manifest.jsonl"
      image_manifest: "assets/background_removed/background_removed_manifest.jsonl"
    outputs:
      - "assets/recombined"
      - "assets/recombined/recombine_manifest.jsonl"

  - name: fuzzy_clean
    worker_type: "io"
    help: "Clean up text from recombined transcriptions"
    function: "fichero.tools.fuzzy_clean.fuzzy_clean_batch"
    args:
      source_folder: "assets/recombined"
      source_manifest: "assets/recombined/recombine_manifest.jsonl"
      output_folder: "assets/transcriptions"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcription_manifest.jsonl"

  - name: convert_to_word
    worker_type: "io"
    help: "Convert background-removed images and transcriptions to Word documents with side-by-side layout"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    args:
      images_folder: "assets/background_removed"
      transcription_manifest: "assets/transcriptions/transcription_manifest.jsonl"
      output_folder: "assets/word"
    outputs:
      - "assets/word"

  - name: catalogue_folder
    worker_type: "io"
    help: "Process transcribed documents through configurable LLM pipeline for catalogue generation"
    function: "fichero.tools.llm_process.process_documents_batch"
    args:
      source_folder: "assets/transcriptions"
      source_manifest: "assets/transcriptions/transcription_manifest.jsonl"
      output_folder: "assets/llm_catalogue"
      prompt_config: "Catalogue.jsonl"
      folder_mode: true
    outputs:
      - "assets/llm_catalogue"

  - name: catalogue_to_word
    worker_type: "io"
    help: "Convert catalogue JSON files to Word documents"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    args:
      source_folder: "assets/llm_catalogue"
      source_manifest: "assets/llm_catalogue/llm_process_manifest.jsonl"
      output_folder: "assets/llm_catalogue_word"
    outputs:
      - "assets/llm_catalogue_word"