title: "Extract Quotations and Testimony"
description: >
  Extract direct quotations, testimony, and statements by specific people from documents.

vars:
  name: "Fichero"
  language: "en"
  version: "0.1.0"

  # User-configurable settings
  project_folder: ''
  documents_folder: ''
  assets_folder: ''
  text_direction: horizontal-lr
  lmstudio_url: ''
  lmstudio_model: ''
  prompt: ''

workflows:
  Quotations:
    - build_documents_manifest
    - prepare_images
    - transcribe_qwen_max_direct
    - extract_quotations
    - convert_to_word
    - quotations_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: prepare_images
    worker_type: "io"
    help: "Prepare images (apply EXIF rotation and compress them) for better processing"
    function: "fichero.tools.prepare_images.prepare_images_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/prepared"
      output_format: "jpg"
      compression_quality: 85
    outputs:
      - "assets/prepared"
      - "assets/prepared/prepare_images_manifest.jsonl"

  - name: transcribe_qwen_max_direct
    worker_type: "io"
    help: "Transcribe prepared documents using Qwen VL Max model"
    function: "fichero.tools.transcribe.transcribe_batch"
    args:
      source_folder: "assets/prepared/documents"
      source_manifest: "assets/prepared/prepare_images_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: extract_quotations
    worker_type: "io"
    help: "Extract quotations, testimony, and statements by specific people from transcribed documents"
    function: "fichero.tools.llm_process.process_documents_batch"
    args:
      source_folder: "assets/transcriptions"
      source_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"
      output_folder: "assets/quotations"
      prompt_config: "Quotations.jsonl"
      folder_mode: true
    outputs:
      - "assets/quotations"

  - name: convert_to_word
    worker_type: "io"
    help: "Convert prepared documents and transcriptions to Word documents with side-by-side layout"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    depends_on:
      - "transcribe_qwen_max_direct"  # For transcriptions
    args:
      images_folder: "assets/prepared"           # ← Use prepared documents as images
      transcription_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"  # ← From transcribe step
      output_folder: "assets/word"
    outputs:
      - "assets/word"

  - name: quotations_to_word
    worker_type: "io"
    help: "Convert quotations JSON files to Word documents"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    args:
      source_folder: "assets/quotations"
      source_manifest: "assets/quotations/llm_process_manifest.jsonl"
      output_folder: "assets/quotations_word"
    outputs:
      - "assets/quotations_word" 