title: "Settings"
description: "Configure global application settings and API connections"
window_title: "Fichero Settings"
window_size: [405, 525]

sections:
  - id: "defaults"
    title: "Defaults" 
    sections:
      - title: "Processing Defaults"
        description: "Set default plan and workflow for new processing tasks"
        fields:
          - id: "default_plan"
            type: "selection"
            label: "Default Plan"
            options: []  # Will be populated dynamically
            help: "Plan to use when none specified (CLI and GUI)"
          - id: "default_workflow" 
            type: "selection"
            label: "Default Workflow"
            options: []  # Will be populated dynamically
            help: "Workflow to use when 'default' is selected"
          - id: "preferences.folder_processing_order"
            type: "selection"
            label: "Folder Processing Order"
            options: ["alphabetical", "reverse_alphabetical", "least_images_first", "most_images_first"]
            help: "Processing order: alphabetical, reverse alphabetical, least images first, or most images first"

  - id: "appearance"
    title: "Appearance"
    sections:
      - title: "Language"
        fields:
          - id: "preferences.language"
            type: "selection"
            label: "Language"
            options: ["en", "es", "fr"]

  - id: "performance"
    title: "Performance"
    sections:
      - title: "Backend Configuration"
        description: "Choose processing backend - affects both shared data and task processing"
        fields:
          - id: "workers.backend"
            type: "selection"
            label: "Backend Type"
            options: ["python", "redis"]
            help: "Python: Local processing. Celery/Redis: Distributed processing (requires Redis server)."
            
      - title: "Worker Configuration"
        description: "Configure processing performance"
        fields:
          - id: "workers.cpu_workers"
            type: "number_input"
            label: "CPU Workers"
            min: 1
            max: 32
            help: "Number of CPU-intensive processing workers"
          - id: "workers.io_workers"
            type: "number_input"
            label: "I/O Workers"
            min: 1
            max: 128
            help: "Number of I/O workers for transcription and API calls (not resource-intensive)"
          - id: "auto_calculate_workers"
            type: "button"
            label: "Auto-calculate"
            help: "Calculate optimal worker counts for your system"


  - id: "ai"
    title: "AI"
    sections:
      - title: "OpenAI Configuration"
        fields:
          - id: "api_servers.openai.api_key"
            type: "text_input"
            label: "API Key"
            placeholder: "sk-..."
            help: "Your OpenAI API key"
          - id: "api_servers.openai.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "https://api.openai.com/v1"
            
      - title: "Qwen Configuration"
        fields:
          - id: "api_servers.qwen.api_key"
            type: "text_input"
            label: "API Key"
            placeholder: "sk-..."
            help: "Your Qwen/DashScope API key"
          - id: "api_servers.qwen.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "https://dashscope.aliyuncs.com/compatible-mode/v1"
            
      - title: "Claude Configuration"
        fields:
          - id: "api_servers.claude.api_key"
            type: "text_input"
            label: "API Key"
            placeholder: "sk-ant-..."
            help: "Your Anthropic API key"
          - id: "api_servers.claude.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "https://api.anthropic.com"
            
      - title: "Ollama Configuration"
        fields:
          - id: "api_servers.ollama.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "http://localhost:11434"
            help: "Local Ollama server endpoint"
            
      - title: "LMStudio Configuration"
        fields:
          - id: "api_servers.lmstudio.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "http://localhost:1234/v1"
            help: "Local LMStudio server endpoint"
            
      - title: "Blackfish Configuration"
        fields:
          - id: "api_servers.blackfish.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "https://blackfish.example.com"
            help: "Blackfish server endpoint"
            
      - title: "Hugging Face Configuration"
        fields:
          - id: "api_servers.huggingface.api_key"
            type: "text_input"
            label: "API Key"
            placeholder: "hf_..."
            help: "Your Hugging Face API token"
          - id: "api_servers.huggingface.base_url"
            type: "text_input"
            label: "Base URL"
            placeholder: "https://api-inference.huggingface.co" 

            