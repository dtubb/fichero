title: "Plans - {config_file.name}"
description: "Configure project workflows, variables, and commands"
window_title: "Fichero Plans"
window_size: [1000, 700]

sections:
  - id: "general"
    title: "General"
    sections:
      - title: "Project Information"
        fields:
          - id: "title"
            type: "text_input"
            label: "Project Title"
            placeholder: "Enter project title"
            validation:
              required: true
          - id: "description"
            type: "multiline_text"
            label: "Description"
            height: 200
            placeholder: "Project description..."

  - id: "vars"
    title: "Variables"
    sections:
      - title: "Basic Configuration"
        fields:
          - id: "vars.name"
            type: "text_input"
            label: "Project Name"
            validation:
              required: true
          - id: "vars.language"
            type: "selection"
            label: "Language"
            options: ["es", "en", "fr", "de", "pt", "it"]
          - id: "vars.text_direction"
            type: "selection"
            label: "Text Direction"
            options: ["horizontal-lr", "horizontal-rl", "vertical-lr", "vertical-rl"]
          - id: "vars.version"
            type: "text_input"
            label: "Version"

      - title: "Image Formats"
        description: "Configure output formats for different processing steps"
        fields:
          - id: "vars.crop_format"
            type: "selection"
            label: "Crop Format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.split_format"
            type: "selection"
            label: "Split Format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.rotate_format"
            type: "selection"
            label: "Rotate Format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.enhance_format"
            type: "selection"
            label: "Enhance Format"
            options: ["jpg", "png", "jxl"]
          - id: "vars.background_removed_format"
            type: "selection"
            label: "Background Removed Format"
            options: ["png", "jxl", "jpg"]

      - title: "Processing Methods"
        description: "Configure processing algorithms and methods"
        fields:
          - id: "vars.background_removal_method"
            type: "selection"
            label: "Background Removal Method"
            options: ["opencv", "ai"]
            help: "opencv: Fast, document-optimized | ai: High quality, general purpose"
          - id: "vars.background_removal_ai_model"
            type: "selection"
            label: "AI Model (when method = ai)"
            options: ["default", "u2net", "u2net_human", "silueta"]
            help: "default: 1.3s, balanced | u2net: 1.5s, general | u2net_human: 1.4s, people | silueta: 1.5s, fast"

      - title: "LLM Configuration"
        fields:
          - id: "vars.lmstudio_url"
            type: "text_input"
            label: "LMStudio URL"
            placeholder: "http://localhost:1234"
          - id: "vars.lmstudio_model"
            type: "text_input"
            label: "LMStudio Model"
            placeholder: "Model name"
          - id: "vars.prompt"
            type: "multiline_text"
            label: "Default Prompt"
            height: 80
            placeholder: "Enter default transcription prompt..."

  - id: "paths"
    title: "Paths"
    sections:
      - title: "Key Paths"
        description: "Main project directories (use ${vars.variable} for substitution)"
        fields:
          - id: "vars.project_folder"
            type: "text_input"
            label: "Project Folder"
            help: "Main project directory"
          - id: "vars.documents_folder"
            type: "text_input"
            label: "Documents Folder"
            help: "Source documents location"
          - id: "vars.assets_folder"
            type: "text_input"
            label: "Assets Folder"
            help: "Processing outputs location"

  - id: "workflows"
    title: "Workflows"
    sections:
      - title: "Workflow Management"
        description: "Configure processing workflows - select workflow and enable/disable steps"
        fields:
          - id: "workflow_manager"
            type: "workflow_editor"
            label: "Workflow Editor"
            help: "Select a workflow and enable/disable individual processing steps"
      


  - id: "commands"
    title: "Commands"
    sections:
      - title: "Command Configuration"
        description: "View and configure available processing commands"
        fields:
          - id: "commands_editor"
            type: "multiline_text"
            label: "Commands (YAML)"
            height: 500
            help: "Configure processing commands, their parameters, and worker types."
            placeholder: |
              - name: crop
                worker_type: "cpu"
                help: "Crop documents"
                function: "fichero.tools.crop.crop_batch" 