[tool.briefcase]
project_name = "Widget List Demo"
bundle = "org.fichero.demo"
version = "0.1.0"
url = "https://tubb.ca/fichero"
license.file = "LICENSE"
author = "Daniel Tubb"
author_email = "hello@tubb.ca"

[tool.briefcase.app.widgetlistdemo]
formal_name = "Widget List Demo"
description = "Demo application testing all widget list renderers"
long_description = """Tests all 6 widget list renderers with mock data:
1. MacOS Sidebar (NSOutlineView)
2. Card Renderer
3. HTML Renderer
4. Native Renderer
5. Sidebar Renderer (Canvas)
6. Canvas Renderer
"""
sources = [
    "widget_list_demo",
    "../../../../../fichero",
]
test_sources = []
icon = "resources/fichero"
requires = [
    "rubicon-objc>=0.4.7",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.widgetlistdemo.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.2",
    "rubicon-objc>=0.4.7",
    "std-nslog~=1.0.0",
    "pyobjc-core>=10.1",
    "pyobjc-framework-Cocoa>=10.1",
]

[tool.briefcase.app.widgetlistdemo.linux]
requires = []
system_requires = []

[tool.briefcase.app.widgetlistdemo.windows]
requires = []

[tool.briefcase.app.widgetlistdemo.iOS]
requires = [
    "toga-iOS~=0.5.2",
    "std-nslog~=1.0.0"
]

[tool.briefcase.app.widgetlistdemo.android]
requires = []
