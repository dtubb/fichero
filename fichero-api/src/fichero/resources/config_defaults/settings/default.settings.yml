# Default Application Settings
# This file defines the default configuration for Fichero application
# Users can modify these settings through the Preferences window

title: "Fichero Application Settings"
description: "Configure global application preferences and API settings"

# Application Preferences
preferences:
  folder_processing_order: "alphabetical"  # Options: "alphabetical", "reverse_alphabetical", "least_images_first", "most_images_first"
  processing_mode: "in_place"  # Options: "in_place" (process files from source location), "copy" (copy files to output before processing)

# Worker Performance Configuration
workers:
  backend: "python"  # Options: "python", "redis". Python = Manager+Python, Redis = Redis+Celery
  cpu_workers: 4
  io_workers: 16  # Increased for better transcription concurrency

# API Rate Limiting Configuration
# These settings control concurrent API calls to prevent rate limit errors
api_rate_limits:
  # Global maximum concurrent API calls (shared across all folders/tools)
  # This is the total number of simultaneous API requests allowed
  global_max_concurrent: 30  # Safe default, increase if your account tier allows

  # Per-provider limits (optional overrides)
  dashscope:
    max_concurrent: 30      # Alibaba Cloud DashScope (qwen models)
    retry_on_429: true      # Auto-retry on rate limit errors
    max_retries: 5          # Maximum retry attempts
    base_retry_delay: 1.0   # Initial retry delay in seconds (doubles each retry)

  openai:
    max_concurrent: 20      # OpenAI API
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

  claude:
    max_concurrent: 10      # Anthropic Claude API
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

  deepseek:
    max_concurrent: 20      # DeepSeek API
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

  groq:
    max_concurrent: 30      # Groq API (very fast inference)
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

  together:
    max_concurrent: 20      # Together AI API
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

  huggingface:
    max_concurrent: 10      # Hugging Face Inference API
    retry_on_429: true
    max_retries: 5
    base_retry_delay: 1.0

# API Server Configurations
api_servers:
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    
  qwen:
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    
  claude:
    api_key: ""
    base_url: "https://api.anthropic.com"
    
  ollama:
    base_url: "http://localhost:11434"
    
  lmstudio:
    base_url: "http://localhost:1234/v1"
    
  blackfish:
    base_url: "https://blackfish.example.com"
    
  huggingface:
    api_key: ""
    base_url: "https://router.huggingface.co/v1"

  deepseek:
    api_key: ""
    base_url: "https://api.deepseek.com/v1"

  groq:
    api_key: ""
    base_url: "https://api.groq.com/openai/v1"

  together:
    api_key: ""
    base_url: "https://api.together.xyz/v1"

# Default Processing Settings
defaults:
  plan: "Catalogue"
  workflow: "00) default"

# AI Provider Defaults
# These are the default providers and models used when not specified in a plan
ai_defaults:
  # Global AI settings (apply to all operations unless overridden)
  temperature: 0.0          # 0.0 = deterministic, 1.0 = creative, 2.0 = very random
  max_tokens: 4096          # Maximum tokens in response
  timeout: 120              # Request timeout in seconds

  # Transcription (image to text) defaults
  transcription:
    provider: "dashscope"  # Options: dashscope, openai, lmstudio, huggingface
    model: "qwen-vl-max"   # Model to use for transcription
    temperature: 0.0       # Override global temperature for transcription
    max_tokens: 4096       # Override global max_tokens for transcription
    image_size: "large"    # Options: extra_large (2048), large (1536), medium (1024), small (768)
    # Provider-specific model mappings:
    # - dashscope: qwen-vl-max, qwen-vl-ocr, qwen3-vl-flash
    # - openai: gpt-4-vision-preview, gpt-4o
    # - lmstudio: (depends on loaded model)
    # - huggingface: (depends on model endpoint)

  # LLM (text to text) defaults
  llm:
    provider: "qwen"  # Options: openai, qwen, claude, ollama, lmstudio, deepseek, groq, together, huggingface
    model: "qwen-max"  # Model to use for text processing
    temperature: 0.0   # Override global temperature for LLM
    max_tokens: 4096   # Override global max_tokens for LLM
    # Provider-specific model mappings:
    # - openai: gpt-4, gpt-4-turbo, gpt-3.5-turbo
    # - qwen: qwen-max, qwen-turbo, qwen-plus
    # - claude: claude-3-opus, claude-3-sonnet, claude-3-haiku
    # - ollama: mistral, llama2, codellama (local)
    # - lmstudio: (depends on loaded model)
    # - deepseek: deepseek-chat, deepseek-coder
    # - groq: llama-3.1-70b-versatile, mixtral-8x7b-32768
    # - together: meta-llama/Llama-3-70b-chat-hf
    # - huggingface: (depends on model endpoint)

  # Image description defaults
  describe:
    provider: "dashscope"  # Options: dashscope, openai, lmstudio, huggingface
    model: "qwen-vl-max"
    temperature: 0.3       # Slightly creative for descriptions
    max_tokens: 2048       # Descriptions are usually shorter 
# Library Configuration
library:
  # Library storage location (desktop only - mobile uses app.paths.data)
  library_path: ""  # Empty = default to app.paths.data/library, or set custom path

  # Processing output location (desktop only - mobile uses app.paths.data/processed)
  processing_output_path: ""  # Empty = default to app.paths.data/processed, or set custom path

  # Collection defaults
  default_collection_type: "copy"
  auto_copy_collections: true

  # Platform-specific settings
  allow_custom_paths_desktop: true  # Allow custom paths on desktop
  allow_custom_paths_mobile: false  # Mobile always uses app.paths
