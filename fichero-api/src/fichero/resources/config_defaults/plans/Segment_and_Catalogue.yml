title: "Segment, Transcribe, and Catalogue"
description: >
  Segment large images, auto-transcribe, and auto-catalog. Ideal for very large archival scans (TIFF, high-res JPG) where segmentation improves transcription quality by breaking images into smaller tiles.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"

  # User-configurable settings
  project_folder: ''
  documents_folder: ''
  assets_folder: ''
  text_direction: horizontal-lr
  lmstudio_url: ''
  lmstudio_model: ''
  prompt: ''

  # Segmentation settings
  segment_tile_size: 2048  # Tile size in pixels (2048x2048 is good for most archival scans)
  segment_overlap: 256     # Overlap between tiles in pixels

workflows:
  # Segmentation workflow - recommended for large archival scans
  Segment:
    - build_documents_manifest
    - prepare_images
    - segment
    - transcribe_qwen_max_segmented
    - catalogue_folder
    - convert_to_word_segmented
    - catalogue_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: prepare_images
    worker_type: "io"
    help: "Prepare images (apply EXIF rotation and compress) for better processing"
    function: "fichero.tools.prepare_images.prepare_images_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/prepared"
      output_format: "jpg"
      compression_quality: 85
      add_documents_prefix: false
    outputs:
      - "assets/prepared"
      - "assets/prepared/prepare_images_manifest.jsonl"

  - name: segment
    worker_type: "cpu"
    help: "Segment large images into smaller tiles for better transcription"
    function: "fichero.tools.segment.segment_batch"
    args:
      source_folder: "assets/prepared"
      source_manifest: "assets/prepared/prepare_images_manifest.jsonl"
      output_folder: "assets/segmented"
      tile_size: "{segment_tile_size}"
      overlap: "{segment_overlap}"
      output_format: "jpg"
    outputs:
      - "assets/segmented"
      - "assets/segmented/segment_manifest.jsonl"

  - name: transcribe_qwen_max_segmented
    worker_type: "io"
    help: "Transcribe segmented images using Qwen VL Max model"
    function: "fichero.tools.transcribe.transcribe_batch"
    args:
      source_folder: "assets/segmented"
      source_manifest: "assets/segmented/segment_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: catalogue_folder
    worker_type: "io"
    help: "Process transcribed documents through configurable LLM pipeline for catalogue generation"
    function: "fichero.tools.llm_process.process_documents_batch"
    args:
      source_folder: "assets/transcriptions"
      source_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"
      output_folder: "assets/llm_catalogue"
      prompt_config: "Catalogue.jsonl"
      folder_mode: true
    outputs:
      - "assets/llm_catalogue"

  - name: convert_to_word_segmented
    worker_type: "io"
    help: "Convert segmented images and transcriptions to Word documents with side-by-side layout"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    depends_on:
      - "transcribe_qwen_max_segmented"
    args:
      images_folder: "assets/segmented"
      transcription_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"
      output_folder: "assets/word"
    outputs:
      - "assets/word"

  - name: catalogue_to_word
    worker_type: "io"
    help: "Convert catalogue JSON files to Word documents"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    args:
      source_folder: "assets/llm_catalogue"
      source_manifest: "assets/llm_catalogue/llm_process_manifest.jsonl"
      output_folder: "assets/llm_catalogue_word"
    outputs:
      - "assets/llm_catalogue_word"
