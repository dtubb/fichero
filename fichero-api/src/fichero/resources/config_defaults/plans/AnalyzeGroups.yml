title: "Analyze Document Groups"
description: >
  Minimal workflow for testing analyze_document_groups tool - analyzes visual similarity to group related documents.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Analyze Groups only workflow - for testing document grouping
  AnalyzeGroupsTest:
    - build_documents_manifest
    - analyze_document_groups

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: analyze_document_groups
    worker_type: "gpu"
    help: "Analyze visual similarity to group related documents"
    function: "fichero.tools.analyze_document_groups.analyze_document_groups_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/document_groups"
      fps: 2
      thumbnail_size: 512
      output_format: "json"
    outputs:
      - "assets/document_groups"
      - "assets/document_groups/groups_manifest.jsonl"
