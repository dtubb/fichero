title: "Rotate"
description: >
  Minimal workflow for testing rotate tool - rotates images by specified angle.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Rotate only workflow - for testing rotate tool with OutputView
  RotateTest:
    - build_documents_manifest
    - rotate

  # Rotate 180 degrees
  Rotate180:
    - build_documents_manifest
    - rotate_180

  # Rotate counter-clockwise
  RotateCCW:
    - build_documents_manifest
    - rotate_ccw

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: rotate
    worker_type: "cpu"
    help: "Rotate images 90 degrees clockwise"
    function: "fichero.tools.rotate.rotate_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/rotated"
      angle: 90
      direction: "clockwise"
      output_format: "jpg"
    outputs:
      - "assets/rotated"
      - "assets/rotated/rotate_manifest.jsonl"

  - name: rotate_180
    worker_type: "cpu"
    help: "Rotate images 180 degrees"
    function: "fichero.tools.rotate.rotate_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/rotated_180"
      angle: 180
      direction: "clockwise"
      output_format: "jpg"
    outputs:
      - "assets/rotated_180"
      - "assets/rotated_180/rotate_manifest.jsonl"

  - name: rotate_ccw
    worker_type: "cpu"
    help: "Rotate images 90 degrees counter-clockwise"
    function: "fichero.tools.rotate.rotate_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/rotated_ccw"
      angle: 90
      direction: "counterclockwise"
      output_format: "jpg"
    outputs:
      - "assets/rotated_ccw"
      - "assets/rotated_ccw/rotate_manifest.jsonl"
