title: "Transcribe LM Studio"
description: >
  Minimal workflow for testing unified transcribe tool with LM Studio provider - transcribes document images using local LM Studio API.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Transcribe LM Studio only workflow - for testing local AI transcription
  TranscribeLMStudioTest:
    - build_documents_manifest
    - transcribe

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: transcribe
    worker_type: "gpu"
    help: "Transcribe documents using unified transcription tool with LM Studio provider"
    function: "fichero.tools.transcribe.transcribe_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "lmstudio"
      api_url: "http://localhost:1234/v1"
      model: ""
      prompt_file: ""
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcription_manifest.jsonl"
