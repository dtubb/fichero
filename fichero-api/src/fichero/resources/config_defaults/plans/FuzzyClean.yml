title: "Fuzzy Clean"
description: >
  Minimal workflow for testing fuzzy_clean tool - cleans up transcription text by removing AI artifacts.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Fuzzy Clean only workflow - for testing OCR cleanup
  FuzzyCleanTest:
    - build_documents_manifest
    - fuzzy_clean

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: fuzzy_clean
    worker_type: "cpu"
    help: "Clean up transcription text by removing AI artifacts"
    function: "fichero.tools.fuzzy_clean.fuzzy_clean_batch"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/cleaned_text"
    outputs:
      - "assets/cleaned_text"
      - "assets/cleaned_text/transcription_manifest.jsonl"
