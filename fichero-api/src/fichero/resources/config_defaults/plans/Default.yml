title: "Transcribir y Catalogar"
description: >
  Transcripción automática y catalogación automática.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"

  # User-configurable settings
  project_folder: ''
  documents_folder: ''
  assets_folder: ''
  text_direction: horizontal-lr
  lmstudio_url: ''
  lmstudio_model: ''
  prompt: ''

workflows:
  Catalogue:
    - build_documents_manifest
    - prepare_images
    - transcribe_qwen_ocr
    - catalogue_folder
    - convert_to_word
    - catalogue_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generar el manifiesto de documentos"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    output_scope: "folder"  # Manifest is folder-level
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: prepare_images
    worker_type: "io"
    help: "Preparar imágenes (aplicar rotación EXIF y comprimirlas) para mejor procesamiento"
    function: "fichero.tools.prepare_images.prepare_images_batch"
    output_scope: "file"  # Each output corresponds to a source file
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/prepared"
      output_format: "jpg"
      compression_quality: 85
      add_documents_prefix: false
    outputs:
      - "assets/prepared"
      - "assets/prepared/prepare_images_manifest.jsonl"

  - name: transcribe_qwen_ocr
    worker_type: "io"
    help: "Transcribir documentos preparados usando el modelo Qwen VL OCR"
    function: "fichero.tools.transcribe.transcribe_batch"
    output_scope: "file"  # Each transcription belongs to its source image
    args:
      source_folder: "assets/prepared/documents"
      source_manifest: "assets/prepared/prepare_images_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: catalogue_folder
    worker_type: "io"
    help: "Procesar documentos transcritos a través de pipeline LLM configurable para generación de catálogo"
    function: "fichero.tools.llm_process.process_documents_batch"
    output_scope: "folder"  # Catalogue belongs to the parent folder
    args:
      source_folder: "assets/transcriptions"
      source_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"
      output_folder: "assets/llm_catalogue"
      prompt_config: "Catalogue.jsonl"
      folder_mode: true
    outputs:
      - "assets/llm_catalogue"

  - name: convert_to_word
    worker_type: "io"
    help: "Convertir documentos preparados y transcripciones a documentos Word con diseño lado a lado"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    output_scope: "folder"  # Word doc combines all transcriptions - folder level
    depends_on:
      - "transcribe_qwen_ocr"  # For transcriptions
    args:
      images_folder: "assets/prepared"           # ← Use prepared documents as images
      transcription_manifest: "assets/transcriptions/transcriptions_manifest.jsonl"  # ← From transcribe step
      output_folder: "assets/word"
    outputs:
      - "assets/word"

  - name: catalogue_to_word
    worker_type: "io"
    help: "Convertir archivos JSON de catálogo a documentos Word"
    function: "fichero.tools.json_to_word.json_to_word_batch"
    output_scope: "folder"  # Catalogue Word doc is folder-level
    args:
      source_folder: "assets/llm_catalogue"
      source_manifest: "assets/llm_catalogue/llm_process_manifest.jsonl"
      output_folder: "assets/llm_catalogue_word"
    outputs:
      - "assets/llm_catalogue_word" 