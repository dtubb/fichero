title: "Transcribe (LangGraph)"
description: >
  OCR and AI transcription using LangGraph workflow orchestration.

  This plan uses LangGraph StateGraph for clear, visual workflow control.
  The workflow flows through: load_images -> process_images -> save_results

  Benefits:
  - Visual workflow definition (can be rendered as diagram)
  - Easy to modify/extend workflow steps
  - Built-in state management across nodes
  - Supports both async (15+ concurrent) and sync processing

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # Default: Async LangGraph workflow (fastest)
  TranscribeLangGraph:
    - build_documents_manifest
    - transcribe_langgraph_async

  # Sync alternative
  TranscribeLangGraphSync:
    - build_documents_manifest
    - transcribe_langgraph_sync

  # With image preparation
  TranscribeLangGraphPrepared:
    - build_documents_manifest
    - prepare_images
    - transcribe_langgraph_async_prepared

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    output_scope: "folder"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: prepare_images
    worker_type: "io"
    help: "Prepare images (apply EXIF rotation and compress)"
    function: "fichero.tools.prepare_images.prepare_images_batch"
    output_scope: "file"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/prepared"
      output_format: "jpg"
      compression_quality: 85
      add_documents_prefix: false
    outputs:
      - "assets/prepared"
      - "assets/prepared/prepare_images_manifest.jsonl"

  - name: transcribe_langgraph_async
    worker_type: "io"
    help: "Transcribe using LangGraph async workflow (15+ concurrent requests)"
    function: "fichero.tools.transcribe.transcribe_batch"
    output_scope: "file"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
      use_async: true
      max_concurrent: 15
      use_langgraph: true
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: transcribe_langgraph_sync
    worker_type: "io"
    help: "Transcribe using LangGraph sync workflow (thread-based)"
    function: "fichero.tools.transcribe.transcribe_batch"
    output_scope: "file"
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
      use_async: false
      max_workers: 5
      use_langgraph: true
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"

  - name: transcribe_langgraph_async_prepared
    worker_type: "io"
    help: "Transcribe prepared images using LangGraph async workflow"
    function: "fichero.tools.transcribe.transcribe_batch"
    output_scope: "file"
    args:
      source_folder: "assets/prepared"
      source_manifest: "assets/prepared/prepare_images_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
      use_async: true
      max_concurrent: 15
      use_langgraph: true
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"
