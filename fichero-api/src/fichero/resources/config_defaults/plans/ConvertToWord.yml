title: "Convert to Word"
description: >
  Convert images and transcriptions to Word documents with side-by-side layout.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  ConvertToWordTest:
    - build_documents_manifest
    - convert_to_word

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: convert_to_word
    worker_type: "io"
    help: "Convert images and transcriptions to Word documents"
    function: "fichero.tools.convert_to_word.convert_to_word_batch"
    args:
      images_folder: "documents"
      transcription_manifest: "assets/manifests/documents_manifest.jsonl"
      transcription_folder: "documents"
      output_folder: "assets/word"
    outputs:
      - "assets/word"
