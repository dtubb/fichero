title: "Transcribe"
description: >
  OCR and AI transcription of document images using Qwen Max or LM Studio models.

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  TranscribeTest:
    - build_documents_manifest
    - transcribe

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    output_scope: "folder"  # Manifest is folder-level
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: transcribe
    worker_type: "io"
    help: "Transcribe images using AI models with async DashScope (file-based)"
    function: "fichero.tools.transcribe.transcribe_batch"
    output_scope: "file"  # Each transcription belongs to its source image
    args:
      source_folder: "documents"
      source_manifest: "assets/manifests/documents_manifest.jsonl"
      output_folder: "assets/transcriptions"
      provider: "dashscope"
      model: "qwen-vl-ocr"
      use_async: true
      max_concurrent: 15
    outputs:
      - "assets/transcriptions"
      - "assets/transcriptions/transcriptions_manifest.jsonl"
