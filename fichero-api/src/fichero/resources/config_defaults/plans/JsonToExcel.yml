title: "JSON to Excel"
description: "Minimal workflow for testing json_to_excel tool"

vars:
  name: "Fichero"
  language: "es"
  version: "0.1.0"
  project_folder: ''
  documents_folder: ''
  assets_folder: ''

workflows:
  # JSON to Excel only workflow - for testing Excel export
  JsonToExcelTest:
    - build_documents_manifest
    - json_to_excel

commands:
  - name: build_documents_manifest
    worker_type: "io"
    help: "Generate the documents manifest listing"
    function: "fichero.tools.build_documents_manifest.build_documents_manifest_batch"
    args:
      source_folder: "documents"
      output_manifest: "assets/manifests/documents_manifest.jsonl"
    outputs:
      - "assets/manifests/documents_manifest.jsonl"

  - name: json_to_excel
    worker_type: "cpu"
    help: "Convert JSON catalogue files to Excel spreadsheet"
    function: "fichero.tools.json_to_excel.json_to_excel"  # Note: NOT _batch
    args:
      json_file: "assets/catalogues/catalogue.json"  # Input JSON file
      output_file: "assets/excel_exports/catalogue.xlsx"  # Output Excel file
      flatten: true
      max_depth: 3
    outputs:
      - "assets/excel_exports/catalogue.xlsx"
