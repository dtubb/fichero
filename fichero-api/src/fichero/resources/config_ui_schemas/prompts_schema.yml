title: "prompts_title"
description: "prompts_description"
window_title: "prompts_window_title"
window_size: [1000, 700]

sections:
  - id: "general"
    title: "prompts_general_title"
    sections:
      - title: "prompts_config_info_title"
        fields:
          - id: "name"
            type: "text_input"
            label: "prompts_config_name"
            validation:
              required: true
            help: "prompts_config_name_help"
          - id: "description"
            type: "multiline_text"
            label: "prompts_description_label"
            height: 60
            help: "prompts_description_help"
          - id: "intelligent_chunking"
            type: "switch"
            label: "prompts_intelligent_chunking"
            help: "prompts_intelligent_chunking_help"
          - id: "chunk_overlap"
            type: "number_input"
            label: "prompts_chunk_overlap"
            min: 0
            max: 1000
            help: "prompts_chunk_overlap_help"

  - id: "llm"
    title: "prompts_llm_settings_title"
    sections:
      - title: "prompts_model_config_title"
        fields:
          - id: "llm.backend"
            type: "selection"
            label: "prompts_backend"
            options: ["openai", "anthropic", "local", "qwen"]
            help: "prompts_backend_help"
          - id: "llm.model"
            type: "text_input"
            label: "prompts_model_name"
            placeholder: "prompts_model_name_placeholder"
            help: "prompts_model_name_help"
          - id: "llm.temperature"
            type: "number_input"
            label: "prompts_temperature"
            min: 0.0
            max: 2.0
            step: 0.1
            help: "prompts_temperature_help"
          - id: "llm.max_tokens"
            type: "number_input"
            label: "prompts_max_tokens"
            min: 1
            max: 1000000
            help: "prompts_max_tokens_help"
          - id: "llm.top_p"
            type: "number_input"
            label: "prompts_top_p"
            min: 0.0
            max: 1.0
            step: 0.05
            help: "prompts_top_p_help"
          - id: "llm.frequency_penalty"
            type: "number_input"
            label: "prompts_frequency_penalty"
            min: -2.0
            max: 2.0
            step: 0.1
            help: "prompts_frequency_penalty_help"
          - id: "llm.presence_penalty"
            type: "number_input"
            label: "prompts_presence_penalty"
            min: -2.0
            max: 2.0
            step: 0.1
            help: "prompts_presence_penalty_help"

      - title: "prompts_request_settings_title"
        fields:
          - id: "llm.timeout"
            type: "number_input"
            label: "prompts_timeout"
            min: 10
            max: 600
            help: "prompts_timeout_help"
          - id: "llm.retry_attempts"
            type: "number_input"
            label: "prompts_retry_attempts"
            min: 1
            max: 10
            help: "prompts_retry_attempts_help"
          - id: "llm.retry_delay"
            type: "number_input"
            label: "prompts_retry_delay"
            min: 1
            max: 60
            help: "prompts_retry_delay_help"

  - id: "prompts"
    title: "prompts_prompts_title"
    sections:
      - title: "prompts_system_prompts_title"
        fields:
          - id: "prompts.system_prompt"
            type: "multiline_text"
            label: "prompts_system_prompt"
            height: 120
            help: "prompts_system_prompt_help"
          - id: "prompts.user_prompt_template"
            type: "multiline_text"
            label: "prompts_user_prompt_template"
            height: 80
            help: "prompts_user_prompt_template_help"

  - id: "steps"
    title: "prompts_processing_steps_title"
    sections:
      - title: "prompts_steps_config_title"
        description: "prompts_steps_config_description"
        fields:
          - id: "steps_info"
            type: "label"
            label: "prompts_steps_info" 