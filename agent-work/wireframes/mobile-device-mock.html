<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichero Device Capture Wireframe</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d8d8dc;
      --accent: #007aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e9e9ed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .stage {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(520px, 720px);
      gap: 28px;
      align-items: start;
    }

    .frame {
      background: #111;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.24);
    }

    .iphone {
      border-radius: 42px;
      padding: 14px;
    }

    .ipad {
      border-radius: 30px;
      padding: 14px;
    }

    .screen {
      background: var(--bg);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .iphone .screen {
      min-height: 760px;
      border-radius: 30px;
    }

    .ipad .screen {
      min-height: 760px;
      border-radius: 18px;
    }

    .statusbar {
      height: 44px;
      padding: 14px 22px 0;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }

    main {
      padding: 18px;
      display: block;
      align-content: start;
      overflow-y: auto;
    }

    .ipad main {
      width: min(460px, 100%);
      margin: 0 auto;
      padding-top: 34px;
    }

    .pane {
      display: none;
      gap: 16px;
    }

    .pane.active {
      display: grid;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .card {
      background: var(--panel);
      border-radius: 18px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .primary-card {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .field {
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fdfdfd;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 15px;
    }

    .scanner {
      height: 220px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(0, 122, 255, 0.14), rgba(255, 255, 255, 0.82)),
        #fff;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .scanner::before,
    .scanner::after {
      content: "";
      position: absolute;
      inset: 28px;
      border: 4px solid var(--accent);
      border-top-color: transparent;
      border-bottom-color: transparent;
      border-radius: 18px;
    }

    .scanner::after {
      inset: 72px;
      border-color: rgba(0, 0, 0, 0.16);
      border-left-color: transparent;
      border-right-color: transparent;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      padding: 0 16px;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: #e8e8ed;
      color: var(--text);
    }

    .row {
      min-height: 62px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      border-top: 1px solid var(--line);
    }

    .row:first-child { border-top: 0; }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: #e8f1ff;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 20px;
    }

    .swiped {
      background:
        linear-gradient(90deg, transparent 0 calc(100% - 84px), #ff3b30 calc(100% - 84px) 100%),
        var(--panel);
    }

    .swiped > * {
      transform: translateX(-70px);
    }

    @media (max-width: 980px) {
      .stage {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section>
      <div class="frame iphone" aria-label="iPhone no-Mac-connected mock">
        <div class="screen">
          <div class="statusbar"><span>9:41</span><span>100%</span></div>
          <main data-device>
            <section class="pane active" data-pane="connect">
            <h1>Connect to Fichero on Mac</h1>
            <section class="card primary-card">
              <div class="scanner" aria-hidden="true"></div>
              <button class="primary" data-go="signin">Scan QR Code</button>
              <button class="secondary">Capture Document</button>
            </section>
            </section>

            <section class="pane" data-pane="signin">
              <h1>Sign in to Fichero</h1>
              <section class="card primary-card">
                <div class="field">Username</div>
                <div class="field">Password</div>
                <button class="primary" data-go="capture">Sign In</button>
              </section>
            </section>

            <section class="pane" data-pane="capture">
              <h1>Capture Document</h1>
              <section class="card primary-card">
                <button class="primary">Capture Document</button>
              </section>
            <section class="card">
              <div class="row">
                <div class="icon">▧</div>
                <div><strong>IMG_1042</strong></div>
              </div>
              <div class="row swiped">
                <div class="icon">▧</div>
                <div><strong>IMG_1043</strong></div>
              </div>
              <div class="row">
                <div class="icon">▧</div>
                <div><strong>IMG_1044</strong></div>
              </div>
            </section>
            </section>
          </main>
        </div>
      </div>
    </section>

    <section>
      <div class="frame ipad" aria-label="iPad no-Mac-connected mock">
        <div class="screen">
          <div class="statusbar"><span>9:41</span><span>100%</span></div>
          <main data-device>
            <section class="pane active" data-pane="connect">
            <h1>Connect to Fichero on Mac</h1>
            <section class="card primary-card">
              <div class="scanner" aria-hidden="true"></div>
              <button class="primary" data-go="signin">Scan QR Code</button>
              <button class="secondary">Capture Document</button>
            </section>
            </section>

            <section class="pane" data-pane="signin">
              <h1>Sign in to Fichero</h1>
              <section class="card primary-card">
                <div class="field">Username</div>
                <div class="field">Password</div>
                <button class="primary" data-go="capture">Sign In</button>
              </section>
            </section>

            <section class="pane" data-pane="capture">
              <h1>Capture Document</h1>
              <section class="card primary-card">
                <button class="primary">Capture Document</button>
              </section>
            <section class="card">
              <div class="row">
                <div class="icon">▧</div>
                <div><strong>IMG_1042</strong></div>
              </div>
              <div class="row swiped">
                <div class="icon">▧</div>
                <div><strong>IMG_1043</strong></div>
              </div>
              <div class="row">
                <div class="icon">▧</div>
                <div><strong>IMG_1044</strong></div>
              </div>
            </section>
            </section>
          </main>
        </div>
      </div>
    </section>
  </div>
  <script>
    document.querySelectorAll("[data-device]").forEach((device) => {
      device.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.go;
          device.querySelectorAll("[data-pane]").forEach((pane) => {
            pane.classList.toggle("active", pane.dataset.pane === target);
          });
        });
      });
    });
  </script>
</body>
</html>
