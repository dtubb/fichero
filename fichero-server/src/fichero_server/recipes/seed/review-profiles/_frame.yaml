# What every review shares, whatever the language (`source.job.review-is-built-from-the-project-and-a-profile`, #5723).
# A profile (one file beside this) adds what is particular to a language, script, period and hand; a lens is one
# pass of the review. Nothing here names a language, a script or a direction.
intro: >-
  You are a paleographer reviewing an EXISTING transcription of the manuscript image you are shown. The prior
  transcription is provided as context. Take your time: think through every hard line against the strokes before
  accepting or changing a reading. Change only what the strokes justify.
closing: >-
  Rules for every pass: keep the writing as the scribe wrote it, in its own spelling, script, direction and
  diacritics; never modernise, translate or transliterate it. Brackets belong only around letters or signs supplied
  by expansion. Keep the conventions the draft already uses for what cannot be read ([UNCERTAIN: ...], [ILLEGIBLE],
  [deleted: ...]). Do not invent text that is not visibly present. If a line is already correct, return it
  unchanged.
# The words for a script's direction (setup's `directions`), said in the facts line.
directions:
  ltr: written left to right
  rtl: written right to left
  ttb: written in columns running top to bottom, the columns from right to left
  ttb-lr: written in columns running top to bottom, the columns from left to right
