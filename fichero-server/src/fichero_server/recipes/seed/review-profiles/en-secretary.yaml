id: en-secretary
title: English, secretary hand (16th–17th C.)
status: shipped
# Guidance reused from the Transcribe preset "English Secretary Hand (16th–17th C.)" (#6128): one wording, two places.
suits:
  languages: [en]
  scripts: [Latn]
  material: [handwriting]
  period: [1500, 1700]
context: >-
  The documents are English secretary hand of the 16th and 17th centuries: depositions, indentures, wills, letters.
  Expect the period's spelling (doe, hee, itt, yeare), u/v and i/j used interchangeably, thorn written as y, and the
  hooked abbreviation signs of the hand.
lenses:
  abbreviations:
    title: abbreviations, contractions and formulary
    text: |
      - Verify every expansion; brackets only around letters supplied by expansion. Thorn survives as y: ye = th[e], yt = th[at], wth = w[i]th, wch = w[hi]ch, Matie = Ma[jes]tie.
      - The -er/-ur/-re syllable is a hook over the preceding letter; per/par is p with a barred descender; -tion is often written -con with a tilde. Expand only where the expansion is unambiguous.
      - Identify the document's genre (indenture, deposition, will) and check the draft against its formulary ("This Indenture made...", "In the name of God Amen"). Where damage hides a standard formula, propose it as [UNCERTAIN: ...], never as clean text.
  orthography:
    title: orthography, letterforms and consistency
    text: |
      - Letterform audit: secretary c/t/e are near-identical; h drops a long looped descender; final -es is a hooked sign; r has twin forms; watch long-s. Where the draft's spelling implies a stroke the image does not show, correct it.
      - Period orthography stands (doe, hee, itt, yeare); u/v and i/j interchange. Do not modernise or repunctuate.
  names-and-dates:
    title: names, dates and the final check
    text: |
      - Collect every personal name, place name and date on the page (and in any reference material provided). The same person must read the same way throughout; a date must agree with the document's own heading or docket. Mark what cannot be resolved [UNCERTAIN: ...].
      - Uncertainty audit: every [UNCERTAIN: ...] either resolves (the strokes decide) or stays with its best single reading; every [ILLEGIBLE] is confirmed truly unreadable at this resolution.
      - Layout check: line breaks, marginalia, insertions, [deleted: ...], [Rúbrica]/[Sello] are where the page has them.
