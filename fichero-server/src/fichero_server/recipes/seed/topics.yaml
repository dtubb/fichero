# The topic registry: every explanation setup, the Inspector and Activity show, written once
# (`source.onboard.topics-written-once`, `source.onboard.teaches-the-method`, #5471).
#
# Two kinds of entry, one shape:
#   kind: job    one per registered recipe job (`recipes/jobs.py`); its id IS the job's id, its title
#                IS the job's name, and the job's description is read from here, nowhere else.
#   kind: topic  one per topic of section 7a ("What onboarding teaches") of
#                `docs/contributor_manual/specs/source/models-chains-and-projects.md`.
#
# Fields: title; short (one sentence); long (a paragraph that follows the short, never repeating
# it); example (what to show from the person's own pages, where there are some); manual (a path
# under docs/ when a manual page exists; none does yet, so it is left out). Plain words, a
# researcher's words. A sentence here must not be written again anywhere else in the engine
# (tests/unit/recipes/test_topic_registry.py checks).
topics:
  # --- Jobs: reading ------------------------------------------------------------------------------
  - id: prepare-the-image
    kind: job
    title: Prepare the image
    short: >-
      Crops, straightens, rotates or brightens a page and keeps the result as a new version of the
      image; the original is never changed.
    long: >-
      Damaged or faded pages read far better prepared. Every later step reads the prepared version,
      and you can always go back to the scan as it came.
  - id: split-pages
    kind: job
    title: Split pages
    short: Cuts a scan of an open book (two pages at once) into single pages, in order.
    long: >-
      Each half becomes a page of its own, so lines are found and read on one page at a time and the
      reading order runs from the left page to the right.
  - id: find-documents-in-a-folder
    kind: job
    title: Find documents in a folder
    short: >-
      Proposes which pages belong together as one document, such as a letter of three pages in an
      archive bundle, for you to confirm.
    long: >-
      It reads the text already there: a court's caption, a heading, a place and date, a greeting
      open a document; a signature or "Cópiese, notifíquese" closes one; a sentence running over the
      page joins two pages. Blank backs and pages photographed twice are reported, not made
      documents. Each proposed document has its kind (Sentencia, Carta, Cable …) and how sure it is.
      An accepted document becomes one document with its pages in order; by default only the
      clearest are accepted by themselves and the rest wait for you, and one undo puts them back.
  - id: find-regions
    kind: job
    title: Find regions
    short: >-
      Finds the blocks on a page (main text, margins, tables, headings, drawings) so each kind can
      be read the right way.
    long: >-
      A layout detector such as YOLO helps when pages mix kinds; on plain running text, finding the
      lines alone is usually enough.
  - id: find-lines
    kind: job
    title: Find lines
    short: Finds each line of writing and its baseline, so a line reader can read it.
    long: Kraken does this on your Mac for free.
  - id: put-in-order
    kind: job
    title: Put in order
    short: Works out the order the lines are read in, across columns and margins.
    long: >-
      The order is kept as a named reading order, so a second order (the margins first, say) can sit
      beside it.
  - id: refine-shapes
    kind: job
    title: Refine shapes
    short: Tightens rough boxes from one model with a more precise detector.
    long: >-
      Vision models often place lines roughly; a detector run afterwards keeps the same lines and
      fits their shapes to the writing.
  - id: find-signs
    kind: job
    title: Find signs
    short: Finds each sign on a tablet, seal or page, for scripts read sign by sign.
    long: >-
      Used for cuneiform, hieroglyphs, Linear B and scripts not yet deciphered, where a line is not
      the unit that is read.
  - id: find-a-tables-cells
    kind: job
    title: Find a table's cells
    short: Finds the rows, columns and cells of a table.
    long: >-
      Each cell becomes a segment of its own, with its row, column and any span, so it can be read
      and exported as a spreadsheet.
  - id: read-a-line
    kind: job
    title: Read each line
    short: Reads each line on its own.
    long: >-
      Line readers (Kraken, Tesseract for print) are fast, run on your Mac, and can be trained on
      your own corrected pages.
  - id: read-a-page
    kind: job
    title: Read a page
    short: Reads a whole page at once, usually with a vision model.
    long: Strong on hard pages, but it does not keep where each line was.
  - id: tie-text-to-lines
    kind: job
    title: Tie text to lines
    short: Places a page's text onto its found lines, line by line, so each line knows its words.
    long: >-
      This is what lets a page read by a vision model be corrected and trained on line by line.
  - id: correct
    kind: job
    title: Correct
    short: >-
      A second model checks each reading against the picture and proposes corrections, kept as new
      readings beside the first.
    long: >-
      It can be limited to the lines the first reader was unsure of, which saves time and money on
      long runs.
  - id: trace-a-drawing
    kind: job
    title: Trace a drawing
    short: Redraws a drawing, map or seal as a clean vector picture.
    long: The tracing is kept as a reading of the drawing's segment, beside the picture it came from.
  - id: identify-signs
    kind: job
    title: Identify signs
    short: Proposes which sign each mark is, with how sure it is, for a person to confirm.
    long: The proposals are checked against the project's sign list; nothing is settled until you confirm it.
  - id: transcribe-speech
    kind: job
    title: Transcribe speech
    short: Turns recorded speech into text with its timings.
    long: Each stretch of text keeps the moment it was spoken, so the recording can be played from any line.
  - id: translate-transliterate-normalise
    kind: job
    title: Translate, transliterate or normalise
    short: >-
      Makes a second reading in modern spelling, another script or another language, beside the
      original, never over it.
    long: >-
      What was written stays the record; the second reading is for searching, reading aloud or
      publishing.
  # --- Jobs: structure and knowledge --------------------------------------------------------------
  - id: split-into-entries
    kind: job
    title: Split into entries
    short: Splits a diary, register or ledger into its dated entries.
    long: Each entry becomes a segment with its date, so it can be found, sorted and placed on a timeline.
  - id: find-names-tag-words
    kind: job
    title: Find names
    short: Finds the people, places, dates and things named in the text.
    long: >-
      How well a tagger does depends on the language; each name found is tied to the words it came
      from, for you to confirm or correct.
  - id: find-statements
    kind: job
    title: Find statements
    short: >-
      Finds who did what to whom (sold, gave, owed, married), each tied to the words it came from.
    long: These statements are what the knowledge graph is built from, and each one can be checked.
  - id: work-out-dates
    kind: job
    title: Work out dates
    short: Turns dates as written (feast days, regnal years, any calendar) into exact dates.
    long: The date as written is kept beside the worked-out one, with how certain it is.
  - id: link-to-authorities
    kind: job
    title: Link to authorities
    short: >-
      Proposes links from people and places to Wikidata, VIAF, GeoNames or your own list, for you to
      confirm.
    long: A confirmed link lets your people and places be matched with other projects and published as linked data.
  - id: place-in-a-gazetteer
    kind: job
    title: Place in a gazetteer
    short: Gives each place its coordinates and a gazetteer identifier, naming the gazetteer.
    long: Placed names can be shown on a map and searched by where they are.
  - id: make-a-vector
    kind: job
    title: Make vectors for search
    short: Lets you search by meaning, not only by words.
    long: Chosen for your languages.
  - id: describe-for-the-catalogue
    kind: job
    title: Describe for the catalogue
    short: Proposes values for your catalogue fields from the page, for you to confirm.
    long: Facts only.
  - id: extract-to-a-table
    kind: job
    title: Extract to a table
    short: >-
      Fills one row per document or entry with your fields (for a sale record: seller, buyer, the
      person sold, price, date, place), each value tied to its text; exports as a spreadsheet.
    long: The fields come from the project's own metadata, so every row has the same columns.
  - id: pull-out-passages
    kind: job
    title: Pull out passages
    short: Gathers the passages on a question or theme, each with its source.
    long: The passages are collected into a note you can keep writing in.
  - id: train-a-model
    kind: job
    title: Train a model
    short: >-
      Trains a small model on your corrected pages, so it reads your material better and faster.
    long: >-
      A Kraken reader or a YOLO detector trains on this Mac; larger models on Hugging Face Jobs or a
      cluster, if the project lets pages leave the Mac.
  # --- Jobs: checking and output ------------------------------------------------------------------
  - id: check
    kind: job
    title: Check
    short: >-
      A person or a checker model confirms, corrects or rejects each proposal of a layer, with its
      reasons; a model's check is recorded as that model's, never as a person's.
    long: Which layer it checks (readings, names, statements, links) is a setting of the step.
  - id: export
    kind: job
    title: Export
    short: >-
      Writes your work out in the formats you name (TEI, PAGE, ALTO, plain text, Markdown, Excel,
      RDF, a website), kept up to date if you choose a synced folder.
    long: Every format is written from the same record, with where each piece came from.
  - id: publish
    kind: job
    title: Publish
    short: Publishes a folder as IIIF or a static website.
    long: Others can then read the pages, and link to them, without Fichero.
  # --- Topics: what onboarding teaches (section 7a) -----------------------------------------------
  - id: languages
    kind: topic
    title: Languages
    short: Each document is tagged with the languages it is written in, so the right models read it.
    long: >-
      Languages are named by standard tags and looked up in Glottolog, which also knows historical
      languages and dialects. A document can hold several: a Latin formula inside a Spanish letter.
      A language set on a folder applies to its pages and lines unless one of them says otherwise.
    example: A page with a Latin formula inside Spanish text.
  - id: scripts
    kind: topic
    title: Scripts
    short: The script is the writing system a text uses, named by its ISO 15924 code.
    long: >-
      The script decides which way the text runs, where the line sits (on, under or through the
      writing) and which models can read it. One script can have very different styles, such as
      naskh and nastaliq for Arabic, and a model trained on one may fail on the other.
    example: The script and direction worked out for a sample page.
  - id: fonts
    kind: topic
    title: Fonts
    short: A script can only be shown in a font that has its characters.
    long: >-
      Fichero ships fonts for many scripts and you can add your own. Without the right font a
      reading shows empty boxes even though the text underneath is correct.
    example: A sample line shown in the chosen font.
  - id: glyphs-and-unicode
    kind: topic
    title: Glyphs and Unicode
    short: Text is stored as Unicode characters, which are not the same thing as the shapes you see.
    long: >-
      A glyph is a drawn shape; a character is what it stands for; a code point is the number that
      stores it. Accents can be separate combining marks. Private-use characters can stand for
      signs Unicode lacks, but other software will not know what they mean.
    example: A sample word broken into its characters.
  - id: faithful-writing
    kind: topic
    title: A faithful way to write the script
    short: >-
      Before transcribing, decide which differences in the writing to keep and which to treat as
      the same letter.
    long: >-
      Two shapes can be one grapheme (a long s and a round s) or two; abbreviations can be kept or
      expanded; signs without a Unicode character need a declared stand-in. Writing these choices
      down once keeps every transcriber, and every model trained on the work, consistent.
    example: Two letterforms on a sample page that are one grapheme.
  - id: finding-sources
    kind: topic
    title: Finding sources
    short: Many archives publish their pages as IIIF, which Fichero can add by reference.
    long: >-
      Pasting a IIIF manifest link adds its pages without downloading the whole collection; the
      archive stays the source and its citation travels with every page.
    example: A manifest link pasted in, its pages shown.
  - id: models-and-memory
    kind: topic
    title: Models and memory
    short: A model is a trained program that does one job, and its size decides whether it runs on this Mac.
    long: >-
      A model must fit in memory with room left for macOS and Fichero; a larger one runs in the
      cloud instead, which costs money and sends pages off the Mac. Setup only proposes models
      that fit, and says why.
    example: This Mac has 8 GB, so the 3B corrector fits and the 7B does not.
  - id: kraken
    kind: topic
    title: Kraken
    short: Kraken finds lines on a page and reads them, on this Mac, with models made for historical writing.
    long: >-
      It has two kinds of model: a segmentation model finds the lines, a recognition model reads
      them. Both can be trained on your own corrected pages, and published models cover many
      scripts and periods.
    example: The lines Kraken found on a sample page.
  - id: layout
    kind: topic
    title: YOLO and layout
    short: A layout detector such as YOLO finds the kinds of region on a page, not the words.
    long: >-
      It helps when pages mix main text, margins, tables and drawings, so each is read the right
      way. On plain running text it adds little.
    example: Regions found on a sample page.
  - id: forms-and-tables
    kind: topic
    title: Forms and tables
    short: Tables and printed forms are read cell by cell, keeping their rows and columns.
    long: >-
      Finding the cells first means each value keeps its place, so a register or a census sheet
      can be exported as a spreadsheet with the same columns as the page.
    example: A table on a sample page.
  - id: workflows-and-recipes
    kind: topic
    title: Workflows and recipes
    short: A workflow chains a few tools; a recipe is a project's steps, models, settings and where each runs.
    long: >-
      Setup proposes a recipe from your answers and says why it chose each step. You can follow a
      recipe someone else published, override one step, or share yours; a recipe is a file you can
      read.
    example: The proposed recipe, step by step.
  - id: entities
    kind: topic
    title: Entities
    short: An entity is a person, place or thing; a mention is one place in the text that names it.
    long: >-
      Many mentions can point to one entity, spelled differently each time. A tagger proposes them;
      how well depends on the language and period, so its proposals wait for you to confirm.
    example: Names found in a sample line.
  - id: statements
    kind: topic
    title: Statements
    short: A statement says that a subject did something to an object, such as a sale or a marriage.
    long: >-
      Each statement keeps the words it was found in, so anyone can see why it is there. Together
      they make the knowledge graph you can question.
    example: A sold B to C, found in a sample.
  - id: maps
    kind: topic
    title: Maps
    short: Places named in the text can be found in a gazetteer and shown on a map.
    long: >-
      A gazetteer gives each place coordinates and an identifier; an old map can be georeferenced so
      it lies over the modern one.
    example: A place in a sample placed on a map.
  - id: time-and-calendars
    kind: topic
    title: Time and calendars
    short: Dates written in other calendars or by feast days are worked out onto one timeline.
    long: >-
      Calendars changed at different times in different places, and many dates are uncertain or
      given as a range. Fichero keeps the date as written and the worked-out date together, with
      how certain it is.
    example: A date in a sample, normalised.
  - id: normalisation
    kind: topic
    title: Normalisation
    short: A text can be kept as written, with its abbreviations expanded, or in modern spelling.
    long: >-
      The record always keeps what was written; expanded and normalised readings sit beside it for
      searching and reading, and you choose which one each export uses.
    example: An abbreviation in a sample, three ways.
  - id: output-formats
    kind: topic
    title: Output formats
    short: Your work can be written out in the standard formats other tools and archives read.
    long: >-
      PAGE and ALTO keep lines and their shapes, TEI keeps an edited text with its markup, IIIF
      publishes images and annotations, and plain text, Markdown and spreadsheets are for reading
      and analysis. A synced folder keeps the files current as the work changes.
    example: A sample page's TEI.
  - id: fine-tuning
    kind: topic
    title: Fine-tuning and distilling
    short: A small model trained on your corrections can read your material better and faster than a general one.
    long: >-
      Distilling uses a large teacher model to label a sample, then trains a small student model
      on those labels. It pays once enough lines are corrected, and on large volumes.
    example: The corrected-line count so far, against the threshold.
  - id: remote-compute
    kind: topic
    title: HPC and remote compute
    short: Training or large models can run on a university cluster or a paid GPU service instead of this Mac.
    long: >-
      Each choice has a cost and a time, and sends pages off the Mac; a project can forbid that.
      Fichero shows the estimate for running here and there before anything starts.
    example: The estimate for training here and there.
