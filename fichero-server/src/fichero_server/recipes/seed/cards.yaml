    jobs: [find-lines, find-regions]
    scripts: any
    languages: any
    material: [handwriting, print, typescript]
    licence: Apache-2.0
    size_gb: 0.01
    memory_gb: 3.6          # measured 2.3-3.6 GB resident after a page (#5370)
    trainable: true          # ketos segtrain
    note: Kraken's built-in line and region finder (blla); ships inside the app.
    short_name: Kraken line finder (blla)
    runs_on: this-mac
    cost: Free, on this Mac
    source_url: https://github.com/mittagessen/kraken
    unstated:
      period: none recorded, the catalogue keeps only what a card states
      cer_published: none recorded, the catalogue keeps only what a card states
