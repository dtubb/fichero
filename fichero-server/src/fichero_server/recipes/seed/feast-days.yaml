# Feast days and liturgical dates (`source.date.feast-days`, #5542): a date written as a feast ("dia de San Juan de 1791").
# Data, not code: a name in any language is one more row of `names`, a new phrase that introduces a feast one more
# of `introducers`. `easter: N` is N days after Easter (movable feasts); `date: MM-DD` is a fixed day. `also` names the
# other feasts the same words can mean ("San Juan": the Baptist, or the Evangelist); the first is the commoner.
# Names are written folded: lower case, no accents, no full stops or apostrophes.
