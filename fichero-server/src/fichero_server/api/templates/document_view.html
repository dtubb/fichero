<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ document.name }}</title>
    <style>
        /* Bundled fallback fonts (#5210, #5206), served by the engine at /view/fonts/ (SIL OFL
           1.1). They sit AFTER the system fonts: the system font still draws every glyph it has,
           and these only fill what macOS lacks -- MUFI private-use letters (Junicode), Syriac,
           Mongolian, Coptic, Cherokee -- so a medieval abbreviation is a letter, not a box. */
        @font-face { font-family: "Fichero Junicode"; src: url("/view/fonts/JunicodeVF-Roman.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
        @font-face { font-family: "Fichero Noto Syriac"; src: url("/view/fonts/NotoSansSyriac-VF.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
        @font-face { font-family: "Fichero Noto Mongolian"; src: url("/view/fonts/NotoSansMongolian-Regular.ttf") format("truetype"); font-display: swap; }
        @font-face { font-family: "Fichero Noto Coptic"; src: url("/view/fonts/NotoSansCoptic-Regular.ttf") format("truetype"); font-display: swap; }
        @font-face { font-family: "Fichero Noto Cherokee"; src: url("/view/fonts/NotoSansCherokee-VF.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
        :root {
            color-scheme: light dark;
            /* Apple system defaults — match the native app chrome (#1228), then the bundled
               fallbacks for what the system fonts lack (#5210). */
            --font-fallbacks: "Fichero Junicode", "Fichero Noto Syriac", "Fichero Noto Mongolian", "Fichero Noto Coptic", "Fichero Noto Cherokee";
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, var(--font-fallbacks), sans-serif;
            --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
            --bg: #f7f4ee;
            --panel: rgba(255, 255, 255, 0.85);
            --text: #1f1d1a;
            --muted: #6a6258;
            --line: rgba(64, 53, 39, 0.14);
            --accent: #0d6b6f;
            --accent-soft: rgba(13, 107, 111, 0.14);
            --claim: #b45014;
            --claim-soft: rgba(180, 80, 20, 0.14);
        }

        /* Browser fallback for dark mode. In the Fichero app these are
           overridden by live macOS system colors injected from Swift
           (DocumentKGPaneRoute.systemThemeCSS), so the pane matches the OS
           appearance + accent exactly. */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1b18;
                --panel: rgba(44, 40, 36, 0.85);
                --text: #ece7df;
                --muted: #a59b8d;
                --line: rgba(236, 231, 223, 0.16);
                --accent: #3fb6ba;
                --accent-soft: rgba(63, 182, 186, 0.18);
                --claim: #e0793a;
                --claim-soft: rgba(224, 121, 58, 0.20);
            }
        }

        * { box-sizing: border-box; }

        /* The page can never be wider than the pane (#4385).
           `pre-wrap` on the transcript body wraps at whitespace but cannot
           break an unbroken token, so a single long OCR/HTR run — a numeric
           string, an unspaced sequence where the model inferred no word
           boundaries, a whole paragraph returned as one line — set a
           min-content width for the whole page and the pane scrolled
           sideways to reveal it. On a handwriting-transcription corpus that
           is the normal case, not an edge case.
           This is the backstop: even if a future rule reintroduces an
           over-wide descendant, the document root refuses to scroll
           horizontally rather than silently going back to a wide page.
           Anything genuinely unwrappable gets `.overflow-scroll-x` below and
           scrolls inside its own box instead of widening the page. */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        /* The one sanctioned escape hatch: content that truly cannot wrap
           (a wide table, a preformatted block) scrolls WITHIN itself. */
        .overflow-scroll-x {
            max-width: 100%;
            overflow-x: auto;
        }

        body {
            margin: 0;
            font-family: var(--font-system);
            /* Flat macOS-style surface that matches the Document Inspector:
               the live system background (var(--bg) is overridden from Swift
               with .textBackgroundColor), not a cream "paper" gradient (#1280). */
            background: var(--bg);
            color: var(--text);
            /* Reader paragraph wrapping (#3684): inherited by prose paragraphs.
               Swift injects --reader-text-wrap from the Reader setting (pretty =
               no orphan last-lines); "pretty" is the on-target default. */
            text-wrap: var(--reader-text-wrap, pretty);
        }

        .shell {
            /* Fixed viewport height so only `.content` scrolls. The native
               Swift toolbar owns tab switching, and the page no longer carries
               its own title/eyebrow header — the app's selection already says
               what's shown, so the chrome would be redundant (#1244). */
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr;
        }

        /* The native Swift toolbar (DocumentKGSurface) now owns the
           Transcript/Digest/Graph switcher, so the in-page tab bar is hidden.
           The markup is retained: `fichero.showTab` drives it, and it remains
           a working fallback when the page is opened directly in a browser. */
        .tabs {
            display: none;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .tabs button {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font: 600 12px/1.2 var(--font-system);
            padding: 7px 12px;
            cursor: pointer;
        }

        .tabs button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .content {
            /* Vertical only (#4385). This is the pane's scroll container, so
               leaving it `auto` on both axes is what turned an over-wide page
               into a horizontal scrollbar instead of a wrap. */
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            min-height: 0;
        }

        .panel {
            /* Flat, square, seamless with the page background — no rounded
               "paper card" border-radius/shadow. Matches the inspector's flat
               treatment (#1280). */
            background: var(--bg);
            padding: 12px;
        }

        .hidden { display: none; }

        .empty {
            color: var(--muted);
            font: 500 13px/1.5 var(--font-system);
            padding: 16px;
        }

        .transcript {
            /* Reader body text derives from the Swift-injected semantic base
               size (--reader-base-size); the 14px fallback keeps it readable in
               a plain browser. The Reader font-size setting scales the var (#3681). */
            font-size: var(--reader-base-size, 14px);
            line-height: 1.6;
            display: grid;
            gap: 1em;
        }

        .transcript-page {
            /* Offscreen pages cost nothing (perf 2026-08-19): the browser
               skips their layout and paint entirely, which is how a huge
               website scrolls instantly in Safari. The intrinsic-size hint
               keeps the scrollbar honest before a page is first laid out. */
            content-visibility: auto;
            /* BLOCK axis only. The shorthand (`contain-intrinsic-size: auto
               480px`) also stamped 480px as the intrinsic WIDTH, so every
               offscreen page reported 480px wide inside a 200px pane and the
               reader grew a horizontal scrollbar (ReaderTranscriptWrapTests
               caught it at 120-400pt). The inline size must keep coming from
               layout. */
            contain-intrinsic-block-size: auto 480px;
            /* Definite max width tied to the pane (#4385) so layout can never
               resolve the page to its content width. */
            max-width: 100%;
            scroll-margin-block-start: 0.75em;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 0.8em;
            box-shadow: 0 0.15em 0.6em var(--line);
            padding: 1.25em;
        }

        .page-marker {
            align-items: center;
            color: var(--muted);
            display: flex;
            font: 600 0.72em/1 var(--font-system);
            gap: 0.6em;
            letter-spacing: 0.08em;
            margin-bottom: 1em;
            text-transform: uppercase;
        }

        /* The per-page proxy icon (macOS titlebar-proxy idiom, 2026-08-29):
           identifies the page node; click reveals it in the library. */
        .page-proxy {
            background: none;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            line-height: 0;
            padding: 0.1em;
        }

        .page-proxy svg {
            fill: currentColor;
            height: 1.2em;
            width: auto;
            min-height: 0;
        }

        /* The page's own thumbnail as the proxy (Daniel, 2026-08-29: "any
           chance the proxy icon can actually be the page icon?"). The glyph
           stays underneath as the load-failure fallback. */
        .page-proxy img {
            border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
            border-radius: 2px;
            display: inline-block;
            height: 1.35em;
            object-fit: cover;
            vertical-align: -0.25em;
            width: auto;
        }

        .page-proxy img[hidden] { display: none; }

        .page-proxy:hover {
            color: var(--accent);
        }

        /* A region section's own name (a diary entry's date, a segment's
           label) — normal case beside the uppercase running number. */
        .page-label {
            letter-spacing: 0;
            text-transform: none;
        }

        .transcript-page-body {
            white-space: pre-wrap;
            /* `anywhere`, NOT `break-word` (#4385): both break an otherwise
               unbreakable token, but only `anywhere` also shrinks the
               element's min-content width. With `break-word` the body still
               reports a minimum as wide as its longest token, so the page
               resolves to content width and the pane scrolls — the exact
               failure being fixed. */
            overflow-wrap: anywhere;
            /* Belt as well as braces (#4385): `overflow-wrap` stops a long
               token forcing the width; this stops the BODY box itself
               resolving wider than its page. The wrap rule governs the text,
               this governs the element. */
            max-width: 100%;
        }

        /* The page's directions (#5147 Reader half), from the line map's per-line `direction`.
           A `ttb` page is columns, right to left (CJK); it scrolls inside its own box so the
           pane never scrolls sideways (#4385). An `rtl` page is `dir="rtl"`. A run whose
           direction differs from the page's is a `<span dir>` isolate, so the Unicode bidi
           algorithm orders it on its own and it never reorders its neighbours. */
        .transcript-page-body[data-direction="ttb"] {
            writing-mode: vertical-rl;
            max-height: 70vh;
            overflow-x: auto;
        }
        .transcript-page-body span[dir] {
            unicode-bidi: isolate;
        }
        /* One line per manuscript line (#5208): the separator between two lines is followed by a
           generated line break. A diplomatic reading keeps the manuscript's lines; in a `ttb` page
           the same break starts the next column. The break is CSS, never text, so no offset moves. */
        .transcript-page-body .line-break::after {
            content: "\A";
            white-space: pre;
        }
        /* A line whose words were all deleted (13b, `deleting-words-keeps-ink`): the line is still on
           the page, in its place, under its segment -- only its reading is empty. The placeholder is
           drawn, never text, so the page's text and every offset walk are unchanged. */
        .transcript-page-body .line-empty::before {
            content: "(empty line)";
            color: var(--muted);
            font-style: italic;
        }

        /* The Source view's selected lines (#5155): a CSS Custom Highlight over text ranges, so
           no line is wrapped in an element and the caret never moves. The system selection
           colour, quietly. */
        ::highlight(fichero-selected-lines) {
            background-color: color-mix(in srgb, Highlight 28%, transparent);
        }

        /* A line whose words were refused because the reading they corrected no longer counts
           (13b, `stale-keeps-your-words`): the words stay, marked, with the three choices below
           the page. Nothing is sent until the person chooses. */
        ::highlight(fichero-stale-lines) {
            text-decoration: underline wavy color-mix(in srgb, orange 80%, transparent);
            background-color: color-mix(in srgb, orange 12%, transparent);
        }
        .stale-bar {
            margin: 0.5em 0;
            padding: 0.4em 0.6em;
            border-left: 3px solid orange;
            color: var(--text);
            font-size: 0.9em;
        }
        .stale-bar button { margin-left: 0.4em; }

        /* Out of reach of the engine (13b, `stale-keeps-your-words`, ruled 2026-09-20): the text is
           read-only and says why, and words typed but not yet taken are kept, marked, and sent
           when the engine is back. */
        .engine-banner {
            margin: 0 0 0.6em 0;
            padding: 0.4em 0.6em;
            border-left: 3px solid var(--muted);
            color: var(--text);
            font-size: 0.9em;
        }
        ::highlight(fichero-unsent-lines) {
            text-decoration: underline dotted var(--muted);
        }
        .stale-bar .stale-compare del { color: var(--muted); }
        .stale-bar .stale-compare ins { text-decoration: none; font-weight: 600; }

        /* Table representations (2026-08-29): a real table in the page's own
           idiom, inside its own horizontal scroller — a wide ledger scrolls
           HERE, never the page body (#4385's rule applied to tables). */
        .artifact-svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.artifact-html { width: 100%; min-height: 420px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; background: white; }
.table-scroll {
            max-width: 100%;
            overflow-x: auto;
        }

        .artifact-table {
            border-collapse: collapse;
            font-size: 0.92em;
        }

        .artifact-table th,
        .artifact-table td {
            border: 1px solid var(--line);
            padding: 0.35em 0.6em;
            text-align: left;
            vertical-align: top;
        }

        .artifact-table th {
            background: var(--bg);
            color: var(--muted);
            font: 600 0.85em/1.3 var(--font-system);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* The annotation review surface (Daniel, 2026-08-30 ruling 5): the
           scope's markup grouped by page, every entry CITED to its page —
           the Marked idea, a review over the marks. */
        .annotation-group {
            margin-bottom: 1.5em;
        }

        .annotation-cite {
            color: var(--muted);
            cursor: pointer;
            font: 600 0.85em/1.3 var(--font-system);
            letter-spacing: 0.04em;
            margin-bottom: 0.5em;
            text-transform: uppercase;
        }

        .annotation-entry {
            border-left: 3px solid var(--line);
            margin: 0 0 0.75em;
            padding: 0.15em 0 0.15em 0.75em;
        }

        .annotation-kind {
            color: var(--muted);
            font: 600 0.8em/1.3 var(--font-system);
            letter-spacing: 0.03em;
        }

        .annotation-checks {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-left: 0.4em;
        }

        .annotation-anchor {
            border-radius: 3px;
            display: inline-block;
            margin: 0.25em 0 0;
            padding: 0.1em 0.3em;
        }

        .annotation-anchor.anchor-underline { text-decoration: underline; }
        .annotation-anchor.anchor-strikethrough { text-decoration: line-through; }

        .annotation-note {
            font-style: italic;
            margin-top: 0.25em;
        }

        .annotation-tags {
            color: var(--muted);
            font: 500 0.8em/1.4 var(--font-system);
            margin-top: 0.25em;
        }

        /* The compare view (Daniel, 2026-08-30 ruling 6): one column per
           artifact, labeled with its REAL provenance; wide comparisons scroll
           in their own scroller, never the page body (#4385's rule again). */
        .compare-scroll {
            max-width: 100%;
            overflow-x: auto;
        }

        .compare-grid {
            align-items: flex-start;
            display: flex;
            gap: 1em;
        }

        .compare-column {
            background: var(--panel, transparent);
            border: 1px solid var(--line);
            border-radius: 6px;
            flex: 1 0 18em;
            max-width: 32em;
            padding: 0.75em 0.9em;
        }

        .compare-label {
            font: 600 0.9em/1.4 var(--font-system);
        }

        .compare-meta {
            color: var(--muted);
            font: 500 0.78em/1.4 var(--font-system);
            margin-bottom: 0.6em;
        }

        .compare-body {
            line-height: 1.6;
        }

        mark.diff-ins {
            background: rgba(60, 165, 90, 0.25);
            border-radius: 2px;
            color: inherit;
        }

        mark.diff-del {
            background: rgba(205, 70, 70, 0.18);
            border-radius: 2px;
            color: inherit;
            opacity: 0.75;
            text-decoration: line-through;
        }

        /* An untranscribed page is a PAGE, not a gap (#4356): it keeps its
           number and says what is missing, so the sequence still matches the
           preview and the work still to do is visible. */
        .transcript-page.empty-page {
            background: transparent;
            border-style: dashed;
            box-shadow: none;
        }

        .page-placeholder {
            color: var(--muted);
            font: 500 0.9em/1.5 var(--font-system);
        }

        /* Current page layer (#4356 / #4355): the page the preview pane shows.
           Deliberately NOT find-yellow — an accent edge, so a find match inside
           the current page stays distinguishable from the page marker itself. */
        .transcript-page.current {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .transcript-page.current .page-marker {
            color: var(--accent);
        }

        /* Per-page work in progress (#4357): only pages in the run's scope. */
        .page-working {
            align-items: center;
            color: var(--muted);
            display: flex;
            font: 500 0.85em/1.4 var(--font-system);
            gap: 0.5em;
            margin-top: 0.75em;
        }

        .page-working-spinner {
            animation: page-working-spin 0.9s linear infinite;
            border: 2px solid var(--line);
            border-radius: 50%;
            border-top-color: var(--accent);
            height: 0.9em;
            width: 0.9em;
        }

        @keyframes page-working-spin {
            to { transform: rotate(360deg); }
        }

        .transcript mark {
            background: rgba(255, 223, 128, 0.75);
            border-radius: 3px;
            padding: 0 2px;
        }

        /* The library-search match: the RELEVANT passage the hit matched,
           lit from the backend anchor (char range), distinct from the amber
           claim/span marks so it reads as "this is why this page is a result". */
        .transcript mark[data-highlight="search"] {
            background: rgba(255, 179, 64, 0.85);
            box-shadow: 0 0 0 1px rgba(200, 120, 0, 0.35);
        }

        .digest-group + .digest-group {
            margin-top: 18px;
            border-top: 1px solid var(--line);
            padding-top: 14px;
        }

        .digest-group h3 {
            margin: 0 0 10px;
            font: 700 14px/1.3 var(--font-system);
        }

        /* Entity names render as clickable macOS-accent lozenges, not bold
           text — clicking opens that entity across the library via the bridge
           (#1466 / #1363). */
        .entity-lozenge {
            font: 600 13px/1.2 var(--font-system);
            color: var(--accent);
            background: var(--accent-soft);
            border: none;
            border-radius: 999px;
            padding: 3px 11px;
            cursor: pointer;
        }

        .entity-lozenge:hover {
            text-decoration: underline;
        }

        .claim-row {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: var(--panel);
            cursor: pointer;
        }

        .claim-row + .claim-row { margin-top: 8px; }

        .claim-row.active {
            border-color: var(--claim);
            background: var(--claim-soft);
        }

        .claim-meta {
            margin-top: 6px;
            color: var(--muted);
            font: 500 11px/1.4 var(--font-mono);
        }

        /* Provenance + click-to-expand source passage, inline under the claim
           (#1467). The hint is always visible; the source box reveals on click
           (the .source-open class is toggled on the .claim-row). */
        .claim-source-hint {
            margin-top: 6px;
            color: var(--accent);
            font: 600 11px/1.4 var(--font-system);
        }

        .claim-source-hint::before { content: "\25B8  "; }
        .claim-row.source-open .claim-source-hint::before { content: "\25BE  "; }

        .claim-source {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 4px;
            color: var(--text);
            font: 400 12px/1.55 var(--font-system);
            white-space: pre-wrap;
            /* Same half-configured wrap as the transcript body (#4385): a
               claim's source excerpt is a verbatim slice of the same OCR
               text, so it carries the same unbreakable runs. */
            overflow-wrap: anywhere;
        }

        .claim-row.source-open .claim-source { display: block; }

        /* Let the graph fill the whole pane instead of a tiny fixed box (#1465).
           The WebKit pane itself owns the viewport height; give the graph a
           real, definite drawing area and compute the SVG viewBox from that
           size so it does not sit in a small fixed 440x340 square. */
        #graph-panel:not(.hidden) {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 24px);
        }

        .graph-wrap {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
        }

        /* Scoped to the graph pane — as a bare `svg` rule its min-height
           leaked onto every inline icon in the document, most visibly the
           page-proxy glyph, which blew up to viewport height. */
        .graph-wrap svg {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 96px);
            display: block;
        }

        .graph-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
        }

        .graph-scope-toggle {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            font: 600 12px/1.2 var(--font-system);
            padding: 5px 8px;
            cursor: pointer;
        }

        .node {
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        .node.dimmed { opacity: 0.35; }
        .node.active circle { fill: var(--accent); }
        .node.active text { fill: var(--accent); font-weight: 700; }
        .node circle {
            fill: rgba(13, 107, 111, 0.16);
            stroke: var(--accent);
            stroke-width: 1.5;
        }

        .node text {
            font: 600 12px/1.2 var(--font-system);
            fill: var(--text);
        }

        .edge {
            stroke: rgba(64, 53, 39, 0.24);
            stroke-linecap: round;
        }

        .legend {
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
            margin-bottom: 10px;
        }

        .timeline-list,
        .map-shell {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-meta,
        .map-meta {
            color: var(--muted);
            font: 500 12px/1.5 var(--font-system);
        }

        .timeline-list-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .timeline-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
            padding: 10px 12px;
            cursor: pointer;
        }

        .timeline-item.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .timeline-item-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .timeline-item-title {
            font: 700 13px/1.4 var(--font-system);
        }

        .timeline-item-date {
            color: var(--muted);
            font: 600 11px/1.4 var(--font-mono);
            white-space: nowrap;
        }

        .timeline-item-body {
            margin-top: 6px;
            color: var(--text);
            font: 400 12px/1.55 var(--font-system);
        }

</head>
<body>
<div class="shell">
    <nav class="tabs">
        <button type="button" data-tab="transcript" class="active">Transcript</button>
        <button type="button" data-tab="digest">Digest</button>
        <button type="button" data-tab="graph">Graph</button>
        <button type="button" data-tab="timeline">Timeline</button>
        <button type="button" data-tab="map">Map</button>
    </nav>
    <main class="content">
        <div id="engine-banner" class="engine-banner" role="status" hidden></div>
        <section id="transcript-panel" class="panel"></section>
        <section id="digest-panel" class="panel hidden"></section>
        <section id="graph-panel" class="panel hidden"></section>
        <section id="timeline-panel" class="panel hidden"></section>
        <section id="map-panel" class="panel hidden"></section>
    </main>
</div>

<script>
const documentData = {{ document_json|safe }};
const entities = {{ entities_json|safe }};
const claims = {{ claims_json|safe }};
const graphSummary = documentData.graph_summary || null;

// The flat "Page N\n…" transcript. When it is derivable from `pages` the engine
// does NOT send it — sending both put the entire document text on the wire
// twice (measured: 2x, and the transcript is ~96% of a claim-free payload).
//
// This join MUST stay byte-identical to `transcript_text()` in
// api/routes/system/views.py: claim `source_char_start`/`source_char_end` are
// offsets into this exact string, so a single extra space here silently
// mis-highlights every claim in the document.
const documentTranscript = (() => {
    if (documentData.transcript_source === "pages") {
        return (documentData.pages || [])
            .filter((page) => page.has_content)
            .map((page) => `Page ${page.number}\n${page.content}`)
            .join("\n\n");
    }
    return documentData.page_content || "";
})();

const state = {
    tab: "transcript",
    activeClaimId: null,
    activeEntityId: null,
    activePage: null,
    showAllClaims: false,
    // Page numbers a running workflow is currently writing (#4357).
    busyPages: new Set(),
};

const DEMO_PLACE_LOOKUP = {
    andagoya: { lat: 5.093, lon: -76.695, label: "Andagoya, Chocó, Colombia" },
    "la cumbre": { lat: 3.648, lon: -76.568, label: "La Cumbre, Valle del Cauca, Colombia" },
    "buenos aires": { lat: 2.914, lon: -76.672, label: "Buenos Aires, Cauca, Colombia" },
    bogota: { lat: 4.711, lon: -74.072, label: "Bogotá, Colombia" },
    "bogotá": { lat: 4.711, lon: -74.072, label: "Bogotá, Colombia" },
    choco: { lat: 5.7, lon: -76.7, label: "Chocó, Colombia" },
    "chocó": { lat: 5.7, lon: -76.7, label: "Chocó, Colombia" },
    quibdo: { lat: 5.6947, lon: -76.6611, label: "Quibdó, Chocó, Colombia" },
    "quibdó": { lat: 5.6947, lon: -76.6611, label: "Quibdó, Chocó, Colombia" },
    istmina: { lat: 5.1611, lon: -76.6839, label: "Istmina, Chocó, Colombia" },
    popayan: { lat: 2.4448, lon: -76.6147, label: "Popayán, Cauca, Colombia" },
    "popayán": { lat: 2.4448, lon: -76.6147, label: "Popayán, Cauca, Colombia" },
};

const COLOMBIA_BOUNDS = {
    north: 13.6,
    south: -4.3,
    west: -79.2,
    east: -66.7,
};

function sourceHeaders() {
    const headers = {};
    if (window.ficheroToken) {
        headers["Authorization"] = "Bearer " + window.ficheroToken;
    }
    if (window.ficheroLibrary) {
        headers["X-Fichero-Library-Path"] = window.ficheroLibrary;
    }
    return headers;
}

function notify(kind, payload) {
    const handler = window.webkit?.messageHandlers?.ficheroBridge;
    if (handler) {
        handler.postMessage({ kind, ...payload });
    }
}

// Report the reader's text selection to the app (Daniel, 2026-08-30: the
// annotation bar highlights the SELECTED words — charStart/charEnd are
// offsets into documentTranscript, the same space scrollToCharRange reads).
function reportTextSelection() {
    const panel = document.getElementById("transcript-panel");
    const transcriptEl = panel ? panel.querySelector(".transcript") : null;
    const selection = window.getSelection();
    if (!transcriptEl || !selection || selection.rangeCount === 0 || selection.isCollapsed) {
        notify("textSelected", {});
        return;
    }
    const range = selection.getRangeAt(0);
    if (!transcriptEl.contains(range.commonAncestorContainer)) {
        notify("textSelected", {});
        return;
    }
    // Walk the transcript's text nodes accumulating offsets — the reverse of
    // scrollToCharRange's walk, so both agree on the coordinate space.
    let charOffset = 0;
    let startOffset = null;
    let endOffset = null;
    const walker = document.createTreeWalker(transcriptEl, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
        const len = node.nodeValue.length;
        if (node === range.startContainer) startOffset = charOffset + range.startOffset;
        if (node === range.endContainer) endOffset = charOffset + range.endOffset;
        charOffset += len;
    }
    if (startOffset == null || endOffset == null || endOffset <= startOffset) {
        notify("textSelected", {});
        return;
    }
    notify("textSelected", {
        charStart: startOffset,
        charEnd: endOffset,
        text: String(selection.toString() || ""),
    });
}
document.addEventListener("mouseup", () => setTimeout(reportTextSelection, 0));
// Editing glue (#5154); the rules are the pure functions beside the line map.
// Set on the element, not in the markup, so a page's markup stays its text and nothing else.
function makeEditable(article) {
    const body = article.querySelector(".transcript-page-body");
    const lines = pageLineMaps.get(article.dataset.pageId);
    if (body && Array.isArray(lines) && lines.length) {
        body.setAttribute("contenteditable", engine.reachable ? "plaintext-only" : "false");
        body.spellcheck = false;
    }
}

let pendingEdit = null;   // {pageId, segmentId} of the line being typed in
const engine = engineLink();

// Every readingEdit leaves through here: posted, or held while the engine is out of reach.
function postEdit(message) {
    const outgoing = engine.edit(message);
    if (outgoing) {
        notify("readingEdit", outgoing);
        editsSent += 1;
    } else {
        applyEngineState();
    }
}

function applyEngineState() {
    const banner = document.getElementById("engine-banner");
    if (banner) {
        banner.hidden = engine.reachable;
        banner.textContent = engine.reachable ? "" : engineBannerText(engine.reason, engine.unsent().length);
    }
    document.querySelectorAll("article[data-page-id]").forEach((article) => makeEditable(article));
    if (!(window.CSS && CSS.highlights && window.Highlight)) return;
    const ranges = [];
    for (const m of engine.unsent()) {
        const line = (pageLineMaps.get(m.pageId) || []).find((item) => item.segment_id === m.segmentId);
        const body = document.querySelector(`article[data-page-id="${CSS.escape(m.pageId)}"] .transcript-page-body`);
        const range = line && body && rangeInBody(body, line.char_start, line.char_end);
        if (range) ranges.push(range);
    }
    if (ranges.length) CSS.highlights.set("fichero-unsent-lines", new Highlight(...ranges));
    else CSS.highlights.delete("fichero-unsent-lines");
}
let editsSent = 0;        // readingEdit messages posted, so `commitPending` can say whether it sent one

// Send the typed line as a new reading (or refuse and put the page text back). Returns true when
// nothing is left pending.
function commitPendingEdit() {
    pauseCommit.cancel();
    if (!pendingEdit) return true;
    const { pageId, segmentId } = pendingEdit;
    pendingEdit = null;
    const article = document.querySelector(`article[data-page-id="${CSS.escape(pageId)}"]`);
    const body = article && article.querySelector(".transcript-page-body");
    if (!body) return true;
    const before = pageTexts.get(pageId) ?? "";
    const lines = pageLineMaps.get(pageId);
    const edit = readingEditMessage(before, body.textContent, lines, pageId, segmentId);
    const stale = staleLines.get(staleKey(pageId, segmentId));
    const decision = commitDecision(edit, stale);
    if (decision === "nothing") return true;
    if (decision === "hold") {
        // HELD, never sent: a stale line waits for the person's choice. Re-posting against the old
        // basis would be refused again -- the loop the ruling rules out -- and posting against
        // theirs would be choosing Keep Mine for them. What they typed on is still theirs to keep.
        stale.mine = edit.message.text;
        pageTexts.set(pageId, body.textContent);
        pageLineMaps.set(pageId, shiftLines(lines, segmentId, edit.delta));
        showStale(pageId, segmentId);
        return true;
    }
    if (edit.refused) {
        body.outerHTML = pageBodyMarkup({ content: before, lines });
        makeEditable(article);
        return false;
    }
    pageTexts.set(pageId, body.textContent);
    pageLineMaps.set(pageId, shiftLines(lines, segmentId, edit.delta));
    postEdit(edit.message);
    return true;
}

// Stale lines by `pageId\u0000segmentId`: {mine, theirs, comparing}.
const staleLines = new Map();
const staleKey = (pageId, segmentId) => `${pageId}\u0000${segmentId}`;

function applyStaleHighlight() {
    if (!(window.CSS && CSS.highlights && window.Highlight)) return;
    const ranges = [];
    for (const key of staleLines.keys()) {
        const [pageId, segmentId] = key.split("\u0000");
        const line = (pageLineMaps.get(pageId) || []).find((item) => item.segment_id === segmentId);
        const body = document.querySelector(`article[data-page-id="${CSS.escape(pageId)}"] .transcript-page-body`);
        const range = line && body && rangeInBody(body, line.char_start, line.char_end);
        if (range) ranges.push(range);
    }
    if (ranges.length) CSS.highlights.set("fichero-stale-lines", new Highlight(...ranges));
    else CSS.highlights.delete("fichero-stale-lines");
}

function showStale(pageId, segmentId) {
    const article = document.querySelector(`article[data-page-id="${CSS.escape(pageId)}"]`);
    if (!article) return;
    const old = article.querySelector(`.stale-bar[data-segment-id="${CSS.escape(segmentId)}"]`);
    const stale = staleLines.get(staleKey(pageId, segmentId));
    if (!stale) { if (old) old.remove(); applyStaleHighlight(); return; }
    const markup = staleBarMarkup(segmentId, stale, stale.comparing);
    if (old) old.outerHTML = markup;
    else article.querySelector(".transcript-page-body").insertAdjacentHTML("afterend", markup);
    applyStaleHighlight();
}

document.addEventListener("click", (event) => {
    const button = event.target.closest && event.target.closest("[data-stale-action]");
    if (!button) return;
    const bar = button.closest(".stale-bar");
    const pageId = button.closest("article[data-page-id]").dataset.pageId;
    const segmentId = bar.dataset.segmentId;
    const key = staleKey(pageId, segmentId);
    const stale = staleLines.get(key);
    if (!stale) return;
    const action = button.dataset.staleAction;
    if (action === "compare") { stale.comparing = !stale.comparing; showStale(pageId, segmentId); return; }
    staleLines.delete(key);
    showStale(pageId, segmentId);
    if (action === "mine") postEdit(keepMineMessage(pageId, segmentId, stale));
    else refreshPage(pageId);   // Take Theirs: the library's line, the local words dropped
});

const pauseCommit = pauseCommitter(() => commitPendingEdit(), (f, ms) => setTimeout(f, ms), (h) => clearTimeout(h));
document.addEventListener("input", () => { if (pendingEdit) pauseCommit.touch(); });
// ⌘S commits the line being typed. Not prevented: the app's Save still runs, and calls
// `commitPending()` too, which finds nothing left to send.
document.addEventListener("keydown", (event) => {
    if (event.metaKey && !event.altKey && !event.ctrlKey && (event.key === "s" || event.key === "S")) commitPendingEdit();
});

document.addEventListener("beforeinput", () => {
    const at = lineAtCaret();
    if (!at) return;
    if (pendingEdit && (pendingEdit.pageId !== at.pageId || pendingEdit.segmentId !== at.segmentId)) {
        commitPendingEdit();
    }
    if (!pendingEdit) pendingEdit = at;
});
document.addEventListener("selectionchange", () => {
    if (!pendingEdit) return;
    const at = lineAtCaret();
    if (!at || at.pageId !== pendingEdit.pageId || at.segmentId !== pendingEdit.segmentId) commitPendingEdit();
});
document.addEventListener("focusout", () => commitPendingEdit());

let focusedLine = null;
document.addEventListener("selectionchange", () => {
    const at = lineAtCaret();
    const message = lineFocusMessage(focusedLine, at);
    if (at) focusedLine = at;
    if (message) notify("lineFocused", message);
});

// The DOM Range covering body offsets [start, end), across however many text nodes (a direction
// run is its own node).
function rangeInBody(body, start, end) {
    const range = document.createRange();
    let offset = 0, startSet = false;
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
        const length = node.nodeValue.length;
        if (!startSet && start <= offset + length) { range.setStart(node, start - offset); startSet = true; }
        if (startSet && end <= offset + length) { range.setEnd(node, end - offset); return range; }
        offset += length;
    }
    return startSet ? range : null;
}

function scrollParent(element) {
    for (let el = element; el; el = el.parentElement) {
        const style = getComputedStyle(el);
        if (/(auto|scroll)/.test(style.overflowY) && el.scrollHeight > el.clientHeight) return el;
    }
    return document.scrollingElement;
}

let shownLineIds = [];
function applyShownLines() {
    if (!(window.CSS && CSS.highlights && window.Highlight)) return;   // no API: nothing drawn
    const ranges = [];
    for (const span of selectedLineSpans(pageLineMaps, shownLineIds)) {
        const body = document.querySelector(`article[data-page-id="${CSS.escape(span.pageId)}"] .transcript-page-body`);
        const range = body && rangeInBody(body, span.start, span.end);
        if (range) ranges.push(range);
    }
    if (ranges.length) CSS.highlights.set("fichero-selected-lines", new Highlight(...ranges));
    else CSS.highlights.delete("fichero-selected-lines");
    return ranges;
}

document.addEventListener("keydown", (event) => {
    const plain = !event.altKey && !event.metaKey && !event.ctrlKey && !event.shiftKey;
    if (plain && (event.key === "Enter" || event.key === "Backspace")) {
        const caret = caretInBody();
        if (!caret || !caret.collapsed || !caret.body.isContentEditable) return;
        const lines = pageLineMaps.get(caret.pageId);
        const message = event.key === "Enter"
            ? lineSplitMessage(lines, caret.pageId, caret.offset)
            : lineJoinMessage(lines, caret.pageId, caret.offset);
        if (!message) return;   // an ordinary Backspace
        event.preventDefault();
        if (!commitPendingEdit()) return;
        // The typed text shifted the map; resolve against it once more.
        const fresh = pageLineMaps.get(caret.pageId);
        const again = caretInBody();
        const final = event.key === "Enter"
            ? lineSplitMessage(fresh, caret.pageId, again ? again.offset : caret.offset)
            : lineJoinMessage(fresh, caret.pageId, again ? again.offset : caret.offset);
        if (final) notify(event.key === "Enter" ? "lineSplit" : "lineJoin", final);
        return;
    }
    const message = LINE_MOVE_STEPS[event.key] ? lineMoveMessage(event, lineAtCaret()) : null;
    if (!message) return;
    event.preventDefault();
    commitPendingEdit();
    notify("lineMove", message);
});
document.addEventListener("keyup", (event) => {
    if (event.shiftKey || event.key === "Shift") setTimeout(reportTextSelection, 0);
});

function normalisePlaceKey(text) {
    return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function parseFlexibleDate(raw) {
    const text = String(raw || "").trim();
    if (!text || text.toLowerCase() === "unknown") return null;
    if (/^\d{4}-\d{2}-\d{2}(t.*)?$/i.test(text) || /^\d{4}-\d{2}$/i.test(text) || /^\d{4}$/i.test(text)) {
        const isoLike = text.length === 4 ? `${text}-01-01` : (text.length === 7 ? `${text}-01` : text);
        const date = new Date(isoLike);
        return Number.isNaN(date.getTime()) ? null : date;
    }
    const withoutWeekday = text.replace(/^[A-Za-z]+,\s*/, "");
    const parsed = new Date(withoutWeekday);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
}

function displayDateRange(start, end, fallbackLabel) {
    if (fallbackLabel) return fallbackLabel;
    if (!start) return "Undated";
    const startLabel = start.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    if (!end || start.getTime() === end.getTime()) return startLabel;
    const endLabel = end.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    return `${startLabel} to ${endLabel}`;
}

function bestDateValue(values, fallbackStart, fallbackEnd) {
    for (const value of values || []) {
        const start = parseFlexibleDate(value.start || value.label);
        const end = parseFlexibleDate(value.end || value.start || value.label);
        if (start) {
            return { start, end: end || start, label: value.label || null, basis: value.basis || "asserted" };
        }
    }
    const parsedStart = parseFlexibleDate(fallbackStart);
    if (!parsedStart) return null;
    return {
        start: parsedStart,
        end: parseFlexibleDate(fallbackEnd) || parsedStart,
        label: null,
        basis: "inferred",
    };
}

function inferGeoContext() {
    const haystack = [
        documentData.name,
        documentTranscript,
        ...entities.map((entity) => entity.canonical_name),
        ...claims.flatMap((claim) => [claim.claim_location, claim.subject_canonical, claim.object_phrase]),
    ].join(" ").toLowerCase();
    const colombiaSignals = ["colombia", "chocó", "choco", "andagoya", "bogotá", "bogota", "quibdó", "quibdo", "istmina", "popayán", "popayan"];
    const inferredCountry = colombiaSignals.some((signal) => haystack.includes(signal)) ? "Colombia" : "Unknown";
    return {
        country: inferredCountry,
        bounds: inferredCountry === "Colombia" ? COLOMBIA_BOUNDS : {
            north: 15,
            south: -15,
            west: -90,
            east: -60,
        },
    };
}

// SVO ordering is duplicated here because this runs in the browser and cannot
// import the canonical Python helper. The single source of truth is
// `order_statement_parts` in fichero/knowledge/_common.py — a VSO (Arabic) or
// SOV renderer must change BOTH, and a Python-only test cannot catch a miss
// here (#4172).
function claimSummary(claim) {
    if (claim.subject_canonical && claim.predicate_verb && claim.object_phrase) {
        return `${claim.subject_canonical} ${claim.predicate_verb} ${claim.object_phrase}`;
    }
    return claim.text;
}

function groupedClaims() {
    const groups = new Map();
    entities.forEach((entity) => groups.set(entity.id, { entity, claims: [] }));
    claims.forEach((claim) => {
        if ((claim.entity_ids || []).length === 0) {
            if (!groups.has("__ungrouped__")) {
                groups.set("__ungrouped__", {
                    entity: { id: "__ungrouped__", canonical_name: "Ungrouped claims" },
                    claims: [],
                });
            }
            groups.get("__ungrouped__").claims.push(claim);
            return;
        }
        claim.entity_ids.forEach((entityId) => {
            if (groups.has(entityId)) {
                groups.get(entityId).claims.push(claim);
            }
        });
    });
    return Array.from(groups.values()).filter((group) => group.claims.length > 0);
}

// The reader's page list. Prefers the structured `pages` payload — the
// document's page CHILDREN, empty pages included (#4356) — so reader page N is
// preview page N. Falls back to parsing the flat transcript for payloads
// produced before `pages` existed.
function transcriptPages() {
    const pages = Array.isArray(documentData.pages) ? documentData.pages : [];
    if (pages.length) {
        return pages.map((page, index) => {
            const content = page.content || "";
            return {
                id: page.id || null,
                label: page.label || null,
                isRegion: Boolean(page.is_region),
                table: page.table || null,
                markup_render: page.markup_render || null,
                number: page.number == null ? index + 1 : page.number,
                content: content,
                // The line map (3c part c): offsets into `content`, one entry per line. A
                // sidecar: the page body below is rendered from `content` alone, unchanged.
                lines: Array.isArray(page.lines) ? page.lines : [],
                hasContent: page.has_content == null
                    ? content.trim().length > 0
                    : Boolean(page.has_content),
            };
        });
    }
    const transcript = documentTranscript;
    if (!transcript) { return []; }
    const markers = [...transcript.matchAll(/^Page\s+(\d+)\s*\n/gm)];
    if (!markers.length) {
        return [{ number: 1, content: transcript, hasContent: transcript.trim().length > 0 }];
    }
    return markers.map((marker, index) => {
        const content = transcript.slice(
            marker.index + marker[0].length,
            markers[index + 1]?.index
        );
        return {
            number: Number(marker[1]),
            content: content,
            hasContent: content.trim().length > 0,
        };
    });
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

// <line-map> (3c part c). Which line the caret is on, resolved from the page's text offset
// against the server's line map, so no line is wrapped in an element and the claim
// highlighter's text-node walk sees the same DOM as before.
const pageLineMaps = new Map();

// The line holding `offset`. A caret on the boundary after a line's last character (the end
// of the line, or the newline after it) is still on that line; before the first line, the
// first. Null only for a page with no map.
function segmentAtOffset(lines, offset) {
    if (!Array.isArray(lines) || lines.length === 0) return null;
    let found = lines[0];
    for (const line of lines) {
        if (line.char_start > offset) break;
        found = line;
    }
    return found.segment_id;
}

// {pageId, body, offset, collapsed} for the caret (the selection's focus) in the page body's
// text, or null outside a page body.
function caretInBody() {
    const selection = window.getSelection();
    const focus = selection && selection.focusNode;
    if (!focus) return null;
    const element = focus.nodeType === Node.TEXT_NODE ? focus.parentElement : focus;
    const body = element && element.closest(".transcript-page-body");
    const article = body && body.closest("article[data-page-id]");
    if (!article) return null;
    let offset = 0;
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
        if (node === focus) { offset += selection.focusOffset; break; }
        if (focus.nodeType !== Node.TEXT_NODE && focus.contains(node)) break;
        offset += node.nodeValue.length;
    }
    return { pageId: article.dataset.pageId, body, offset, collapsed: selection.isCollapsed };
}

// {pageId, segmentId} for the caret, or null outside a page body or off every line.
function lineAtCaret() {
    const caret = caretInBody();
    if (!caret) return null;
    const segmentId = segmentAtOffset(pageLineMaps.get(caret.pageId), caret.offset);
    return segmentId ? { pageId: caret.pageId, segmentId } : null;
}
window.ficheroLineAtCaret = lineAtCaret;

// ⌥⌘↑ / ⌥⌘↓ / ⌥⌘⇞ / ⌥⌘⇟ on the caret's line (3c part d): the bridge message the app turns into
// the SAME reading-order move the Inspector's keys make. Null for any other key, or off a line.
const LINE_MOVE_STEPS = { ArrowUp: "up", ArrowDown: "down", PageUp: "toStart", PageDown: "toEnd" };
function lineMoveMessage(event, at) {
    const step = event.altKey && event.metaKey && !event.shiftKey && !event.ctrlKey
        ? LINE_MOVE_STEPS[event.key] : undefined;
    if (!step || !at) return null;
    return { segmentId: at.segmentId, pageId: at.pageId, step };
}
// </line-map>

// The page's directions (#5147 Reader half). Each line-map entry carries its block's resolved
// direction; consecutive lines sharing one make a RUN, and a run owns the separator after it, so
// the runs cover the page text exactly and every offset walk (caret, claim, search) is unchanged.
// The page takes the direction most of its characters have; a run in the other horizontal
// direction is a `<span dir>` isolate. Text only ever lives in text nodes: an all-`ltr` page (or
// one with no map) renders exactly as before -- one escaped text node.
function directionRuns(content, lines) {
    const runs = [];
    for (const line of Array.isArray(lines) ? lines : []) {
        const direction = line.direction || null;
        const last = runs[runs.length - 1];
        if (last && last.direction === direction) continue;
        runs.push({ direction, start: runs.length ? line.char_start : 0 });
    }
    runs.forEach((run, i) => { run.end = i + 1 < runs.length ? runs[i + 1].start : content.length; });
    return runs;
}

function pageDirection(runs) {
    const size = new Map();
    for (const run of runs) {
        if (run.direction) size.set(run.direction, (size.get(run.direction) || 0) + run.end - run.start);
    }
    let best = null;
    for (const [direction, n] of size) if (best === null || n > size.get(best)) best = direction;
    return best;
}

// content[start, end) escaped, with an EMPTY line's marker at its offset (an element with no text), and
// each separator between two lines wrapped as a `.line-break` (#5208: one line per manuscript line, the
// break drawn by CSS after it). The separator character stays in its text node, so the text nodes (and
// every offset walk) are exactly the page text's.
function textWithEmptyLines(content, start, end, empties, breaks = []) {
    const marks = [];
    for (const line of empties) {
        if (line.char_start < start || line.char_start > end || (line.char_start === end && end !== content.length)) continue;
        marks.push({ at: line.char_start, width: 0, html: `<span class="line-empty" data-segment-id="${escapeHtml(String(line.segment_id))}"></span>` });
    }
    for (const at of breaks) if (at >= start && at < end) marks.push({ at, width: 1 });
    marks.sort((a, b) => a.at - b.at || a.width - b.width);
    let out = "", at = start;
    for (const mark of marks) {
        out += escapeHtml(content.slice(at, mark.at));
        if (mark.width) {
            out += `<span class="line-break">${escapeHtml(content.slice(mark.at, mark.at + 1))}</span>`;
            at = mark.at + 1;
        } else {
            out += mark.html;
            at = mark.at;
        }
    }
    return out + escapeHtml(content.slice(at, end));
}

// Where an excerpt falls in a run of text nodes, as one piece per node it touches ({index, start, end},
// offsets within that node), or [] when it is not there. A claim that crosses a line boundary now spans
// the `.line-break` element (#5208), so the excerpt is found in the nodes' text JOINED, never one node's.
function excerptPieces(texts, excerpt) {
    if (!excerpt) return [];
    const at = texts.join("").indexOf(excerpt);
    return at < 0 ? [] : offsetPieces(texts.map((text) => text.length), at, at + excerpt.length);
}

// The range [start, end) of text laid out in nodes of these lengths, as one piece per node it touches.
function offsetPieces(lengths, start, end) {
    const pieces = [];
    let offset = 0;
    lengths.forEach((length, index) => {
        const from = Math.max(start, offset), to = Math.min(end, offset + length);
        if (from < to) pieces.push({ index, start: from - offset, end: to - offset });
        offset += length;
    });
    return pieces;
}

// The separators between consecutive lines of the map: the one character between a line's end and
// the next line's start (#5208).
function lineBreaks(content, lines) {
    const list = Array.isArray(lines) ? lines : [];
    return list.slice(0, -1)
        .map((line, i) => [line.char_end, list[i + 1].char_start])
        .filter(([end, next]) => next === end + 1 && end < content.length)
        .map(([end]) => end);
}

function pageBodyMarkup(page) {
    const content = String(page.content ?? "");
    const runs = directionRuns(content, page.lines);
    const base = pageDirection(runs);
    const attr = base === "rtl" ? ' dir="rtl"' : base === "ttb" ? ' data-direction="ttb"' : "";
    const flow = base === "rtl" ? "rtl" : "ltr";
    const empties = (Array.isArray(page.lines) ? page.lines : []).filter((line) => line.char_end === line.char_start);
    const breaks = lineBreaks(content, page.lines);
    const inner = runs.length
        ? runs.map((run) => {
            const text = textWithEmptyLines(content, run.start, run.end, empties, breaks);
            const own = run.direction === "rtl" || run.direction === "ltr" ? run.direction : flow;
            return own === flow ? text : `<span dir="${own}">${text}</span>`;
        }).join("")
        : textWithEmptyLines(content, 0, content.length, empties, breaks);
    return `<div class="transcript-page-body"${attr}>${inner}</div>`;
}

// After a line move or ⌘Z (#5170) the app asks for THIS page again and it is patched in place: the rest
// of the transcript is untouched, so scroll survives, and the caret goes back onto the line it
// was on, at the same place in it (it was a page reload, losing both).
// `pagePayloadFromView` reads the page's fresh text and map out of the served view itself (the
// same `documentData` this page was built from), so there is no second route to keep in step.
function pagePayloadFromView(html, pageId) {
    const match = /const documentData = (\{.*?\});\n/s.exec(html);
    if (!match) return null;
    const pages = JSON.parse(match[1]).pages || [];
    return pages.find((page) => page.id === pageId) || null;
}

// Where the caret goes: the same distance into the same line, in the page's NEW offsets. Null
// when the line is gone from the map (a move that removed it is not a move).
function caretAfterMove(oldLines, newLines, segmentId, oldOffset) {
    const before = (oldLines || []).find((line) => line.segment_id === segmentId);
    const after = (newLines || []).find((line) => line.segment_id === segmentId);
    if (!after) return null;
    const into = before ? Math.max(0, oldOffset - before.char_start) : 0;
    return Math.min(after.char_start + into, after.char_end);
}

function bodyOffset(body, focusNode, focusOffset) {
    let offset = 0;
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
        if (node === focusNode) return offset + focusOffset;
        offset += node.nodeValue.length;
    }
    return 0;
}

async function refreshPage(pageId) {
    const article = document.querySelector(`article[data-page-id="${CSS.escape(pageId)}"]`);
    const body = article && article.querySelector(".transcript-page-body");
    if (!body) return false;
    const response = await fetch(`/view/document/${encodeURIComponent(pageId)}`, { headers: sourceHeaders() });
    if (!response.ok) return false;
    const read = pagePayloadFromView(await response.text(), pageId);
    if (!read) return false;
    // A stale line keeps the person's words through any re-read until they choose (13b).
    const fresh = overlayLines(read, [...staleLines].filter(([key]) => key.startsWith(`${pageId}\u0000`))
        .map(([key, stale]) => ({ segmentId: key.slice(pageId.length + 1), text: stale.mine })));
    const at = lineAtCaret();
    const selection = window.getSelection();
    const oldOffset = at && at.pageId === pageId ? bodyOffset(body, selection.focusNode, selection.focusOffset) : null;
    const oldLines = pageLineMaps.get(pageId);
    // Scroll is kept BY NAME, not left to the browser (#5170): swapping the body takes the focused
    // element out of the page, and putting the caret back may scroll to it.
    const scroller = scrollParent(article);
    const scrolledTo = scroller ? scroller.scrollTop : null;
    // Words typed and not yet sent are NEVER re-read over (13b): a commit's re-read can land while
    // the next run is being typed. They stay on their line, on top of the library's page, and go
    // with that run's commit.
    const unsent = pendingEdit && pendingEdit.pageId === pageId
        ? keepUnsent(fresh, pageTexts.get(pageId) ?? "", body.textContent, oldLines, pendingEdit.segmentId)
        : null;
    body.outerHTML = pageBodyMarkup({ content: unsent ? unsent.shown : fresh.content, lines: fresh.lines });
    pageLineMaps.set(pageId, fresh.lines || []);
    pageTexts.set(pageId, String(fresh.content ?? ""));
    if (!unsent) pendingEdit = null;
    const entry = (documentData.pages || []).find((page) => page.id === pageId);
    if (entry) { entry.content = fresh.content; entry.lines = fresh.lines; }
    const offset = oldOffset === null ? null : caretAfterMove(oldLines, fresh.lines, at.segmentId, oldOffset);
    const newBody = article.querySelector(".transcript-page-body");
    makeEditable(article);
    applyShownLines();
    applyStaleHighlight();
    if (offset !== null && newBody) {
        let rest = offset;
        const walker = document.createTreeWalker(newBody, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            if (rest <= node.nodeValue.length) { selection.collapse(node, rest); break; }
            rest -= node.nodeValue.length;
        }
    }
    if (scroller && scroller.scrollTop !== scrolledTo) scroller.scrollTop = scrolledTo;
    return true;
}

// Typing in the Reader (#5154). A page with a line map is editable; what a person types is a
// new READING of the line the caret is on, sent when the caret leaves that line (or the page
// loses focus, or before a split or join) -- never per keystroke. Return splits the caret's line,
// Backspace at a line's start joins it to the line before. Swift makes the call and asks for the
// page again (`refreshPage`).
//
// The page text as the server sent it, per page: what an edit is measured against.
const pageTexts = new Map();

// The one line an edit changed, or why not. `before`/`now` are the page body's whole text before
// and after; `segmentId` is the line the caret was on when typing began. Everything outside that
// line must be byte-for-byte what it was: an edit that reached another line (a paste over two
// lines, a selection across the separator) is REFUSED, not guessed at.
function editedLine(before, now, lines, segmentId) {
    if (before === now) return null;
    const line = (lines || []).find((item) => item.segment_id === segmentId);
    if (!line) return { refused: "off every line" };
    const delta = now.length - before.length;
    const end = line.char_end + delta;
    if (end < line.char_start
        || now.slice(0, line.char_start) !== before.slice(0, line.char_start)
        || now.slice(end) !== before.slice(line.char_end)) {
        return { refused: "the edit reached another line" };
    }
    return {
        segmentId,
        text: now.slice(line.char_start, end),
        previous: before.slice(line.char_start, line.char_end),
        delta,
    };
}

// The `readingEdit` message for an edit, or {refused}. `basedOn` is the reading the person was
// correcting -- the line's counting reading from the map -- so the app records the new one as its
// correction (`corrects_representation_id`); null when the line's text came from its words.
function readingEditMessage(before, now, lines, pageId, segmentId) {
    const edit = editedLine(before, now, lines, segmentId);
    if (!edit || edit.refused) return edit;
    const line = lines.find((item) => item.segment_id === segmentId);
    return {
        message: { pageId, segmentId, text: edit.text, previous: edit.previous, basedOn: line.representation_id ?? null },
        delta: edit.delta,
    };
}

// The map after an edit of `delta` characters in one line: that line grows, later lines move.
function shiftLines(lines, segmentId, delta) {
    let after = false;
    return (lines || []).map((line) => {
        if (after) return { ...line, char_start: line.char_start + delta, char_end: line.char_end + delta };
        if (line.segment_id !== segmentId) return line;
        after = true;
        return { ...line, char_end: line.char_end + delta };
    });
}

// The map once the app says which reading a line's commit made (`lineCommitted.representationId`):
// the next run of typing on that line is based on it, before the page is even re-read.
function withReading(lines, segmentId, representationId) {
    return (lines || []).map((line) => line.segment_id === segmentId ? { ...line, representation_id: representationId } : line);
}

// A re-read page with the words still being typed kept on (13b): `fresh` is the page as the
// library has it, `before`/`now` the body's text as last sent and as it is. The typed line's local
// text replaces its line in the fresh text; everything else is the library's. Returns
// {shown, text, lines}: what to draw, what an edit is measured against, the fresh map -- or null
// when nothing is unsent (or the unsent edit is no longer one line's, which the commit refuses).
function keepUnsent(fresh, before, now, lines, segmentId) {
    const edit = editedLine(before, now, lines, segmentId);
    if (!edit || edit.refused) return null;
    const line = (fresh.lines || []).find((item) => item.segment_id === segmentId);
    if (!line) return null;
    const text = String(fresh.content ?? "");
    return {
        shown: text.slice(0, line.char_start) + edit.text + text.slice(line.char_end),
        text,
        lines: fresh.lines || [],
    };
}

// A run of keys is ONE action (13b, `a-run-of-keys-is-one-action`): the run ends at two seconds
// without a key (or on leaving the line, a structural key, blur or Save, handled where they
// happen). `touch()` on every key restarts the wait; `cancel()` drops it. Timers are passed in so
// the rule runs the same under a test's clock.
// (A literal default, not a `const`: the page builds its committer before this line runs.)
function pauseCommitter(commit, setTimer, clearTimer, ms = 2000) {
    let handle = null;
    return {
        touch() {
            if (handle !== null) clearTimer(handle);
            handle = setTimer(() => { handle = null; commit(); }, ms);
        },
        cancel() {
            if (handle !== null) clearTimer(handle);
            handle = null;
        },
    };
}

// Stale (13b, `stale-keeps-your-words`, ruled 2026-09-28): the app answers a refused edit with
// `lineCommitted({ok:false, stale:true, mine, theirs:{representationId, text}})`. The page keeps
// `mine` on the line and offers three choices; these are their rules.
//
// What a commit does with a line's edit: "send" it, "hold" it (a stale line waits for the person --
// sending again would be refused again, the loop the ruling rules out), "refuse" it (not one line's),
// or "nothing" (no change).
function commitDecision(edit, stale) {
    if (!edit) return "nothing";
    if (edit.refused) return "refuse";
    return stale ? "hold" : "send";
}

// Keep Mine: the SAME words, now a correction of the reading that counts -- so the engine takes it.
function keepMineMessage(pageId, segmentId, stale) {
    return { pageId, segmentId, text: stale.mine, previous: stale.theirs.text,
             basedOn: stale.theirs.representationId };
}

// Compare: a word-by-word diff of theirs against mine -- [{op: "same"|"del"|"ins", text}], where
// "del" is theirs only and "ins" is mine only. Whitespace-separated words, longest common run.
function wordDiff(theirs, mine) {
    const a = String(theirs ?? "").split(/\s+/).filter(Boolean);
    const b = String(mine ?? "").split(/\s+/).filter(Boolean);
    const n = a.length, m = b.length;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
        L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    }
    const out = [];
    const push = (op, text) => {
        const last = out[out.length - 1];
        if (last && last.op === op) last.text += " " + text; else out.push({ op, text });
    };
    let i = 0, j = 0;
    while (i < n && j < m) {
        if (a[i] === b[j]) { push("same", a[i]); i++; j++; }
        else if (L[i + 1][j] >= L[i][j + 1]) push("del", a[i++]);
        else push("ins", b[j++]);
    }
    while (i < n) push("del", a[i++]);
    while (j < m) push("ins", b[j++]);
    return out;
}

// A re-read page with each stale line's words laid back over the library's: [{segmentId, text}].
// The map moves with them, so an edit elsewhere on the page is still measured against what is shown.
function overlayLines(fresh, overlays) {
    let content = String(fresh.content ?? ""), lines = fresh.lines || [];
    for (const { segmentId, text } of overlays || []) {
        const line = lines.find((item) => item.segment_id === segmentId);
        if (!line) continue;
        content = content.slice(0, line.char_start) + text + content.slice(line.char_end);
        lines = shiftLines(lines, segmentId, text.length - (line.char_end - line.char_start));
    }
    return { ...fresh, content, lines };
}

// Out of reach of the engine (13b; ruled 2026-09-20: "out of reach of the engine the text is
// read-only and says why; an edit still gathering when the connection drops is kept and
// committed, with its version check, when it returns"). The page's rules as one small state:
//   edit(message)      -> the message to post now, or null: HELD while out of reach
//   lost(reason, ans?) -> out of reach; an `unreachable` answer moves that line's last-sent edit
//                         back to held, so words the library never took are not lost
//   back()             -> in reach again; the held edits, to post now (each still carries its
//                         `basedOn`, so a line changed meanwhile is refused as stale, never overwritten)
function engineLink() {
    const held = new Map();
    const lastSent = new Map();
    const key = (m) => `${m.pageId}\u0000${m.segmentId}`;
    let reachable = true, reason = null;
    return {
        get reachable() { return reachable; },
        get reason() { return reason; },
        unsent() { return [...held.values()]; },
        edit(message) {
            if (!reachable) { held.set(key(message), message); return null; }
            lastSent.set(key(message), message);
            return message;
        },
        lost(why, answer) {
            reachable = false;
            reason = why || null;
            const sent = answer && lastSent.get(key(answer));
            if (sent) held.set(key(answer), sent);
        },
        back() {
            reachable = true;
            reason = null;
            const out = [...held.values()];
            held.clear();
            for (const m of out) lastSent.set(key(m), m);
            return out;
        },
    };
}

// The one line at the top while out of reach: why, and what happens to the words.
function engineBannerText(reason, unsentCount) {
    const why = reason ? ` (${reason})` : "";
    const kept = unsentCount
        ? ` ${unsentCount} unsent ${unsentCount === 1 ? "edit is" : "edits are"} kept and will be sent when it is back.`
        : "";
    return `The library can't be reached${why}, so the text is read-only.${kept}`;
}

function staleBarMarkup(segmentId, stale, comparing) {
    const diff = comparing
        ? `<div class="stale-compare">${wordDiff(stale.theirs.text, stale.mine).map((part) =>
            part.op === "same" ? escapeHtml(part.text)
            : part.op === "del" ? `<del>${escapeHtml(part.text)}</del>` : `<ins>${escapeHtml(part.text)}</ins>`).join(" ")}</div>`
        : "";
    return `<div class="stale-bar" data-segment-id="${escapeHtml(String(segmentId))}">`
        + `This line was changed elsewhere while you typed; your words are kept.`
        + `<button type="button" data-stale-action="mine">Keep Mine</button>`
        + `<button type="button" data-stale-action="theirs">Take Theirs</button>`
        + `<button type="button" data-stale-action="compare">${comparing ? "Hide Comparison" : "Compare"}</button>`
        + diff + `</div>`;
}

// Return at `offset` (in the page body): split that line at the caret's place in its own text.
function lineSplitMessage(lines, pageId, offset) {
    const segmentId = segmentAtOffset(lines, offset);
    const line = segmentId && lines.find((item) => item.segment_id === segmentId);
    if (!line) return null;
    const at = Math.max(0, Math.min(offset - line.char_start, line.char_end - line.char_start));
    return { pageId, segmentId, offset: at };
}

// Backspace at `offset`: only at the very start of a line that has one before it does it join;
// anywhere else it is an ordinary Backspace (null).
function lineJoinMessage(lines, pageId, offset) {
    const index = (lines || []).findIndex((line) => line.char_start === offset);
    if (index <= 0) return null;
    return { pageId, segmentId: lines[index].segment_id, intoSegmentId: lines[index - 1].segment_id };
}

// One selection across the Source view, the Reader and the Inspector (#5155).
// `lineFocused` {pageId, segmentId} when the caret comes onto a different line -- once per change,
// never per key. Null when nothing changed or the caret is off every line.
function lineFocusMessage(previous, at) {
    if (!at) return null;
    if (previous && previous.pageId === at.pageId && previous.segmentId === at.segmentId) return null;
    return { pageId: at.pageId, segmentId: at.segmentId };
}

// The page-body offsets of the lines the app says are selected: [{pageId, start, end}], in page
// order. Lines the Reader does not show are skipped, not an error (another page's selection).
function selectedLineSpans(maps, segmentIds) {
    const wanted = new Set(Array.isArray(segmentIds) ? segmentIds : []);
    const spans = [];
    for (const [pageId, lines] of maps) {
        for (const line of lines || []) {
            if (wanted.has(line.segment_id)) spans.push({ pageId, start: line.char_start, end: line.char_end });
        }
    }
    return spans;
}

function transcriptPageMarkup(page) {
    if (page.id) { pageLineMaps.set(page.id, page.lines || []); pageTexts.set(page.id, String(page.content ?? "")); }
    const placeholder = page.hasContent
        ? ""
        : `<div class="page-placeholder">No transcription yet</div>`;
    // The macOS proxy-icon idiom, per page (Daniel, 2026-08-29): every page
    // header carries a small document icon that identifies the page node —
    // click it to reveal that page in the app. Only pages that NAME a node
    // (payloads carry ids) get one; the transcript-parse fallback does not.
    const proxy = page.id
        ? `<button class="page-proxy" data-page-id="${escapeHtml(page.id)}"
                title="Reveal this page in the library"
                aria-label="Reveal this page in the library">
                <img src="/api/storage/thumbnail/${escapeHtml(page.id)}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><svg viewBox="0 0 12 14" aria-hidden="true" hidden><path d="M2 0h5.5L11 3.5V13a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1zm5 1v3h3z"/></svg>
           </button>`
        : "";
    // Region sections (diary entries, segments) are NAMED, not numbered like
    // sheets — show the node's own label beside the running number so the
    // header says what the section IS. Ordinary pages stay numbers only:
    // their labels are storage names, which would clutter every header.
    const label = page.isRegion && page.label
        ? `<span class="page-label">${escapeHtml(page.label)}</span>`
        : "";
    return `
        <article class="transcript-page${page.hasContent ? "" : " empty-page"}" data-page="${page.number}"${page.id ? ` data-page-id="${escapeHtml(page.id)}"` : ""}>
            <div class="page-marker">${proxy}Page ${page.number}${label}</div>
            ${page.markup_render ? markupRenderMarkup(page.markup_render)
                : page.table ? tableMarkup(page.table)
                : pageBodyMarkup(page)}
            ${placeholder}
        </article>
    `;
}

// A table-family representation (Accounts → Spreadsheet, Table extract)
// renders as a REAL table, not raw text (Daniel, 2026-08-29 bedtime). The
// server parsed the artifact (csv module / json_rows) into headers + rows;
// this only lays it out. Wrapped in its own horizontal scroller so a wide
// ledger never widens the page — the reader body must not scroll sideways.
// SVG/HTML artifacts render as THEMSELVES (Daniel, 2026-08-30) — safety by
// construction: SVG through an <img data:> (no script context), HTML through
// a fully sandboxed iframe (empty sandbox = inert). Never inlined into this
// page's DOM.
function markupRenderMarkup(render) {
    if (render.type === "svg" && render.data_uri && render.data_uri.startsWith("data:image/svg+xml;base64,")) {
        return `<img class="artifact-svg" src="${render.data_uri}" alt="SVG artifact">`;
    }
    if (render.type === "html" && typeof render.srcdoc === "string") {
        return `<iframe class="artifact-html" sandbox="" srcdoc="${escapeHtml(render.srcdoc)}"></iframe>`;
    }
    return "";
}

function tableMarkup(table) {
    const rows = Array.isArray(table.rows) ? table.rows : [];
    if (!rows.length && !(table.headers || []).length) {
        return `<div class="page-placeholder">The table came back empty</div>`;
    }
    const head = Array.isArray(table.headers) && table.headers.length
        ? `<thead><tr>${table.headers.map((cell) => `<th>${escapeHtml(cell)}</th>`).join("")}</tr></thead>`
        : "";
    const body = rows
        .map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`)
        .join("");
    return `<div class="table-scroll"><table class="artifact-table">${head}<tbody>${body}</tbody></table></div>`;
}

// The annotation review surface (Daniel, 2026-08-30 ruling 5): the server
// grouped the scope's markup by page, each entry cited ("p. 14") and carrying
// its anchored text where derivable. This only lays it out — every string is
// user/model data and goes through escapeHtml.
function annotationEntryMarkup(entry) {
    // Highlight tints use the annotation's OWN color at low alpha; only a
    // well-formed 6-digit hex gets inlined (server-validated, still checked).
    const hex = /^#[0-9a-fA-F]{6}$/.test(entry.color || "") ? entry.color : null;
    const tint = hex && entry.kind === "highlight" ? ` style="background:${hex}40"` : "";
    const kind = `<span class="annotation-kind"${hex ? ` style="color:${hex}"` : ""}>${escapeHtml(entry.kind_label || entry.kind || "")}</span>`;
    const checks = entry.checks
        ? `<span class="annotation-checks">${escapeHtml(entry.checks)}</span>`
        : "";
    const anchored = entry.anchored_text
        ? `<div class="annotation-anchor anchor-${escapeHtml(entry.kind || "")}"${tint}>${escapeHtml(entry.anchored_text)}</div>`
        : "";
    const note = entry.text
        ? `<div class="annotation-note">${escapeHtml(entry.text)}</div>`
        : "";
    const tags = (entry.tags || []).length
        ? `<div class="annotation-tags">${entry.tags.map((tag) => `#${escapeHtml(tag)}`).join(" ")}</div>`
        : "";
    return `
        <article class="annotation-entry">
            <div>${kind}${checks}</div>
            ${anchored}
            ${note}
            ${tags}
        </article>
    `;
}

function annotationReviewMarkup(groups) {
    if (!groups.length) {
        return `<div class="empty">No annotations in this scope yet.</div>`;
    }
