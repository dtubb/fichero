    return groups.map((group) => `
        <section class="annotation-group">
            <div class="annotation-cite"${group.page_id ? ` data-page-id="${escapeHtml(group.page_id)}" title="Reveal this page in the library"` : ""}>${escapeHtml(group.citation || "")}${group.page_label ? ` · ${escapeHtml(group.page_label)}` : ""}</div>
            ${group.entries.map(annotationEntryMarkup).join("")}
        </section>
    `).join("");
}

// The compare view (Daniel, 2026-08-30 ruling 6): one column per artifact,
// headed by its real provenance; word tokens the server diffed against the
// column to the left render as <mark>s. Deleted words show struck-through in
// place so what the previous output HAD stays visible.
function compareTokensMarkup(tokens) {
    return tokens.map(([word, op]) => {
        const text = escapeHtml(word);
        if (op === "ins") { return `<mark class="diff-ins">${text}</mark>`; }
        if (op === "del") { return `<mark class="diff-del">${text}</mark>`; }
        return text;
    }).join(" ");
}

function compareMarkup(compare) {
    if (!compare || !(compare.columns || []).length) {
        return `<div class="empty">No artifacts of that type to compare yet.</div>`;
    }
    const columns = compare.columns.map((column) => `
        <section class="compare-column">
            <div class="compare-label">${escapeHtml(column.label || "")}</div>
            <div class="compare-meta">${escapeHtml((column.created_at || "").slice(0, 16).replace("T", " "))}${column.compare_group ? ` · ${escapeHtml(column.compare_group)}` : ""}</div>
            <div class="compare-body">${compareTokensMarkup(column.tokens || [])}</div>
        </section>
    `).join("");
    return `<div class="compare-scroll"><div class="compare-grid">${columns}</div></div>`;
}

function renderTranscript() {
    const panel = document.getElementById("transcript-panel");
    // The markup-review and compare readings replace the page walk entirely
    // (Daniel, 2026-08-30 rulings 5 + 6) — same panel, same renderer.
    if (documentData.representation === "annotations") {
        panel.innerHTML = annotationReviewMarkup(documentData.annotations || []);
        panel.querySelectorAll(".annotation-cite[data-page-id]").forEach((el) => {
            el.addEventListener("click", (event) => {
                event.stopPropagation();
                notify("pageRevealRequested", { pageId: el.dataset.pageId });
            });
        });
        return;
    }
    if (documentData.representation === "compare") {
        panel.innerHTML = compareMarkup(documentData.compare || null);
        return;
    }
    const pages = transcriptPages();
    if (!pages.length) {
        panel.innerHTML = `<div class="empty">No transcript is available for this selection yet.</div>`;
        return;
    }
    panel.innerHTML = `
        <div class="transcript">${pages.map(transcriptPageMarkup).join("")}</div>
    `;
    // Proxy-icon clicks reveal the page node natively; stopPropagation so the
    // click never doubles as a page activation (#4373's bus stays scroll/click
    // semantics only).
    panel.querySelectorAll(".page-proxy").forEach((el) => {
        el.addEventListener("click", (event) => {
            event.stopPropagation();
            const pageId = el.dataset.pageId;
            if (pageId) { notify("pageRevealRequested", { pageId }); }
        });
    });
    panel.querySelectorAll("article[data-page-id]").forEach(makeEditable);
    applyActivePageHighlight();
    applyBusyPages();
}

// The "current page" highlight layer (#4356): toggles a class on the page the
// preview pane is showing. In-place — never a re-render, so scrollTop survives.
function applyActivePageHighlight() {
    const panel = document.getElementById("transcript-panel");
    const active = state.activePage == null ? null : Number(state.activePage);
    panel.querySelectorAll(".transcript-page").forEach((el) => {
        const isCurrent = active !== null && Number(el.dataset.page) === active;
        el.classList.toggle("current", isCurrent);
    });
}

// Per-page work in progress (#4357): only the pages in the run's scope carry a
// spinner. Applied in place so a live run never reloads the reader.
function applyBusyPages() {
    const panel = document.getElementById("transcript-panel");
    const busy = state.busyPages instanceof Set ? state.busyPages : new Set();
    panel.querySelectorAll(".transcript-page").forEach((el) => {
        const isBusy = busy.has(Number(el.dataset.page));
        el.classList.toggle("working", isBusy);
        const existing = el.querySelector(".page-working");
        if (isBusy && !existing) {
            const working = document.createElement("div");
            working.className = "page-working";
            const spinner = document.createElement("span");
            spinner.className = "page-working-spinner";
            spinner.setAttribute("aria-hidden", "true");
            working.appendChild(spinner);
            working.appendChild(document.createTextNode("Transcribing this page…"));
            el.appendChild(working);
        } else if (!isBusy && existing) {
            existing.remove();
        }
    });
}

// Replace ONE page's text in place as a run writes it (#4357). Never re-renders
// the transcript: a full reload would lose scroll position and flash.
// Returns true when the page was found and patched.
function patchPageContent(pageNumber, content) {
    const panel = document.getElementById("transcript-panel");
    const page = Number(pageNumber);
    const article = panel.querySelector(`.transcript-page[data-page="${page}"]`);
    if (!article) { return false; }
    const body = article.querySelector(".transcript-page-body");
    if (!body) { return false; }
    const text = content == null ? "" : String(content);
    if (body.textContent === text) { return true; }
    body.textContent = text;
    const hasContent = text.trim().length > 0;
    article.classList.toggle("empty-page", !hasContent);
    const placeholder = article.querySelector(".page-placeholder");
    if (hasContent && placeholder) {
        placeholder.remove();
    } else if (!hasContent && !placeholder) {
        const empty = document.createElement("div");
        empty.className = "page-placeholder";
        empty.textContent = "No transcription yet";
        article.appendChild(empty);
    }
    // Keep the payload in step so a later re-render (tab switch) shows the
    // patched text rather than reverting to the load-time content.
    if (Array.isArray(documentData.pages)) {
        const entry = documentData.pages.find((item) => Number(item.number) === page);
        if (entry) {
            entry.content = text;
            entry.has_content = hasContent;
        }
    }
    return true;
}

// Update the transcript highlight in-place without replacing the whole DOM
// (preserves scrollTop). Only falls back to a full re-render when the panel
// hasn't been rendered yet.
function updateTranscriptHighlight() {
    const panel = document.getElementById("transcript-panel");
    const transcriptEl = panel.querySelector(".transcript");
    if (!transcriptEl) {
        renderTranscript();
        return;
    }
    // Remove the existing mark, then re-apply for the active claim.
    // Replace each <mark> with its text content first.
    transcriptEl.querySelectorAll("mark[data-highlight]").forEach((mark) => {
        mark.replaceWith(document.createTextNode(mark.textContent));
        transcriptEl.normalize();
    });
    const activeClaim = claims.find((claim) => claim.id === state.activeClaimId);
    const excerpt = activeClaim?.source_excerpt;
    if (!excerpt) return;
    // Walk the text nodes and wrap the excerpt's first occurrence without serialising the whole DOM. It
    // may cross nodes -- a line break (#5208) or a direction isolate -- so each node it touches gets a
    // <mark> of its own piece.
    const nodes = textNodes(transcriptEl);
    wrapPieces(nodes, excerptPieces(nodes.map((node) => node.nodeValue), excerpt), "claim");
}

// Every text node under `root`, in order -- collected before any is split, so wrapping never walks a
// tree that is changing under it.
function textNodes(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    for (let node = walker.nextNode(); node; node = walker.nextNode()) nodes.push(node);
    return nodes;
}

// Wrap each piece ({index, start, end} into `nodes`) in a <mark data-highlight=kind>; the first mark,
// for scrolling to. A range that crosses a line break or an isolate gets one mark per node (#5208).
function wrapPieces(nodes, pieces, kind) {
    let first = null;
    for (const piece of pieces) {
        const node = nodes[piece.index];
        const before = node.nodeValue.slice(0, piece.start);
        const after = node.nodeValue.slice(piece.end);
        const mark = document.createElement("mark");
        mark.setAttribute("data-highlight", kind);
        mark.textContent = node.nodeValue.slice(piece.start, piece.end);
        const parent = node.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(mark, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);
        first = first || mark;
    }
    return first;
}

function claimMeta(claim) {
    const bits = [];
    if (claim.source_page_label) bits.push(claim.source_page_label);
    if (claim.entity_names?.length) bits.push(claim.entity_names.join(", "));
    return bits.join(" · ");
}

function renderDigestNow() {
    const panel = document.getElementById("digest-panel");
    const groups = groupedClaims();
    if (groups.length === 0) {
        panel.innerHTML = `<div class="empty">No extracted claims yet for this document.</div>`;
        return;
    }
    panel.innerHTML = groups.map((group) => `
        <section class="digest-group">
            <h3>${group.entity.id && group.entity.id !== "__ungrouped__"
                ? `<button type="button" class="entity-lozenge" data-entity-id="${escapeHtml(group.entity.id)}">${escapeHtml(group.entity.canonical_name)}</button>`
                : escapeHtml(group.entity.canonical_name)}</h3>
            ${group.claims.map((claim) => `
                <div class="claim-row ${state.activeClaimId === claim.id ? "active" : ""}" data-claim-id="${claim.id}">
                    <div>${escapeHtml(claimSummary(claim))}</div>
                    <div class="claim-meta">${escapeHtml(claimMeta(claim))}</div>
                    ${claim.source_excerpt ? `<div class="claim-source-hint">Source</div>
                    <div class="claim-source">${escapeHtml(claim.source_excerpt)}</div>` : ""}
                </div>
            `).join("")}
        </section>
    `).join("");

    panel.querySelectorAll(".claim-row").forEach((row) => {
        row.addEventListener("click", () => {
            const claim = claims.find((item) => item.id === row.dataset.claimId);
            if (!claim) return;
            // Expand/collapse the claim's source passage inline, right under the
            // statement — an in-place disclosure, not a jump-away (#1467).
            row.classList.toggle("source-open");
            state.activeClaimId = claim.id;
            state.activeEntityId = claim.entity_ids?.[0] || null;
            // Update active class in-place so scroll position is preserved.
            panel.querySelectorAll(".claim-row").forEach((r) => {
                r.classList.toggle("active", r.dataset.claimId === claim.id);
            });
            updateTranscriptHighlight();
            updateGraphActiveNode();
            notify("claimSelected", {
                claimId: claim.id,
                sourceDocumentId: claim.source_document_id,
                passage: claim.source_excerpt,
                pageNumber: claim.page_number,
            });
        });
    });

    // Clicking an entity-name lozenge opens that entity (#1466). The native
    // bridge handles `entitySelected` → KGFocusState → retargets the Document
    // Inspector to the entity (#1484). stopPropagation so it doesn't also fire
    // the surrounding section's handlers.
    panel.querySelectorAll(".entity-lozenge").forEach((el) => {
        el.addEventListener("click", (event) => {
            event.stopPropagation();
            const entityId = el.dataset.entityId;
            if (!entityId) return;
            const entityClaims = claims.filter((item) => (item.entity_ids || []).includes(entityId));
            state.activeEntityId = entityId;
            updateGraphActiveNode();
            notify("entitySelected", {
                entityId: entityId,
                sourceDocumentId: entityClaims[0]?.source_document_id || null,
            });
        });
    });
}

function graphPageMatches(claim) {
    if (state.activePage == null || state.showAllClaims) return true;
    return Number(claim.page_number) === Number(state.activePage);
}

function graphClaims() {
    return claims.filter(graphPageMatches);
}

function graphData() {
    const scopedClaims = graphClaims();
    const scopedEntityIds = new Set();
    scopedClaims.forEach((claim) => {
        (claim.entity_ids || []).forEach((id) => scopedEntityIds.add(id));
    });
    const visibleEntities = entities.filter((entity) => scopedEntityIds.has(entity.id));
    const nodes = visibleEntities.map((entity) => {
        const entityClaims = scopedClaims.filter((claim) => (claim.entity_ids || []).includes(entity.id));
        return {
            ...entity,
            claimCount: entityClaims.length,
            radius: 16 + Math.min(14, Math.sqrt(Math.max(entityClaims.length, 1)) * 5),
            x: 220,
            y: 170,
            vx: 0,
            vy: 0,
            pages: new Set(entityClaims.map((claim) => claim.page_number).filter((page) => page != null)),
        };
    });
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    const edgeMap = new Map();
    scopedClaims.forEach((claim) => {
        const ids = [...new Set(claim.entity_ids || [])].filter((id) => nodeLookup.has(id));
        for (let idx = 0; idx < ids.length; idx += 1) {
            for (let other = idx + 1; other < ids.length; other += 1) {
                const pair = [ids[idx], ids[other]].sort();
                const key = pair.join("::");
                const edge = edgeMap.get(key) || { from: pair[0], to: pair[1], weight: 0 };
                edge.weight += 1;
                edgeMap.set(key, edge);
            }
        }
    });
    return { nodes, edges: [...edgeMap.values()] };
}

function forceLayout(nodes, edges, width = 440, height = 340) {
    if (nodes.length === 1) {
        nodes[0].x = width / 2;
        nodes[0].y = height / 2;
        return nodes;
    }
    nodes.forEach((node, index) => {
        const angle = (Math.PI * 2 * index) / Math.max(nodes.length, 1);
        const radius = 80 + (index % 3) * 22;
        node.x = width / 2 + Math.cos(angle) * radius;
        node.y = height / 2 + Math.sin(angle) * radius;
    });
    const lookup = new Map(nodes.map((node) => [node.id, node]));
    for (let tick = 0; tick < 180; tick += 1) {
        for (let i = 0; i < nodes.length; i += 1) {
            for (let j = i + 1; j < nodes.length; j += 1) {
                const a = nodes[i];
                const b = nodes[j];
                const dx = b.x - a.x || 0.01;
                const dy = b.y - a.y || 0.01;
                const dist2 = Math.max(dx * dx + dy * dy, 64);
                const force = 5200 / dist2;
                const fx = (dx / Math.sqrt(dist2)) * force;
                const fy = (dy / Math.sqrt(dist2)) * force;
                a.vx -= fx;
                a.vy -= fy;
                b.vx += fx;
                b.vy += fy;
            }
        }
        edges.forEach((edge) => {
            const source = lookup.get(edge.from);
            const target = lookup.get(edge.to);
            if (!source || !target) return;
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
            const desired = Math.max(62, 130 - Math.min(edge.weight, 8) * 8);
            const pull = (dist - desired) * (0.018 + Math.min(edge.weight, 8) * 0.004);
            const fx = (dx / dist) * pull;
            const fy = (dy / dist) * pull;
            source.vx += fx;
            source.vy += fy;
            target.vx -= fx;
            target.vy -= fy;
        });
        nodes.forEach((node) => {
            node.vx += (width / 2 - node.x) * 0.004;
            node.vy += (height / 2 - node.y) * 0.004;
            node.vx *= 0.72;
            node.vy *= 0.72;
            node.x = Math.max(node.radius + 8, Math.min(width - node.radius - 8, node.x + node.vx));
            node.y = Math.max(node.radius + 8, Math.min(height - node.radius - 8, node.y + node.vy));
        });
    }
    return nodes;
}

function renderGraphNow() {
    const panel = document.getElementById("graph-panel");
    const { nodes, edges } = graphData();
    const panelRect = panel.getBoundingClientRect();
    const width = Math.max(440, Math.floor(panelRect.width - 24));
    const height = Math.max(340, Math.floor(panelRect.height - 56));
    const pageScoped = state.activePage != null && !state.showAllClaims;
    const scopeLabel = state.activePage == null
        ? "Showing all claims in this document."
        : (pageScoped
            ? `Showing page ${state.activePage} claims.`
            : `Showing all claims in this document.`);
    const summary = graphSummary && (
        graphSummary.shown_entities < graphSummary.total_entities ||
        graphSummary.shown_claims < graphSummary.total_claims
    ) ? ` Showing ${graphSummary.shown_entities} of ${graphSummary.total_entities} entities and ${graphSummary.shown_claims} of ${graphSummary.total_claims} claims; select a node to load its neighborhood.` : "";
    const toggle = state.activePage == null ? "" : `
        <button type="button" class="graph-scope-toggle" data-graph-scope-toggle="true">
            ${state.showAllClaims ? "Show current page only" : "Show all claims"}
        </button>
    `;
    if (nodes.length === 0) {
        panel.innerHTML = `
            <div class="graph-toolbar">
                <span>${escapeHtml(scopeLabel + summary)}</span>
                ${toggle}
            </div>
            <div class="empty">No entities yet for this ${pageScoped ? "page" : "document"}.</div>
        `;
        bindGraphScopeToggle(panel);
        return;
    }
    forceLayout(nodes, edges, width, height);
    const nodeLookup = new Map(nodes.map((node) => [node.id, node]));
    panel.innerHTML = `
        <div class="graph-toolbar">
            <span>${escapeHtml(scopeLabel + summary)} ${nodes.length} node${nodes.length === 1 ? "" : "s"}.</span>
            ${toggle}
        </div>
        <div class="graph-wrap">
            <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph: entities for this document. Page scope filters claims unless all claims are shown.">
                ${edges.map((edge) => {
                    const source = nodeLookup.get(edge.from);
                    const target = nodeLookup.get(edge.to);
                    if (!source || !target) return "";
                    const width = 1 + Math.min(6, edge.weight);
                    return `<line class="edge" x1="${source.x.toFixed(1)}" y1="${source.y.toFixed(1)}" x2="${target.x.toFixed(1)}" y2="${target.y.toFixed(1)}" stroke-width="${width}"></line>`;
                }).join("")}
                ${nodes.map((node) => {
                    const active = state.activeEntityId === node.id;
                    return `
                        <g class="node ${active ? "active" : ""}" data-entity-id="${node.id}" transform="translate(${node.x.toFixed(1)}, ${node.y.toFixed(1)})">
                            <circle r="${node.radius.toFixed(1)}"></circle>
                            <text text-anchor="middle" y="4">${escapeHtml(node.canonical_name.slice(0, 14))}</text>
                            <text text-anchor="middle" y="20" font-size="10">${node.claimCount} claim${node.claimCount === 1 ? "" : "s"}</text>
                        </g>
                    `;
                }).join("")}
            </svg>
        </div>
    `;

    bindGraphScopeToggle(panel);

    panel.querySelectorAll(".node").forEach((nodeEl) => {
        nodeEl.addEventListener("click", async () => {
            const entityId = nodeEl.dataset.entityId;
            const entityClaims = graphClaims().filter((claim) => (claim.entity_ids || []).includes(entityId));
            const sourceDocumentId = entityClaims[0]?.source_document_id || null;
            state.activeEntityId = entityId;
            state.activeClaimId = entityClaims[0]?.id || null;
            // Update graph active/dimmed classes in-place; preserve scrollTop.
            updateGraphActiveNode();
            updateTranscriptHighlight();
            notify("entitySelected", {
                entityId,
                sourceDocumentId,
                pageNumber: entityClaims[0]?.page_number || null,
            });
            if (window.ficheroToken && sourceHeaders()["X-Fichero-Library-Path"]) {
                try {
                    await fetch(`/api/kg/graph/neighborhood/${entityId}`, {
                        headers: sourceHeaders(),
                    });
                } catch (_error) {
                    // Best-effort warm-up only.
                }
            }
        });
    });
}

function bindGraphScopeToggle(panel) {
    const toggle = panel.querySelector("[data-graph-scope-toggle='true']");
    if (!toggle) return;
    toggle.addEventListener("click", () => {
        state.showAllClaims = !state.showAllClaims;
        renderGraph();
    });
}

function timelineItems() {
    const eventItems = entities
        .filter((entity) => entity.entity_type === "event")
        .map((entity) => {
            const range = bestDateValue(entity.date_values, null, null);
            if (!range) return null;
            return {
                id: `entity-${entity.id}`,
                itemType: "entity",
                entityId: entity.id,
                claimId: null,
                title: entity.canonical_name,
                body: entity.description || "Event entity",
                start: range.start,
                end: range.end,
                dateLabel: displayDateRange(range.start, range.end, range.label),
                basis: range.basis,
                tags: ["Event"],
            };
        })
        .filter(Boolean);

    const claimItems = claims
        .map((claim) => {
            const range = bestDateValue(claim.date_values, claim.time_start, claim.time_end);
            if (!range) return null;
            return {
                id: `claim-${claim.id}`,
                itemType: "claim",
                entityId: claim.subject_entity_id || claim.entity_ids?.[0] || null,
                claimId: claim.id,
                title: claimSummary(claim),
                body: claim.source_excerpt || claim.text,
                start: range.start,
                end: range.end,
                dateLabel: displayDateRange(range.start, range.end, range.label),
                basis: range.basis,
                tags: ["Claim"].concat(claim.subject_canonical ? [claim.subject_canonical] : []),
            };
        })
        .filter(Boolean);

    return [...eventItems, ...claimItems].sort((lhs, rhs) => lhs.start - rhs.start);
}

function renderTimelineNow() {
    const panel = document.getElementById("timeline-panel");
    const items = timelineItems();
    if (items.length === 0) {
        panel.innerHTML = `<div class="empty">No dated events or claims are available for this document yet.</div>`;
        return;
    }

    panel.innerHTML = `
        <div class="timeline-list">
            <div class="timeline-meta">${items.length} chronological item${items.length === 1 ? "" : "s"} from event entities and dated claims.</div>
            <div class="timeline-list-items">
                ${items.map((item) => `
                    <article class="timeline-item ${state.activeClaimId === item.claimId || state.activeEntityId === item.entityId ? "active" : ""}" data-timeline-id="${item.id}">
                        <div class="timeline-item-header">
                            <div class="timeline-item-title">${escapeHtml(item.title)}</div>
                            <div class="timeline-item-date">${escapeHtml(item.dateLabel)}</div>
                        </div>
                        <div class="timeline-item-body">${escapeHtml(item.body || "")}</div>
                        <div class="timeline-item-tags">
                            ${item.tags.map((tag) => `<span class="timeline-tag">${escapeHtml(tag)}</span>`).join("")}
                            <span class="timeline-tag">${item.basis === "inferred" ? "Inferred" : "Asserted"}</span>
                        </div>
                    </article>
                `).join("")}
            </div>
        </div>
    `;

    panel.querySelectorAll(".timeline-item").forEach((element) => {
        element.addEventListener("click", () => {
            const item = items.find((entry) => entry.id === element.dataset.timelineId);
            if (!item) return;
            state.activeEntityId = item.entityId;
            state.activeClaimId = item.claimId;
            if (item.claimId) {
                const claim = claims.find((entry) => entry.id === item.claimId);
                notify("claimSelected", {
                    claimId: item.claimId,
                    sourceDocumentId: claim?.source_document_id || documentData.id,
                    pageNumber: claim?.page_number || null,
                    pageLabel: claim?.source_page_label || null,
                });
            } else if (item.entityId) {
                notify("entitySelected", {
                    entityId: item.entityId,
                    sourceDocumentId: documentData.id,
                });
            }
            renderTimeline();
            updateTranscriptHighlight();
            updateGraphActiveNode();
            renderMap();
        });
    });
}

function resolvePlaceEntity(entity, inferredCountry) {
    for (const place of entity.place_values || []) {
        if (place.lat != null && place.lon != null) {
            return {
                entityId: entity.id,
                name: entity.canonical_name,
                label: place.label || entity.canonical_name,
                lat: place.lat,
                lon: place.lon,
                basis: place.basis || "asserted",
                detail: place.label || "Entity place evidence",
            };
        }
    }

    const candidates = [entity.canonical_name, ...(entity.aliases || [])];
    for (const candidate of candidates) {
        const lookup = DEMO_PLACE_LOOKUP[normalisePlaceKey(candidate)];
        if (lookup) {
            return {
                entityId: entity.id,
                name: entity.canonical_name,
                label: lookup.label,
                lat: lookup.lat,
                lon: lookup.lon,
                basis: inferredCountry === "Colombia" ? "inferred" : "asserted",
                detail: "Resolved by Colombia-biased demo lookup",
            };
        }
    }
    return null;
}

function projectPoint(lat, lon, width, height, padding, bounds) {
    const usableWidth = width - padding * 2;
    const usableHeight = height - padding * 2;
    const x = padding + ((lon - bounds.west) / (bounds.east - bounds.west)) * usableWidth;
    const y = padding + ((bounds.north - lat) / (bounds.north - bounds.south)) * usableHeight;
    return { x, y };
}

function renderMapNow() {
    const panel = document.getElementById("map-panel");
    const geoContext = inferGeoContext();
    const resolved = entities
        .filter((entity) => entity.entity_type === "location")
        .map((entity) => resolvePlaceEntity(entity, geoContext.country))
        .filter(Boolean);
    const unresolvedCount = entities.filter((entity) => entity.entity_type === "location").length - resolved.length;

    if (resolved.length === 0) {
        panel.innerHTML = `<div class="empty">No place entities could be resolved to map coordinates for this document yet.</div>`;
        return;
    }

    const width = 900;
    const height = 500;
    const padding = 54;

    panel.innerHTML = `
        <div class="map-shell">
            <div class="map-meta">${resolved.length} mapped place entit${resolved.length === 1 ? "y" : "ies"} · ${unresolvedCount} unresolved.</div>
            <div class="map-viewport">
                <div class="map-caption">
                    <span>${escapeHtml(geoContext.country === "Colombia" ? "Colombia-focused extent" : "Document-focused extent")}</span>
                    <span>${escapeHtml(geoContext.country === "Colombia" ? "Fallback lookup is biased to Colombia for this diary demo." : "Exact basemap geocoding is still a TODO(demo).")}</span>
                </div>
                <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Resolved places for this document">
                    <rect x="${padding}" y="${padding}" width="${width - padding * 2}" height="${height - padding * 2}" rx="18" ry="18" fill="rgba(13, 107, 111, 0.04)" stroke="rgba(64, 53, 39, 0.12)"></rect>
                    ${resolved.map((place) => {
                        const point = projectPoint(place.lat, place.lon, width, height, padding, geoContext.bounds);
                        const active = state.activeEntityId === place.entityId;
                        const fill = place.basis === "inferred" ? "rgba(13, 107, 111, 0.22)" : "rgba(13, 107, 111, 0.9)";
                        const stroke = active ? "var(--claim)" : "var(--accent)";
                        return `
                            <g class="map-marker" data-entity-id="${escapeHtml(place.entityId)}">
                                <circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="${active ? 9 : 7}" fill="${fill}" stroke="${stroke}" stroke-width="${active ? 3 : 2}"></circle>
                                <text x="${(point.x + 12).toFixed(1)}" y="${(point.y + 4).toFixed(1)}" font-size="12" font-weight="600" fill="var(--text)">${escapeHtml(place.name)}</text>
                            </g>
                        `;
                    }).join("")}
                </svg>
            </div>
            <div class="map-place-list">
                ${resolved.map((place) => `
                    <article class="map-place-card ${state.activeEntityId === place.entityId ? "active" : ""}" data-entity-id="${escapeHtml(place.entityId)}">
                        <div class="map-place-name">${escapeHtml(place.name)}</div>
                        <div class="map-place-detail">${escapeHtml(place.label)}</div>
                        <div class="map-place-detail">${escapeHtml(`${place.lat.toFixed(3)}, ${place.lon.toFixed(3)} · ${place.basis === "inferred" ? "Inferred" : "Asserted"}`)}</div>
                    </article>
                `).join("")}
            </div>
        </div>
    `;

    panel.querySelectorAll("[data-entity-id]").forEach((element) => {
        element.addEventListener("click", () => {
            const entityId = element.dataset.entityId;
            state.activeEntityId = entityId;
            notify("entitySelected", {
                entityId,
                sourceDocumentId: documentData.id,
            });
            renderMap();
            renderTimeline();
            updateGraphActiveNode();
        });
    });
}

// Lazy panels (perf audit 2026-08-19): the graph re-ran a 180-tick O(N^2)
// force layout on every scroll page-cross, and every claim/entity highlight
// rebuilt the timeline AND the map — all for panels that were hidden. A
// hidden panel is marked dirty and renders when its tab opens.
const dirtyPanels = new Set();
function renderPanelLazy(name, renderNow) {
    if (state.tab !== name) { dirtyPanels.add(name); return; }
    dirtyPanels.delete(name);
    renderNow();
}
function renderGraph() { renderPanelLazy("graph", renderGraphNow); }
function renderTimeline() { renderPanelLazy("timeline", renderTimelineNow); }
function renderMap() { renderPanelLazy("map", renderMapNow); }
function renderDigest() { renderPanelLazy("digest", renderDigestNow); }
function renderDirtyPanel() {
    if (!dirtyPanels.has(state.tab)) return;
    const renderers = { graph: renderGraph, timeline: renderTimeline, map: renderMap, digest: renderDigest };
    (renderers[state.tab] || (() => {}))();
}

function renderAll() {
    renderTranscript();
    renderDigest();
    renderGraph();
    renderTimeline();
    renderMap();
    document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
    });
    ["transcript", "digest", "graph", "timeline", "map"].forEach((tab) => {
        document.getElementById(`${tab}-panel`).classList.toggle("hidden", tab !== state.tab);
    });
}

// Update graph node active/dimmed state in-place (no innerHTML swap, no scrollTop loss).
function updateGraphActiveNode() {
    const panel = document.getElementById("graph-panel");
    panel.querySelectorAll(".node").forEach((nodeEl) => {
        const id = nodeEl.dataset.entityId;
        const active = state.activeEntityId === id;
        nodeEl.classList.toggle("active", active);
    });
}

// Show/hide tab panels without a full re-render.
function applyTabVisibility() {
    document.querySelectorAll(".tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.tab);
    });
    ["transcript", "digest", "graph", "timeline", "map"].forEach((tab) => {
        document.getElementById(`${tab}-panel`).classList.toggle("hidden", tab !== state.tab);
    });
}

// Scroll the transcript to a character range and highlight it.
// page is informational (reserved for multi-page support); charStart/charEnd
// are byte offsets into documentTranscript (see its definition: the join must
// stay identical to transcript_text() or every offset shifts).
function scrollToCharRange(charStart, charEnd) {
    const panel = document.getElementById("transcript-panel");
    const transcriptEl = panel.querySelector(".transcript");
    if (!transcriptEl) return;

    // Remove existing range highlights.
    transcriptEl.querySelectorAll("mark[data-highlight='span']").forEach((mark) => {
        mark.replaceWith(document.createTextNode(mark.textContent));
        transcriptEl.normalize();
    });

    if (charStart == null || charEnd == null || charEnd <= charStart) return;

    const transcript = documentTranscript;
    const excerpt = transcript.slice(charStart, charEnd);
    if (!excerpt) return;

    // Wrap the range in every text node it touches (#5208: it may cross a line break).
    const nodes = textNodes(transcriptEl);
    const targetMark = wrapPieces(nodes, offsetPieces(nodes.map((node) => node.nodeValue.length), charStart, charEnd), "span");

    if (targetMark) {
        targetMark.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

// Highlight the library-search MATCH on its own page, and scroll to it.
// Distinct from scrollToCharRange (which indexes the WHOLE assembled
// transcript): the search anchor's char range is PAGE-relative (into that
// page's page_content, per _build_transcript_excerpts), so scope the walk to
// the page's own `.transcript-page-body` — a single escaped text node of that
// same content, so a page-relative offset maps straight to a node offset.
// pageId == null (or an out-of-range span) just CLEARS — that is how Swift
// clears the mark when the search ends or the selection changes.
function applySearchMatchHighlight(pageId, charStart, charEnd) {
    const panel = document.getElementById("transcript-panel");
    if (!panel) return;
    // Clear any prior search-match mark first (one at a time).
    panel.querySelectorAll("mark[data-highlight='search']").forEach((mark) => {
        const parent = mark.parentNode;
        mark.replaceWith(document.createTextNode(mark.textContent));
        if (parent) parent.normalize();
    });
    if (pageId == null || charStart == null || charEnd == null || charEnd <= charStart) return;
    const selector = '.transcript-page[data-page-id="'
        + ((window.CSS && CSS.escape) ? CSS.escape(pageId) : pageId) + '"]';
    const article = panel.querySelector(selector);
    if (!article) return;
    const body = article.querySelector(".transcript-page-body");
    // markup-render / table pages have no plain body to offset into — nothing
    // to light here (the raw offsets index plain page_content only).
    if (!body) return;
    // The page's offsets in its text nodes: a match may cross a line break (#5208) or an isolate, so
    // every node it touches is lit, and the view goes to the first.
    const nodes = textNodes(body);
    const first = wrapPieces(nodes, offsetPieces(nodes.map((node) => node.nodeValue.length), charStart, charEnd), "search");
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
}

document.querySelectorAll(".tabs button").forEach((button) => {
    button.addEventListener("click", () => {
        state.tab = button.dataset.tab;
        applyTabVisibility();
        if (state.tab === "graph") {
            requestAnimationFrame(renderGraph);
        } else if (state.tab === "map") {
            requestAnimationFrame(renderMap);
        } else {
            renderDirtyPanel();
        }
    });
});

let graphResizeTimer = null;
window.addEventListener("resize", () => {
    if (state.tab !== "graph" && state.tab !== "map") return;
    window.clearTimeout(graphResizeTimer);
    graphResizeTimer = window.setTimeout(() => {
        if (state.tab === "graph") {
            renderGraph();
        } else if (state.tab === "map") {
            renderMap();
        }
    }, 80);
});

window.fichero = {
    // Switch visible tab without re-rendering content panels.
    showTab(tab) {
        if (!["transcript", "digest", "graph", "timeline", "map"].includes(tab)) return;
        state.tab = tab;
        applyTabVisibility();
        if (tab === "graph") {
            requestAnimationFrame(renderGraph);
        } else if (tab === "map") {
            requestAnimationFrame(renderMap);
        } else {
            renderDirtyPanel();
        }
    },

    // Highlight a graph node in-place; no innerHTML swap, no scrollTop loss.
    pulseNode(entityId) {
        state.activeEntityId = entityId;
        updateGraphActiveNode();
    },

    // Highlight a claim in the digest and transcript in-place.
    // Preserves .content scrollTop.
    highlightClaim(claimId) {
        state.activeClaimId = claimId;
        const claim = claims.find((item) => item.id === claimId);
        if (claim?.entity_ids?.length) {
            state.activeEntityId = claim.entity_ids[0];
        }
        // Update digest active class in-place.
        document.getElementById("digest-panel").querySelectorAll(".claim-row").forEach((row) => {
            row.classList.toggle("active", row.dataset.claimId === claimId);
        });
        updateTranscriptHighlight();
        updateGraphActiveNode();
        renderTimeline();
        renderMap();
    },

    // Re-scope the graph to the active page unless the user asks for all claims,
    // and move the reader's "current page" highlight to it (#4356).
    setActivePage(pageNumber) {
        if (Number(state.activePage) !== Number(pageNumber)) {
            state.showAllClaims = false;
        }
        state.activePage = pageNumber;
        applyActivePageHighlight();
        renderGraph();
    },

    // The pages a running workflow is writing (#4357). Called from Swift with
    // the run's target set; [] clears every spinner, so a terminal state (or a
    // dropped stream) can always stop them.
    setBusyPages(pageNumbers) {
        const numbers = Array.isArray(pageNumbers) ? pageNumbers : [];
        state.busyPages = new Set(numbers.map(Number).filter(Number.isFinite));
        applyBusyPages();
    },

    // After a line move or its ⌘Z (#5170): re-read this one page and patch it in place,
    // keeping scroll and the caret's line. Resolves false when the page is not here to patch --
    // the caller reloads then.
    refreshPage(pageId) {
        return refreshPage(pageId);
    },

    // The Source view's selection, shown on the Reader's lines (#5155). [] clears. Never moves the
    // caret; scrolls the first line into view only when it is off screen.
    showLines(segmentIds) {
        shownLineIds = Array.isArray(segmentIds) ? segmentIds.slice() : [];
        const ranges = applyShownLines() || [];
        if (!ranges.length) return;
        const rect = ranges[0].getBoundingClientRect();
        const container = scrollParent(ranges[0].startContainer.parentElement);
        const box = container === document.scrollingElement
            ? { top: 0, bottom: window.innerHeight } : container.getBoundingClientRect();
        if (rect.top < box.top || rect.bottom > box.bottom) {
            container.scrollTop += rect.top - box.top - (box.bottom - box.top) / 3;
        }
    },

    // Send the line being typed now (13b): the app's Save, and before the window closes or the
    // page is swapped. Nothing pending -> nothing sent. {committed, segmentId}.
    // The engine's reachability, from the app (13b): `{reachable: false, reason?}` makes the text
    // read-only and says why -- the line being typed is committed first, and held; `{reachable:
    // true}` gives editing back and sends every held edit, each with its version check.
    engineState(state) {
        if (state && state.reachable === false) {
            engine.lost(state.reason);
            commitPendingEdit();
            applyEngineState();
            return { reachable: false, unsent: engine.unsent().length };
        }
        const resend = engine.back();
        applyEngineState();
        for (const message of resend) postEdit(message);
        return { reachable: true, resent: resend.length };
    },

    commitPending() {
        const segmentId = pendingEdit ? pendingEdit.segmentId : null;
        const sent = editsSent;
        commitPendingEdit();
        return { committed: editsSent > sent, segmentId };
    },

    // The app's answer to readingEdit / lineSplit / lineJoin (#5154). The app then asks for the
    // page again (`refreshPage`); a refusal re-reads it too, so the page never keeps words the
    // library did not take. The reason is logged for the console, not invented into the page.
    lineCommitted(answer) {
        if (answer && answer.ok && answer.representationId && answer.pageId) {
            pageLineMaps.set(answer.pageId, withReading(pageLineMaps.get(answer.pageId), answer.segmentId, answer.representationId));
        }
        if (!answer || answer.ok) return true;
        if (answer.unreachable) {
            // The edit never reached the library: its words stay on the line, held, and the page
            // goes read-only until the app says the engine is back.
            engine.lost(answer.reason, answer);
            applyEngineState();
            return true;
        }
        if (answer.stale && answer.pageId && answer.segmentId && answer.theirs) {
            // Kept, not re-read: re-reading would put their words over the person's.
            staleLines.set(staleKey(answer.pageId, answer.segmentId),
                           { mine: String(answer.mine ?? ""), theirs: answer.theirs, comparing: false });
            showStale(answer.pageId, answer.segmentId);
            return true;
        }
        console.warn("[fichero] edit not taken:", answer.reason || "no reason given", answer);
        return answer.pageId ? refreshPage(answer.pageId) : false;
    },

    // Live per-page write (#4357): patch this page's text in place.
    setPageContent(pageNumber, content) {
        return patchPageContent(pageNumber, content);
    },

    // Scroll the transcript to a character span and highlight it.
    // Called from Swift (Coordinator.syncSelection) when a claim is focused.
    // page is reserved for future multi-page documents.
    scrollToSpan(page, charStart, charEnd) {
        // Ensure transcript tab is visible.
        if (state.tab !== "transcript") {
            state.tab = "transcript";
            applyTabVisibility();
        }
        scrollToCharRange(charStart, charEnd);
    },

    // Light the RELEVANT passage of a library-search hit, from the backend
    // anchor (pageId + PAGE-relative char range). Called from Swift
    // (Coordinator.syncSelection) when a search result is the reader focus;
    // pageId null clears. This replaces re-scanning the query text as a
    // substring (which lit partial words like "nose" inside "diag-nose") —
    // the anchor already names the exact matched span.
    highlightMatchInPage(pageId, charStart, charEnd) {
        if (pageId != null && state.tab !== "transcript") {
            state.tab = "transcript";
            applyTabVisibility();
        }
        applySearchMatchHighlight(pageId, charStart, charEnd);
    },

    // Highlight an entity node in the graph in-place.
    // Previously a no-op (called via optional chaining from Swift).
    highlightEntity(entityId) {
        state.activeEntityId = entityId;
        // Find and set the first associated claim as active for digest sync.
        const firstClaim = claims.find((c) => (c.entity_ids || []).includes(entityId));
        if (firstClaim) {
            state.activeClaimId = firstClaim.id;
            document.getElementById("digest-panel").querySelectorAll(".claim-row").forEach((row) => {
                row.classList.toggle("active", row.dataset.claimId === firstClaim.id);
            });
            updateTranscriptHighlight();
        }
        updateGraphActiveNode();
        renderTimeline();
        renderMap();
    },
};

renderAll();
</script>
</body>
</html>
