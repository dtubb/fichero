# =============================================================================
# Fichero Backend - Briefcase Configuration
# =============================================================================
# This configuration builds a Python backend app that gets embedded inside the
# Swift Fichero.app as a nested .app bundle.
#
# Development workflow:
#   - Use `briefcase dev -a server` for testing bundled backend
#   - Use `uvicorn fichero_server.api.main:app --reload` for hot-reload development
#
# Production build:
#   - Run: ./scripts/build_backend_bundle.sh
#   - Output: build/fichero_server/macos/app/Fichero Server.app
#   - This .app is copied into Fichero.app/Contents/Resources/ by Xcode
# =============================================================================

[tool.briefcase]
project_name = "Fichero"
# MUST be a prefix of the host app id (app.fichero.fichero). App Store Connect
# rejects an embedded helper whose CFBundleIdentifier is not a child of the
# app's: error 90277, "Invalid Bundle Identifier", which is what stopped the
# 2026.07.30 Mac TestFlight upload. The engine ships INSIDE Fichero.app at
# Contents/Helpers/Fichero Server.app, so `com.fichero.*` was never a valid
# identity for it — the DMG path never checks, only App Store Connect does.
bundle = "app.fichero.fichero"
version = "2026.9.29"
url = "https://www.tubb.ca/fichero/"
license.file = "LICENSE"
author = "Daniel Tubb"
author_email = "dtubb@users.noreply.github.com"

# =============================================================================
# Briefcase App Definition - Embedded Backend
# =============================================================================
# This section defines the backend app that Briefcase will bundle.
# The app is a headless FastAPI server (console_app=true, no GUI).
#
# Sources:
#   - src/fichero_server: Main backend code (API, workflows, database, etc.)
#   - src/server: Briefcase entry point wrapper
# =============================================================================

[tool.briefcase.app.fichero_server]
formal_name = "Fichero Server"
description = "Headless server for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
long_description = "FastAPI backend service embedded inside the Fichero Swift app. Provides document processing, AI workflows, and data storage."
icon = "src/fichero_server/resources/server"  # Briefcase strips extension, adds platform suffixes
console_app = true  # Headless app (no window, runs in background)
sources = [
    "src/fichero_server",  # engine code + Briefcase entry point (__main__)
    # #4227: the CLI and MCP server are separate products now, but both still
    # ship inside the embedded bundle (the MCP server is an in-app
    # distribution requirement; the CLI's FicheroClient is imported lazily by
    # the importer HTTP paths).
    "../fichero-cli/src/fichero_cli",
    "../fichero-mcp/src/fichero_mcp",
]
requires = [
    # Core — 0.0.1 release surface (keep slim for bundle size)
    # Floors below are security/resolution floors only (#4337). Never `==` —
    # these deps float upward; a floor just forbids a known-bad version.
    "fastapi",
    # `from starlette.concurrency import run_in_threadpool` is a direct import
    # (workflow_execution/threads.py), and fastapi only asks for >=0.46, so the
    # floor has to live here. 1.3.1 fixes PYSEC-2026-248/249.
    "starlette>=1.3.1",
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    # 0.0.31 fixes the multipart-parser DoS trio PYSEC-2026-3036/3037/3040 —
    # reachable from every unauthenticated upload endpoint.
    "python-multipart>=0.0.31",
    "python-dotenv",
    "aiofiles",
    # 3.14.1 closes 11 advisories (PYSEC-2026-237, 2104-2113).
    "aiohttp>=3.14.1",
    "httpx",
    "defusedxml",
    # 48.0.1 fixes GHSA-537c-gmf6-5ccf.
    "cryptography>=48.0.1",
    "zeroconf",
    # Data Layer
    # >=2.13 is a resolution floor, not a security one: openrouter 0.11.x caps
    # pydantic<2.13, so a fresh install silently resolves *below* the 2.13.4 we
    # actually ship. The floor forces pip to pick an openrouter that agrees.
    "pydantic>=2.13",
    # 2.14.2 fixes GHSA-4xgf-cpjx-pc3j.
    "pydantic-settings>=2.14.2",
    "duckdb",
    # DuckDB imports pytz to return a TIMESTAMPTZ value to Python. It used to
    # arrive with pandas; pandas 3 dropped it, and every workflow-run read 500ed.
    "pytz",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    # AI/LLM — Ollama (local) + LiteLLM (provider routing)
    # 1.3.9 fixes PYSEC-2026-2192.
    "langchain>=1.3.9",
    "langchain-core",
    "langchain-openai",
    # 1.4.6 fixes PYSEC-2026-2556.
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    # Floor: 1.28.1 fixes PYSEC-2026-3483. Ceiling: mcp 2.0 deleted
    # `mcp.server.fastmcp`, which every fichero-mcp tool module imports — a
    # fresh unbounded install resolves 2.0 and the MCP product stops importing
    # at all. Lifting the cap is a migration to `mcp.server.mcpserver` (#4337).
    "mcp>=1.28.1,<2",
    "langgraph",
    "langchain-ollama",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    # pdfium must be IN the bundle, signed with it. kreuzberg ships no
    # libpdfium.dylib and its Rust binding extracts one to a temp directory on
    # first use; macOS quarantines a file the app wrote, Gatekeeper then refuses
    # to dlopen it, and PDF text extraction dies with "Pdfium initialization
    # failed" while the engine silently falls back to fitz for page splitting
    # (#2430). Result: PDFs import as page images with no searchable text, on
    # EVERY machine — a runtime-fetched dylib can never inherit the app's
    # notarization. pypdfium2 ships the dylib inside its wheel, so briefcase
    # packages it and the codesign pass covers it.
    #
    # NOTE: the binding resolves `@loader_path/libpdfium.dylib`, i.e. beside
    # `kreuzberg/_internal_bindings.abi3.so` — so shipping the wheel is
    # necessary but NOT sufficient; see scripts/place_pdfium_for_kreuzberg.py,
    # run as a build step. Verified 2026-08-04: neither the bundle nor the venv
    # contained libpdfium.dylib, and the live container held a quarantined,
    # ad-hoc-signed copy under Data/tmp/kreuzberg-pdfium/.
    "pypdfium2",
    "fastembed",
    # Historical-text stack (#3319/#3322) — mirrors [project].dependencies.
    "ftfy",
    "anyascii",
    "convertdate",
    "jdcal",
    # spaCy SHIPS (Daniel, 2026-09-04). It is the SVO grammar gate: it convicts
    # a predicate that is not a verb, and a first-person verb stamped with a
    # bystander's name — 16 of the 17 rows a real run left in a test library.
    # Apple's on-device NLTagger cannot replace it (no morphology for Spanish
    # at all), and without it the shipped app ran that gate on half power,
    # silently. Measured cost of the whole tier: ~38 MB runtime + 16 MB (es) +
    # 15 MB (en) = ~54 MB, which is why this one is affordable and the
    # neighbours below still are not.
    "spacy",
    # The two small models, pinned to the spaCy 3.8 line they were built for.
    # Bundled rather than downloaded so the gate works with zero setup, on
    # first launch, offline. `es_core_news_lg` (568 MB) stays a download row in
    # the model catalog — it carries word vectors this gate does not use and
    # its benefit for 16th-century orthography is unmeasured.
    "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # OpenCV SHIPS (Daniel, 2026-09-06): the image-enhance / background-removal /
    # deskew step is a demo feature and must actually WORK on-device, not no-op.
    # It is ~hundreds of MB — accepted for that. (image_ops still guards the
    # import so a stripped build degrades rather than crashes.)
    # pykeen is IN the bundle by the maintainer's ruling of 2026-09-20, with
    # torch and the rest of its dependencies (roughly half a gigabyte more).
    "pykeen",
    # networkx is imported directly by knowledge/graph.py and friends. It used to
    # be absent; it now also arrives with torch, but a package the engine imports
    # by name is listed by name.
    "networkx",
    # rdflib is IN the bundle (2026-09-20): api/routes/kg/sparql.py imports it at
    # module top and the engine imports that route at start, so a bundle without
    # it exits 250 on launch ("can't reach server"). 4.8 MB, pure Python, one
    # dependency (pyparsing). It was commented out only by sitting beside pykeen.
    "rdflib",
    # lxml is imported BY NAME by the interchange harness (formats/alto, pagexml, tei,
    # hocr, validation): every PAGE / ALTO / TEI import and export. Until 2026-09-27 it
    # reached the bundle only as one of kraken's transitive dependencies (the separate
    # kraken step, [tool.fichero.kraken_bundle]), so dropping or reworking that step would
    # have silently taken the whole interchange feature with it. Listed by name, like
    # networkx above. Binary wheel, installed at build time -- never at runtime.
    "lxml",
    "opencv-python-headless",
    # Document Processing
    "PyMuPDF",
    # 12.3.0 fixes 22 image-decoder advisories (PYSEC-2026-2253..2257,
    # 3451..3454, 3493..3496) — all reachable from imported user files.
    "Pillow>=12.3.0",
    # HEIC/HEIF decoding (#4214). Not optional: HEIC is the iPhone camera
    # default, and without it an imported photo becomes a record with no
    # thumbnail and no error — the wrong-but-silent shape.
    "pillow-heif>=1.1.0",
    # ISO 639-3 language names for setup's language search (recipes/names.py, any
    # project) and TEI language labels (#5472). Core, not Kraken's: until 2026-10-04
    # it arrived only through the Kraken bundle step, so an engine without that
    # step crashed on the first language search. Pure Python + JSON data.
    "iso639-lang",
]

[tool.briefcase.app.fichero_server.macOS]
universal_build = false  # arm64-only (Apple Silicon)
min_os_version = "15.0"
python_version = "3.12"  # Pin to 3.12 — many ML packages lack 3.14 wheels

# macOS-only PyObjC frameworks for the on-device Apple Vision OCR path
# (Transcribe (Apple Vision) workflow). Listed here, not in the main
# `requires` block above, so non-macOS dev installs don't fail. Without
# these, briefcase silently shipped the bundle without Vision.framework
# Python bindings and every Apple Vision workflow run died with
# "Apple Vision OCR requires macOS with Vision framework" (#790).
requires = [
    # The bundle also ships the fichero CLI (Install Command-Line Tools…,
    # 2026-08-27): typer/rich are CLI-only deps the engine itself never uses.
    "typer",
    "rich",
    # The Reader's WebKit transcript renders document_view.html through
    # Jinja2Templates. #3985 moved that import off the boot path — correctly —
    # but the package was never in the bundle, so GET /view/document/{id}
    # raised ModuleNotFoundError and returned 500 on EVERY single-document
    # read. Multi-selection renders natively and worked, which is why the
    # Reader looked broken only for one item (Daniel, 2026-08-28: "when three
    # are selected it works, but when one or none are selected it doesn't").
    # The lazy import still keeps jinja2 off the startup graph; shipping it
    # only means the deferred import can succeed.
    "jinja2",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]

# Entitlements for network server (listens on port 8765)
entitlement."com.apple.security.network.server" = true
entitlement."com.apple.security.network.client" = true

# Hide backend from Dock (background-only app)
info."LSUIElement" = true

# =============================================================================
# Kraken bundling (#4959, 2026-09-20) — installed at BUILD time, never at
# runtime. Kraken cannot go in `requires` above: it pins scipy~=1.15.3,
# click<8.3, rich<14.1.0 and scikit-learn~=1.7.2, all OLDER than what this
# bundle already carries (torch/scipy arrive via pykeen), so a single
# resolve refuses (`pip install --dry-run`, 2026-09-20: "kraken 7.1.1
# depends on scipy~=1.15.3"). `scripts/install_kraken_into_engine_bundle.py`
# reads THIS table (not a copy) after `briefcase update -r`, installing
# kraken itself with `--no-deps` (so its own pins are never consulted — the
# bundle's newer scipy/click/rich/scikit-learn resolve instead) and
# `missing_packages` normally (their transitive leaves are wanted).
# `kraken_runtime.py` never reads this table — its `runtime_status()` asks
# `importlib.metadata` for whatever is ACTUALLY importable, so a report can
# never drift from what really shipped. The packaging test
# (tests/unit/packaging/test_engine_starts_without_unbundled_packages.py)
# reads this same table so a kraken import counts as bundled only because
# this list says so, and asserts it never repeats a name `requires` already
# resolves.
[tool.fichero.kraken_bundle]
version = "7.1.1"
# Packages genuinely ABSENT from the engine bundle — checked package-by-
# package against `app_packages`'s own dist-info on the 2026.09.20 build,
# resolved cleanly on their own in a real `pip install --dry-run` scratch
# venv (2026-09-20). Installed WITHOUT --no-deps (their own transitive
# leaves are wanted).
missing_packages = [
    "scikit-image~=0.25.2",
    "lightning==2.6.1",
    "coremltools~=9.0",
    "shapely~=2.1.2",
    "safetensors~=0.8.0",  # 0.8 (2026-10-09): transformers, which the MLX step needs, requires >=0.8
    "htrmopo~=0.6",
    # iso639-lang moved to the briefcase `requires` (2026-10-04, #5472): the engine's
    # language search imports it. It still satisfies kraken, already installed.
    # lxml moved to the briefcase `requires` (2026-09-27): the engine imports it by name,
    # so it cannot depend on this step. It still satisfies kraken, already installed.
    "platformdirs",
]
# Packages that need --no-deps AND a hand pin because their OWN dependency
# resolution would try to move an already-pinned bundle package. A
# scratch-venv `pip install --dry-run` cannot find these: kraken installs
# `--no-deps`, which hides its OWN transitive pins (e.g. torchvision>=0.5.0)
# from pip entirely — this list was found only by importing from a REAL
# built bundle copy (manager's trial, 2026-09-20): "No module named
# 'torchvision'". torchvision MUST be pinned to match the bundle's own torch
# exactly (torch arrives via pykeen in `requires` above) — bump the two
# together, never one alone, or `import torchvision` will try to reinstall
# torch to satisfy its own pin.
no_deps_packages = [
    "torchvision==0.29.0",  # matches torch==2.14.0, the bundle's torch at the 2026-09-20 trial
]

# MLX and YOLO bundling (#4973, #5638; ruled 2026-10-09: everything the app needs ships inside it). Installed at
# BUILD time by `scripts/install_mlx_into_engine_bundle.py`, after the Kraken step, the same way:
# never provisioned at run time (the sandboxed app could not: "Operation not permitted"). The engine
# runs the MLX servers (mlx_lm, mlx_vlm) in its own process, not a separate Python (llm/local_inference.py).
[tool.fichero.mlx_bundle]
# Each --no-deps: mlx-vlm declares opencv-python, and the bundle already has opencv-python-headless
# (the same cv2), so a normal resolve would land a second cv2; their real needs are listed below.
no_deps_packages = [
    "mlx-lm==0.31.3",
    "mlx-vlm==0.6.17",
    "mlx-whisper==0.4.3",
    "mlx-audio==0.5.8",
    # YOLO (layout and region detection, and its training), ruled in 2026-10-09. AGPL-3.0, as is Fichero.
    # --no-deps: it declares opencv-python (the bundle has the headless build) and nvidia-ml-py (Linux GPUs).
    "ultralytics==8.4.175",
]
# What those need that the bundle lacks, resolved normally against the bundle's own pins.
missing_packages = [
    "mlx==0.32.3",
    "transformers==5.19.0",
    "sentencepiece>=0.2.0",
    "llguidance>=1.7.0",
    "miniaudio>=1.61",
    "sounddevice>=0.5.3",
    "numba",
    "matplotlib>=3.3.0",
    "polars>=0.20.0",
    "ultralytics-thop>=2.2.2",
    "ultralytics-platform>=0.1.45",
]

# Build system requirements
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Keyed on the PACKAGE name. It said `fichero` until 2026-09-02, four months
# after the package became `fichero_server` (#2566) — so this stanza matched
# nothing and fm-bridge, the workflow presets and the meta manifests were left
# out of any wheel built from this project. Briefcase copies `sources` trees
# directly, which is why the embedded engine still worked and nobody noticed.
fichero_server = [
    "resources/bin/*",
    "resources/fonts/*",
    "resources/default_workflows/*.json",
    "resources/workflow_meta/*.json",
    "resources/fonts/*",
    "recipes/seed/*.yaml","recipes/seed/*.txt","recipes/seed/*.gz",
    "recipes/seed/*/*",
    "recipes/seed/*/prompts/*",
]

# =============================================================================
# Standard Python Package Configuration
# =============================================================================
# This section defines the package for pip installation and uvicorn development.
# Used when running: uvicorn fichero_server.api.main:app --reload
#
# IMPORTANT: Keep dependencies in sync with [tool.briefcase.app.fichero_server]
# TOML doesn't support variable inheritance, so both sections must be maintained.
# =============================================================================

[project]
name = "fichero-server"
version = "2026.9.29"
description = "Headless server for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core — these ship in the Briefcase bundle
    # Floors mirror [tool.briefcase.app.fichero_server].requires; see the
    # reason comments there. Security/resolution floors only, never `==`.
    # pypdfium2 here as well as in briefcase requires (2026-09-04): the DEV
    # VENV needs the wheel's libpdfium.dylib as the source for the
    # place-beside-kreuzberg step — without it, a Dev Local engine's kreuzberg
    # binding extracts a quarantined copy at runtime and Gatekeeper throws
    # the "libpdfium.dylib Not Opened" dialog on every PDF import.
    "pypdfium2",
    "python-dotenv",
    "aiofiles",
    "aiohttp>=3.14.1",  # PYSEC-2026-237, 2104-2113
    "httpx",
    "defusedxml",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf
    "zeroconf",
    "fastapi",
    "starlette>=1.3.1",  # PYSEC-2026-248/249; direct import, fastapi only asks >=0.46
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    "python-multipart>=0.0.31",  # PYSEC-2026-3036/3037/3040 multipart DoS
    "pydantic>=2.13",  # openrouter 0.11.x caps <2.13 and downgrades what we ship
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "duckdb",
    # DuckDB imports pytz to return a TIMESTAMPTZ value to Python. It used to
    # arrive with pandas; pandas 3 dropped it, and every workflow-run read 500ed.
    "pytz",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    "langchain>=1.3.9",  # PYSEC-2026-2192
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic>=1.4.6",  # PYSEC-2026-2556
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    # Floor: PYSEC-2026-3483. Ceiling: mcp 2.0 removed `mcp.server.fastmcp`,
    # which fichero-mcp imports everywhere — see the briefcase block comment.
    "mcp>=1.28.1,<2",
    "langgraph",
    "langchain-ollama",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    "fastembed",
    # pykeen/torch stays out of core (hundreds of MB, nothing shipped needs it).
    # spaCy and OpenCV both moved INTO the bundle: spaCy for the SVO grammar
    # gate (~54 MB), OpenCV for the image-enhance demo feature (Daniel,
    # 2026-09-06 — must work on-device, not no-op; ~hundreds of MB accepted).
    # pykeen is IN the bundle by the maintainer's ruling of 2026-09-20, with
    # torch and the rest of its dependencies (roughly half a gigabyte more).
    "pykeen",
    # networkx is imported directly by knowledge/graph.py and friends. It used to
    # be absent; it now also arrives with torch, but a package the engine imports
    # by name is listed by name.
    "networkx",
    # rdflib is IN the bundle (2026-09-20): api/routes/kg/sparql.py imports it at
    # module top and the engine imports that route at start, so a bundle without
    # it exits 250 on launch ("can't reach server"). 4.8 MB, pure Python, one
    # dependency (pyparsing). It was commented out only by sitting beside pykeen.
    "rdflib",
    "opencv-python-headless",
    # Historical-text stack (#3319/#3322): all four are small pure-Python.
    "ftfy",         # mojibake repair before parsing OCR'd text
    "anyascii",     # transliteration for accent-insensitive matching
    "convertdate",  # Julian / French Republican / Hebrew / Islamic calendars
    "jdcal",        # Julian Day Number <-> Gregorian, the sort key
    "PyMuPDF",
    "Pillow>=12.3.0",  # 22 image-decoder advisories fixed in 12.3.0
    # HEIC/HEIF decoding (#4214). Not optional: HEIC is the iPhone camera
    # default, and without it an imported photo becomes a record with no
    # thumbnail and no error — the wrong-but-silent shape.
    "pillow-heif>=1.1.0",
    "iso639-lang",  # ISO 639-3 language names: setup's language search (recipes/names.py)
]

[project.optional-dependencies]
kg = [
    "pykeen",
    "rdflib",
    "spacy",
]
image = [
    "opencv-python-headless",
]
# Full dev dependencies — install with: pip install -e ".[dev]"
dev = [
    "pathvalidate",
    "nest-asyncio",
    "openai",
    "dashscope",
    "Pillow",
    "numpy",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "typer",
    "rich",
    "requests",
    "cryptography",
    "ruamel.yaml",
    "openapi-python-client",
    # #4337: the unit suite imports these at module scope (kg/ and knowledge/
    # tests, test_kg_untested_symbols.py), so a clean `pip install -e .[dev]`
    # could not even *collect* the suite — it only worked because the long-lived
    # venv had them via the kg extra's pykeen/rdflib. Declared here so the test
    # environment is reproducible without dragging torch in.
    "networkx",
    "rdflib",
    "pandas",
]

# #4227: console entry points moved with their code — `fichero` is declared by
# fichero-cli/pyproject.toml, `fichero-mcp`/`fichero-mcp-simple` by
# fichero-mcp/pyproject.toml. The server package ships no CLI.

[tool.pytest.ini_options]
# #4434: at most ONE retained basetemp; tests/conftest.py's startup sweep
# covers the case pytest cannot — a SIGKILLed run (the gate watchdog) that
# never reaches session cleanup.
#
# retention_policy stays "all" DELIBERATELY: "failed" deletes a passed test's
# tmp dir at its own teardown, which frees the numbered dir name — the next
# test (e.g. the next parametrize case) then gets the SAME absolute path, and
# every path-keyed process cache (db_manager, get_activity_tracker) hands it
# a stale handle to a deleted DuckDB ("Table workflow_runs does not exist").
# Found the hard way: one flaky 500 in test_routes_workflow_execution under
# the full run, green standalone. "A passing run leaves nothing" is enforced
# ACROSS runs instead: retention_count=1 + the startup sweep keep steady
# state at one directory.
tmp_path_retention_count = "1"
# A hung test fails with its stack instead of stalling the gate: the unit step twice hit its
# 3 h watchdog on one order-dependent hang with no name attached. 300 s clears the slowest
# honest test (engine spawn + 30 s health wait + a minute idle). "signal" fails only that test
# and the run goes on; "thread" ends the whole process on the first timeout.
timeout = 300
timeout_method = "signal"
markers = [
    "asyncio: mark async tests that run with the asyncio event loop",
    "anyio: mark async tests compatible with anyio backends",
    "requires_apple_vision: mark test as needing macOS Vision framework (auto-skipped on non-mac / when fm-bridge probe fails)",
    "requires_apple_intelligence: mark test as needing on-device Apple Intelligence (auto-skipped via fm-bridge --probe)",
    "slow: mark a test that is slow enough to be worth excluding from a fast gate (`-m 'not slow'`)",
    # Spec/area tags — the backend parallel to Swift Testing's @Tag vocabulary
    # (fichero/Tests/Unit/general/TestTags.swift). Same area names front and back so a
    # feature slices identically across both suites (`pytest -m transport`).
    "transport: engine transport contract (spec: transport-http-uds) — UDS / HTTPS / in-memory",
    "build_config: Xcode build/test/run config invariants (spec: xcode-build-configs)",
    "source_model: source model behaviours (spec: docs/contributor_manual/specs/source/source-model.md, milestone 322)",
    # A test whose assertion is a DURATION rather than a fact. Excluded from a
    # contended gate with `-m 'not timing'` and run deliberately on a quiet
    # machine, because a bound measured against a loaded machine is a bound about
    # the load: the same suite took 5:53 quiet and 39:43 beside other work
    # (#4924). These tests are not optional — a rule the spec states as "a
    # measured number, not a comment" needs one — but a duration asserted under
    # contention is a flaky test, and a flaky test in a gate teaches people to
    # ignore the gate.
    "timing: asserts a DURATION; run on a quiet machine, exclude with -m 'not timing'",
    # #5187: a test that SPAWNS an engine and waits for it (30 s health wait, a minute idle) -- sound
    # on a quiet machine, can fail when the machine is saturated. A gate under contention may retry
    # or exclude it with -m 'not load_sensitive'; it is never deleted for being slow.
    "load_sensitive: spawns an engine and waits on it; can fail under heavy load (#5187)",
]
