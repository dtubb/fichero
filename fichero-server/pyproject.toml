# =============================================================================
# Fichero Backend - Briefcase Configuration
# =============================================================================
# This configuration builds a Python backend app that gets embedded inside the
# Swift Fichero.app as a nested .app bundle.
#
# Development workflow:
#   - Use `briefcase dev -a server` for testing bundled backend
#   - Use `uvicorn fichero_server.api.main:app --reload` for hot-reload development
#
# Production build:
#   - Run: ./scripts/build_backend_bundle.sh
#   - Output: build/fichero_server/macos/app/Fichero Server.app
#   - This .app is copied into Fichero.app/Contents/Resources/ by Xcode
# =============================================================================

[tool.briefcase]
project_name = "Fichero"
# MUST be a prefix of the host app id (app.fichero.fichero). App Store Connect
# rejects an embedded helper whose CFBundleIdentifier is not a child of the
# app's: error 90277, "Invalid Bundle Identifier", which is what stopped the
# 2026.07.30 Mac TestFlight upload. The engine ships INSIDE Fichero.app at
# Contents/Helpers/Fichero Server.app, so `com.fichero.*` was never a valid
# identity for it — the DMG path never checks, only App Store Connect does.
bundle = "app.fichero.fichero"
version = "2026.7.30"
url = "https://www.tubb.ca/fichero/"
license.file = "LICENSE"
author = "Daniel Tubb"
author_email = "dtubb@users.noreply.github.com"

# =============================================================================
# Briefcase App Definition - Embedded Backend
# =============================================================================
# This section defines the backend app that Briefcase will bundle.
# The app is a headless FastAPI server (console_app=true, no GUI).
#
# Sources:
#   - src/fichero_server: Main backend code (API, workflows, database, etc.)
#   - src/server: Briefcase entry point wrapper
# =============================================================================

[tool.briefcase.app.fichero_server]
formal_name = "Fichero Server"
description = "Headless server for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
long_description = "FastAPI backend service embedded inside the Fichero Swift app. Provides document processing, AI workflows, and data storage."
icon = "src/fichero_server/resources/server"  # Briefcase strips extension, adds platform suffixes
console_app = true  # Headless app (no window, runs in background)
sources = [
    "src/fichero_server",  # engine code + Briefcase entry point (__main__)
    # #4227: the CLI and MCP server are separate products now, but both still
    # ship inside the embedded bundle (the MCP server is an in-app
    # distribution requirement; the CLI's FicheroClient is imported lazily by
    # the importer HTTP paths).
    "../fichero-cli/src/fichero_cli",
    "../fichero-mcp/src/fichero_mcp",
]
requires = [
    # Core — 0.0.1 release surface (keep slim for bundle size)
    # Floors below are security/resolution floors only (#4337). Never `==` —
    # these deps float upward; a floor just forbids a known-bad version.
    "fastapi",
    # `from starlette.concurrency import run_in_threadpool` is a direct import
    # (workflow_execution/threads.py), and fastapi only asks for >=0.46, so the
    # floor has to live here. 1.3.1 fixes PYSEC-2026-248/249.
    "starlette>=1.3.1",
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    # 0.0.31 fixes the multipart-parser DoS trio PYSEC-2026-3036/3037/3040 —
    # reachable from every unauthenticated upload endpoint.
    "python-multipart>=0.0.31",
    "python-dotenv",
    "aiofiles",
    # 3.14.1 closes 11 advisories (PYSEC-2026-237, 2104-2113).
    "aiohttp>=3.14.1",
    "httpx",
    "defusedxml",
    # 48.0.1 fixes GHSA-537c-gmf6-5ccf.
    "cryptography>=48.0.1",
    "zeroconf",
    # Data Layer
    # >=2.13 is a resolution floor, not a security one: openrouter 0.11.x caps
    # pydantic<2.13, so a fresh install silently resolves *below* the 2.13.4 we
    # actually ship. The floor forces pip to pick an openrouter that agrees.
    "pydantic>=2.13",
    # 2.14.2 fixes GHSA-4xgf-cpjx-pc3j.
    "pydantic-settings>=2.14.2",
    "duckdb",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    # AI/LLM — Ollama (local) + LiteLLM (provider routing)
    # 1.3.9 fixes PYSEC-2026-2192.
    "langchain>=1.3.9",
    "langchain-core",
    "langchain-openai",
    # 1.4.6 fixes PYSEC-2026-2556.
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    # Floor: 1.28.1 fixes PYSEC-2026-3483. Ceiling: mcp 2.0 deleted
    # `mcp.server.fastmcp`, which every fichero-mcp tool module imports — a
    # fresh unbounded install resolves 2.0 and the MCP product stops importing
    # at all. Lifting the cap is a migration to `mcp.server.mcpserver` (#4337).
    "mcp>=1.28.1,<2",
    "langgraph",
    "langchain-ollama",
    "litellm",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    "fastembed",
    # Optional KG/NER/image extras are deliberately not shipped in the
    # embedded Mac engine. They pull hundreds of MB into the tester app:
    # pykeen -> torch, spacy -> model/runtime stack, rdflib -> SPARQL stack,
    # opencv-python-headless -> cv2. Install extras locally when working on
    # those features instead.
    # "pykeen",
    # "rdflib",
    # "spacy",
    # "opencv-python-headless",
    # Document Processing
    "PyMuPDF",
    # 12.3.0 fixes 22 image-decoder advisories (PYSEC-2026-2253..2257,
    # 3451..3454, 3493..3496) — all reachable from imported user files.
    "Pillow>=12.3.0",
    # HEIC/HEIF decoding (#4214). Not optional: HEIC is the iPhone camera
    # default, and without it an imported photo becomes a record with no
    # thumbnail and no error — the wrong-but-silent shape.
    "pillow-heif>=1.1.0",
]

[tool.briefcase.app.fichero_server.macOS]
universal_build = false  # arm64-only (Apple Silicon)
min_os_version = "15.0"
python_version = "3.12"  # Pin to 3.12 — many ML packages lack 3.14 wheels

# macOS-only PyObjC frameworks for the on-device Apple Vision OCR path
# (Transcribe (Apple Vision) workflow). Listed here, not in the main
# `requires` block above, so non-macOS dev installs don't fail. Without
# these, briefcase silently shipped the bundle without Vision.framework
# Python bindings and every Apple Vision workflow run died with
# "Apple Vision OCR requires macOS with Vision framework" (#790).
requires = [
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]

# Entitlements for network server (listens on port 8765)
entitlement."com.apple.security.network.server" = true
entitlement."com.apple.security.network.client" = true

# Hide backend from Dock (background-only app)
info."LSUIElement" = true

# Build system requirements
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fichero = [
    "resources/bin/*",
    "resources/default_workflows/*.json",
    "resources/workflow_meta/*.json",
]

# =============================================================================
# Standard Python Package Configuration
# =============================================================================
# This section defines the package for pip installation and uvicorn development.
# Used when running: uvicorn fichero_server.api.main:app --reload
#
# IMPORTANT: Keep dependencies in sync with [tool.briefcase.app.fichero_server]
# TOML doesn't support variable inheritance, so both sections must be maintained.
# =============================================================================

[project]
name = "fichero-server"
version = "2026.7.30"
description = "Headless server for Fichero — embedded FastAPI service that powers document processing, AI workflows, and data storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core — these ship in the Briefcase bundle
    # Floors mirror [tool.briefcase.app.fichero_server].requires; see the
    # reason comments there. Security/resolution floors only, never `==`.
    "python-dotenv",
    "aiofiles",
    "aiohttp>=3.14.1",  # PYSEC-2026-237, 2104-2113
    "httpx",
    "defusedxml",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf
    "zeroconf",
    "fastapi",
    "starlette>=1.3.1",  # PYSEC-2026-248/249; direct import, fastapi only asks >=0.46
    "uvicorn[standard]",
    # Server launch sets ws="websockets-sansio", so the modern websockets
    # stack can float with LangGraph instead of pinning to legacy ws support.
    "websockets",
    "python-multipart>=0.0.31",  # PYSEC-2026-3036/3037/3040 multipart DoS
    "pydantic>=2.13",  # openrouter 0.11.x caps <2.13 and downgrades what we ship
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "duckdb",
    "lancedb",
    "pylance",  # provides the `lance` module — required for LanceDB full-text (FTS) search
    "langchain>=1.3.9",  # PYSEC-2026-2192
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic>=1.4.6",  # PYSEC-2026-2556
    "langchain-google-genai",
    "langchain-aws",
    "langchain-cohere",
    "langchain-mistralai",
    "langchain-openrouter",
    "langchain-community",
    "langchain-mcp-adapters",
    # Floor: PYSEC-2026-3483. Ceiling: mcp 2.0 removed `mcp.server.fastmcp`,
    # which fichero-mcp imports everywhere — see the briefcase block comment.
    "mcp>=1.28.1,<2",
    "langgraph",
    "langchain-ollama",
    "litellm",
    "apscheduler",
    "watchdog",
    "kreuzberg",
    "fastembed",
    # Optional KG/NER/image extras are intentionally out of core so Briefcase
    # does not bundle pykeen/torch, rdflib, spacy, or OpenCV into every app.
    # "pykeen",
    # "rdflib",
    # "spacy",
    # "opencv-python-headless",
    "PyMuPDF",
    "Pillow>=12.3.0",  # 22 image-decoder advisories fixed in 12.3.0
    # HEIC/HEIF decoding (#4214). Not optional: HEIC is the iPhone camera
    # default, and without it an imported photo becomes a record with no
    # thumbnail and no error — the wrong-but-silent shape.
    "pillow-heif>=1.1.0",
]

[project.optional-dependencies]
kg = [
    "pykeen",
    "rdflib",
    "spacy",
]
image = [
    "opencv-python-headless",
]
# Full dev dependencies — install with: pip install -e ".[dev]"
dev = [
    "pathvalidate",
    "nest-asyncio",
    "openai",
    "dashscope",
    "Pillow",
    "numpy",
    "pyobjc-framework-Vision",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "typer",
    "rich",
    "requests",
    "cryptography",
    "ruamel.yaml",
    "openapi-python-client",
    # #4337: the unit suite imports these at module scope (kg/ and knowledge/
    # tests, test_kg_untested_symbols.py), so a clean `pip install -e .[dev]`
    # could not even *collect* the suite — it only worked because the long-lived
    # venv had them via the kg extra's pykeen/rdflib. Declared here so the test
    # environment is reproducible without dragging torch in.
    "networkx",
    "rdflib",
    "pandas",
]

# #4227: console entry points moved with their code — `fichero` is declared by
# fichero-cli/pyproject.toml, `fichero-mcp`/`fichero-mcp-simple` by
# fichero-mcp/pyproject.toml. The server package ships no CLI.

[tool.pytest.ini_options]
markers = [
    "asyncio: mark async tests that run with the asyncio event loop",
    "anyio: mark async tests compatible with anyio backends",
    "requires_apple_vision: mark test as needing macOS Vision framework (auto-skipped on non-mac / when fm-bridge probe fails)",
    "requires_apple_intelligence: mark test as needing on-device Apple Intelligence (auto-skipped via fm-bridge --probe)",
    "slow: mark a test that is slow enough to be worth excluding from a fast gate (`-m 'not slow'`)",
]
