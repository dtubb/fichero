name: CI (Python + OpenAPI drift)

# Runs on push to main + on PR events only.
# (Not on every branch — worker ms/* branches would each burn a CI run and
#  spam failure notifications before the manager merges them. They're validated
#  locally pre-merge; CI is the trunk + PR safety net.)
# Linux runner only — Swift work is handled by Xcode Cloud (separate setup).
#
# Catches:
#   - Python lint regressions (ruff)
#   - Backend unit-test regressions (pytest, ML-heavy + embedding tests skipped)
#   - OpenAPI drift (regenerated openapi.json different from committed → would
#     have caught the #1237-style break that silently broke the Swift build)

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend (editable + dev deps)
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
          pip install ruff pytest pytest-asyncio pytest-timeout

      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_sm

      - name: ruff check
        run: ruff check fichero-server/src/

      - name: Feature-tier freshness
        env:
          PYTHONPATH: fichero-server/src
        run: python scripts/check_features_freshness.py

      - name: pytest (unit, skip ML/embedding)
        env:
          PYTHONPATH: fichero-server/src
          FICHERO_FEATURE_TIER: dev
        run: |
          pytest fichero-server/tests/unit/ \
            --ignore=fichero-server/tests/unit/_archived \
            -q -k "not embedding and not slow" \
            --timeout=60 \
            || pytest fichero-server/tests/unit/ \
                 --ignore=fichero-server/tests/unit/_archived \
                 -q -k "not embedding and not slow"

  openapi-drift:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .

      - name: Regenerate openapi.json
        env:
          PYTHONPATH: fichero-server/src
          FICHERO_FEATURE_TIER: dev
        run: bash fichero-server/scripts/sync_openapi_schema.sh

      - name: Fail if openapi.json drifted from committed copy (key-order-insensitive)
        run: |
          # Compare the committed schema against the freshly-regenerated one
          # SEMANTICALLY (sorted keys via jq -S). A byte-exact git diff is too
          # brittle: pydantic/FastAPI version skew between this runner and a
          # developer's local .venv reorders JSON keys (description/type/default)
          # without any real contract change, which used to fail CI on every run.
          drift=0
          for f in \
            fichero/fichero-api-client/Sources/FicheroAPIClient/openapi.json \
            fichero-server/tests/contracts/openapi.json; do
            committed="$(git show "HEAD:$f" | jq -S .)"
            regenerated="$(jq -S . "$f")"
            if [ "$committed" != "$regenerated" ]; then
              echo "::error::OpenAPI schema drift detected in $f (semantic diff — a real contract change)."
              echo "Fix: run \`bash fichero-server/scripts/sync_openapi_schema.sh\` locally and commit the regenerated file."
              echo "--- SEMANTIC DIFF (sorted keys) ---"
              diff <(echo "$committed") <(echo "$regenerated") | head -120
              drift=1
            fi
          done
          [ "$drift" -eq 0 ] && echo "openapi.json is semantically in sync with the FastAPI app." || exit 1

  feature-tier-drift:
    name: Feature tier drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .

      - name: Feature-tier freshness
        env:
          PYTHONPATH: fichero-server/src
        run: python scripts/check_features_freshness.py
