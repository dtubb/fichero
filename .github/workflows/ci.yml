name: CI (Python + OpenAPI drift)

# Runs on pushes to main and integration, and on PR events (pipeline.actions-engine-free-checks, #6116).
# (Not on every branch — worker branches would each burn a CI run and spam failure
#  notifications before the manager merges them. They're validated locally pre-merge.)
# Linux runner only — Swift unit tests need the embedded engine and signing, so they stay
# on the Macs (see the spec's build order).
#
# Catches:
#   - Python lint regressions (ruff)
#   - the guard scripts that need no Mac tool (scripts/check_*.py)
#   - Backend unit-test regressions (pytest, ML-heavy + embedding tests skipped)
#   - OpenAPI drift (regenerated openapi.json different from committed → would
#     have caught the #1237-style break that silently broke the Swift build)
#   - on a PR: scripts/lane_ready_check.sh (agent author, issue cited, lint, a test with the source)

on:
  push:
    branches: ['main', 'integration']
  pull_request:

permissions:
  contents: read   # the guards run on PR code; they read, they never write

jobs:
  ready-check:
    name: Lane ready check (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: lane_ready_check.sh against origin/integration
        run: |
          git fetch origin integration
          bash scripts/lane_ready_check.sh HEAD

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend (editable + dev deps)
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
          pip install ruff pytest pytest-asyncio pytest-timeout

      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_sm

      - name: ruff check
        run: ruff check fichero-server/src/

      - name: Feature-tier freshness
        env:
          PYTHONPATH: fichero-server/src:fichero-cli/src:fichero-mcp/src
        run: python scripts/check_features_freshness.py

      # Spec discipline: every APPROVED spec is tracked by a GitHub milestone, points at the
      # user-manual section that explains it, and is cited by >=1 test. These ran only in
      # verify-all (which auto-discovers scripts/check_*.py) and so never gated a PR —
      # the reason spec/milestone/manual coverage drifted (creative-director, 2026-09-17).
      # Offline-deterministic: the milestone check only WARNS when a milestone is missing.
      - name: Spec discipline (milestone + manual + tests)
        run: |
          python scripts/check_spec_milestones.py
          python scripts/check_spec_manual_refs.py
          python scripts/check_specs_have_tests.py

      # Every guard that needs no Mac tool, no running engine and no local git state (#6116).
      # The skip list names the ones that do: swiftlint/xcodebuild/plutil/codesign, a release build,
      # an xcresult, an app_packages path, or the worktrees and stashes of a developer's checkout.
      # ponytail: measured on a Mac with the venv (all green in ~1 min); the first PR run on Linux
      # tells us which of the remaining ones still assume a Mac — add those here, don't fork them.
      - name: Guard scripts (engine-free)
        env:
          PYTHONPATH: fichero-server/src:fichero-cli/src:fichero-mcp/src
          FICHERO_FEATURE_TIER: dev
          GH_TOKEN: ${{ github.token }}
        run: |
          skip='check_closed_issues_landed|check_unmerged_work|check_merged_worktrees|check_no_orphan_stashes'
          skip="$skip|check_coverage_ratchet|check_embedded_engine_signing|check_hang_ratchet|check_mac_app_store_target"
          skip="$skip|check_release_staples_app|check_sparkle_update_ready|check_swiftlint_warning_ratchet"
          skip="$skip|check_test_plans_runnable|check_engine_imports_bundled|check_release_size_ratchet"
          skip="$skip|check_spec_milestones|check_spec_manual_refs|check_specs_have_tests"   # ran above
          red=0
          for s in scripts/check_*.py; do
            echo "$s" | grep -qE "$skip" && continue
            echo "::group::$s"
            if ! python "$s"; then echo "::error::$s failed"; red=1; fi
            echo "::endgroup::"
          done
          exit $red

      - name: pytest (unit, skip ML/embedding)
        env:
          PYTHONPATH: fichero-server/src:fichero-cli/src:fichero-mcp/src
          FICHERO_FEATURE_TIER: dev
        run: |
          pytest fichero-server/tests/unit/ \
            --ignore=fichero-server/tests/unit/_archived \
            -q -k "not embedding and not slow" \
            --timeout=60 \
            || pytest fichero-server/tests/unit/ \
                 --ignore=fichero-server/tests/unit/_archived \
                 -q -k "not embedding and not slow"

  openapi-drift:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .

      - name: Regenerate openapi.json
        env:
          PYTHONPATH: fichero-server/src:fichero-cli/src:fichero-mcp/src
          FICHERO_FEATURE_TIER: dev
        run: bash fichero-server/scripts/sync_openapi_schema.sh

      - name: Fail if openapi.json drifted from committed copy (key-order-insensitive)
        run: |
          # Compare the committed schema against the freshly-regenerated one
          # SEMANTICALLY (sorted keys via jq -S). A byte-exact git diff is too
          # brittle: pydantic/FastAPI version skew between this runner and a
          # developer's local .venv reorders JSON keys (description/type/default)
          # without any real contract change, which used to fail CI on every run.
          drift=0
          for f in \
            fichero/fichero-api-client/Sources/FicheroAPIClient/openapi.json \
            fichero-server/tests/contracts/openapi.json; do
            committed="$(git show "HEAD:$f" | jq -S .)"
            regenerated="$(jq -S . "$f")"
            if [ "$committed" != "$regenerated" ]; then
              echo "::error::OpenAPI schema drift detected in $f (semantic diff — a real contract change)."
              echo "Fix: run \`bash fichero-server/scripts/sync_openapi_schema.sh\` locally and commit the regenerated file."
              echo "--- SEMANTIC DIFF (sorted keys) ---"
              diff <(echo "$committed") <(echo "$regenerated") | head -120
              drift=1
            fi
          done
          [ "$drift" -eq 0 ] && echo "openapi.json is semantically in sync with the FastAPI app." || exit 1

  feature-tier-drift:
    name: Feature tier drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend
        working-directory: fichero-server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .

      - name: Feature-tier freshness
        env:
          PYTHONPATH: fichero-server/src:fichero-cli/src:fichero-mcp/src
        run: python scripts/check_features_freshness.py
