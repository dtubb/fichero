name: CI (Python + OpenAPI drift)

# Runs on every push to any branch + on PR events.
# Linux runner only — Swift work is handled by Xcode Cloud (separate setup).
#
# Catches:
#   - Python lint regressions (ruff)
#   - Backend unit-test regressions (pytest, ML-heavy + embedding tests skipped)
#   - OpenAPI drift (regenerated openapi.json different from committed → would
#     have caught the #1237-style break that silently broke the Swift build)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend (editable + dev deps)
        working-directory: fichero-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
          pip install ruff pytest pytest-asyncio pytest-timeout

      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download es_core_news_sm

      - name: ruff check
        run: ruff check fichero-engine/src/

      - name: pytest (unit, skip ML/embedding)
        env:
          PYTHONPATH: fichero-engine/src
          FICHERO_FEATURE_TIER: dev
        run: |
          pytest fichero-engine/tests/unit/ \
            --ignore=fichero-engine/tests/unit/_archived \
            -q -k "not embedding and not slow" \
            --timeout=60 \
            || pytest fichero-engine/tests/unit/ \
                 --ignore=fichero-engine/tests/unit/_archived \
                 -q -k "not embedding and not slow"

  openapi-drift:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend
        working-directory: fichero-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .

      - name: Regenerate openapi.json
        env:
          PYTHONPATH: fichero-engine/src
          FICHERO_FEATURE_TIER: dev
        run: bash fichero-engine/scripts/sync_openapi_schema.sh

      - name: Fail if openapi.json drifted from committed copy
        run: |
          if ! git diff --quiet -- fichero/fichero-api-client/Sources/FicheroAPIClient/openapi.json fichero-engine/tests/contracts/openapi.json; then
            echo "::error::OpenAPI schema drift detected — the FastAPI backend produces a different openapi.json than what's committed."
            echo "Fix: run \`bash fichero-engine/scripts/sync_openapi_schema.sh\` locally and commit the regenerated file."
            echo ""
            echo "--- DIFF ---"
            git diff -- fichero/fichero-api-client/Sources/FicheroAPIClient/openapi.json fichero-engine/tests/contracts/openapi.json | head -200
            exit 1
          fi
          echo "openapi.json is in sync with the FastAPI app."
