name: Security

# Spec: docs/contributor_manual/specs/harness/github-ci.md (ci.security-workflow).
# Runs the builder's own security rung (scripts/security_scan_run.py: bandit, semgrep, gitleaks, with their baselines and pins in
# harness.toml [check.security]; osv-scanner only while osv = true, read by security_rung.read_osv), so there is one scanner
# set and one threshold, not a second one. CodeQL is the one scanner added here. Secret scanning push protection is a repository
# setting (Settings > Code security), not code: the owner switches it on.
on:
  pull_request:
    branches: ['integration']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Read the rung's pins and osv switch from harness.toml
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          sec = tomllib.load(open("harness.toml", "rb"))["check"]["security"]
          pins = sec["pins"]
          print("pins=" + json.dumps({**pins, "osv-scanner-enabled": bool(sec.get("osv", False))}))
          for k in ("bandit", "semgrep", "gitleaks", "osv-scanner"):
              print(f"{k}={pins[k]}")
          print("osv=" + str(bool(sec.get("osv", False))).lower())
          PY
      - name: Install the scanners at the pinned versions
        run: |
          uv tool install "bandit==${{ steps.cfg.outputs.bandit }}"
          uv tool install "semgrep==${{ steps.cfg.outputs.semgrep }}"
          g="${{ steps.cfg.outputs.gitleaks }}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${g}/gitleaks_${g}_darwin_arm64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install osv-scanner (only when harness.toml [check.security] osv is true)
        if: steps.cfg.outputs.osv == 'true'
        run: |
          o="${{ steps.cfg.outputs.osv-scanner }}"
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${o}/osv-scanner_darwin_arm64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Choose the range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            since="${{ github.event.pull_request.base.sha }}"
          else
            since="$(git rev-list -1 --before='24 hours ago' HEAD)"
          fi
          test -n "$since" || { echo "no commit older than 24 hours to diff against" >&2; exit 1; }
          echo "since=$since" >> "$GITHUB_OUTPUT"
      - name: Scan the range (bandit, semgrep, gitleaks, and osv-scanner when switched on)
        run: |
          python3 scripts/security_scan_run.py --since "${{ steps.range.outputs.since }}" --head HEAD --pins '${{ steps.cfg.outputs.pins }}' | tee scan.out
      - name: Fail on high or critical, or on a scanner that did not run
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "fichero-builder")
          from fichero_builder import security_rung as sr
          line = [l for l in open("scan.out") if l.startswith("SECURITY-RESULT ")]
          if not line:
              sys.exit("the scan printed no SECURITY-RESULT line")
          result = json.loads(line[-1].split(" ", 1)[1])
          rows = result["rows"]
          for r in result["refused"]:
              print(r)
          print(sr.table(rows))
          red = [r for r in rows if r["red"]]
          if result["refused"]:
              sys.exit(f"{len(result['refused'])} scanner(s) refused or wrote no output: nothing was scanned by them")
          sys.exit(f"{len(red)} red finding(s)" if red else 0)
          PY

  codeql:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: python, os: ubuntu-latest, build-mode: none }
          - { language: swift, os: macos-15, build-mode: none }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
