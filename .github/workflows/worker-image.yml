name: Worker image (amd64, for apptainer pull)

# Builds the slim read-worker image, checks it imports what the runner needs, and publishes it to ghcr.io from main
# so a cluster can `apptainer pull docker://ghcr.io/<owner>/fichero-worker:<sha>` once (`compute.hpc.slim-worker-image`).
on:
  push:
    branches: ['main']
    paths:
      - 'fichero-server/docker/worker.Dockerfile'
      - 'fichero-server/src/fichero_server/remote_read/runner.py'
      - '.github/workflows/worker-image.yml'
  pull_request:
    paths:
      - 'fichero-server/docker/worker.Dockerfile'
      - 'fichero-server/src/fichero_server/remote_read/runner.py'
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: fichero-server
          file: fichero-server/docker/worker.Dockerfile
          platforms: linux/amd64
          load: true
          tags: fichero-worker:ci
      - name: Import check
        run: docker run --rm fichero-worker:ci python -c "import kraken, PIL; print('worker imports ok')"
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: fichero-server
          file: fichero-server/docker/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fichero-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fichero-worker:latest

  worker-gpu:
    # Heavy (vLLM + CUDA PyTorch): built only when asked, on top of the slim image published above.
    if: github.event_name == 'workflow_dispatch'
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the GPU worker (amd64)
        uses: docker/build-push-action@v6
        with:
          context: fichero-server
          file: fichero-server/docker/worker-gpu.Dockerfile
          build-args: BASE=ghcr.io/${{ github.repository_owner }}/fichero-worker:${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fichero-worker-gpu:${{ github.sha }}
