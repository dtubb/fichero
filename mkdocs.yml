# Fichero documentation + marketing site (MkDocs + Material).
#
# ONE folder: `docs/`. It is BOTH what mkdocs publishes AND what contributors and
# agents read — browsing `docs/` on GitHub shows the real source. The curated
# public pages (user manual, developer/contributor docs, api-reference,
# how-its-built, faq, index) and the deeper architecture/runbook material live
# side by side; only the pages listed in `nav` are surfaced as site navigation,
# the rest remain buildable reference. Agent working scratch lives in
# `agent-work/` and is never part of this folder or the build.
#
# --- How to use ------------------------------------------------------------
#   pip install -r requirements-docs.txt
#   mkdocs serve          # live preview at http://127.0.0.1:8000
#   mkdocs build --strict # production build into ./_site_build (gitignored)
#
# --- Publishing / domain swap ----------------------------------------------
#   1. Set `site_url` below to the real domain (currently a placeholder).
#   2. For GitHub Pages on a custom domain, add a CNAME file (create
#      docs/CNAME containing the bare domain so it's copied into the build,
#      or set the Pages custom domain in repo settings).
#   3. `mkdocs gh-deploy` builds and pushes to the gh-pages branch.

site_name: Fichero
site_description: A document library to organize, search, and process research materials using workflows, entirely on your Mac.
site_author: Daniel Tubb
# TODO: real domain undecided — placeholder only. Swap before publishing.
site_url: https://fichero.example/

repo_url: https://github.com/dtubb/fichero
repo_name: dtubb/fichero
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site_build

# docs/README.md is the GitHub folder landing for `docs/`; the published home is
# index.md. Exclude the README from the build so it does not conflict with
# index.md (mkdocs would otherwise warn, failing --strict).
exclude_docs: |
  /README.md
  # Dated internal audits. Kept in-repo for provenance (MEMORY.md cites them) but
  # not published: every .md under docs_dir otherwise becomes a public page.
  /archive/

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  # Resolves Material's `:material-download:` icon shortcodes. Without this the
  # shortcodes render as literal text (they did, on the home page, until now).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Tolerate the pre-existing cross-links inside the curated manuals that point at
# internal (unpublished) docs; keep nav integrity strict.
validation:
  nav:
    not_found: warn
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - FAQ: faq.md
  - User Guide:
      - Overview: user/README.md
      - What Fichero Is: user/what-fichero-is.md
      - Feature Matrix: user/features.md
      - Installing Fichero: user/install.md
      - Getting Started: user/getting-started.md
      - The Interface (Window Tour): user/interface-tour.md
      - Importing Documents: user/importing-documents.md
      - Reading & Editing: user/reading-and-editing.md
      - Search & Knowledge Graph: user/search-knowledge-graph.md
      - Curation, Notes & Workflows: user/curation-notes-workflows.md
      - AI & Privacy: user/ai-and-privacy.md
      - Supported File Types: user/supported-file-types.md
  - Contributor:
      - Overview: contributor/README.md
      - How Fichero Works: contributor/how-fichero-works.md
      - Architecture Overview: contributor/architecture-overview.md
      - Node Model: contributor/node-model.md
      - OpenAPI & Clients: contributor/openapi-and-clients.md
      - Data, Search & KG: contributor/data-search-and-kg.md
      - Workflows, Activity & Curation: contributor/workflows-activity-and-curation.md
      - Action Registry: contributor/action-registry.md
      - Security Model: contributor/security-model.md
      - Setup & Contributing: contributor/setup-and-contributing.md
      - Ingest:
          - Overview: contributor/ingest-overview.md
          - Ingest API: contributor/ingest-api.md
          - Best Practices: contributor/ingest-best-practices.md
      - Remote Engine:
          - Tailscale Private Transport: contributor/remote-backend-tailscale.md
          - Remote Backend on ACENET: contributor/remote-backend-acenet.md
      - Standards & Principles:
          - SwiftUI Principles: contributor/swiftui-principles.md
          - AppKit Interop: contributor/appkit-interop.md
          - Frontend Standards: contributor/swiftui-development-standards.md
          - Backend Standards: contributor/backend-development-standards.md
          - Extensibility Guarantee: contributor/extensibility-guarantee.md
      - Architecture Notes:
          - System Overview: contributor/architecture/overview.md
          - Backend API Overview: contributor/architecture/api/overview.md
          - SwiftUI Overview: contributor/architecture/swiftui/overview.md
      - Release:
          - Release Lane Runbook: contributor/release/release-lane.md
          - Sparkle Release Setup: contributor/release/sparkle-release.md
          - Release Process: contributor/architecture/release-process.md
          - 0.1.0 QA Sign-Off: contributor/release/qa-signoff-0.1.0.md
      - Packaging:
          - Bundling the Backend: contributor/bundling-backend.md
          - Bundled Backend Setup: contributor/setup-bundled-backend.md
      - UI Map: contributor/ui-map.md
  - AI Manual:
      - Overview: ai/README.md
      - Architecture & Development Guide: ai/CLAUDE.md
  - API Reference: contributor/api-reference/index.md
  - How It's Built: how-its-built.md
