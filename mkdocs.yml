# Fichero documentation + marketing site (MkDocs + Material).
#
# ONE site, ONE folder. The curated public site lives as REAL files under
# `site/docs/` — the folder IS the source of truth, so browsing `site/docs/` on
# GitHub shows exactly what publishes. There is no exclude_docs allowlist and no
# mirroring of the repo's internal `docs/` tree (that stays the agent working
# area and is never published).
#
# --- How to use ------------------------------------------------------------
#   pip install -r requirements-docs.txt
#   mkdocs serve          # live preview at http://127.0.0.1:8000
#   mkdocs build --strict # production build into ./site/_build (gitignored)
#
# --- Publishing / domain swap ----------------------------------------------
#   1. Set `site_url` below to the real domain (currently a placeholder).
#   2. For GitHub Pages on a custom domain, add a CNAME file (create
#      site/docs/CNAME containing the bare domain so it's copied into the build,
#      or set the Pages custom domain in repo settings).
#   3. `mkdocs gh-deploy` builds and pushes to the gh-pages branch.

site_name: Fichero
site_description: A document library to organize, search, and process research materials using workflows, entirely on your Mac.
site_author: Daniel Tubb
# TODO: real domain undecided — placeholder only. Swap before publishing.
site_url: https://fichero.example/

repo_url: https://github.com/dtubb/fichero
repo_name: dtubb/fichero
edit_uri: edit/main/site/docs/

docs_dir: site/docs
site_dir: site/_build

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

# Tolerate the pre-existing cross-links inside the curated manuals that point at
# internal (unpublished) docs; keep nav integrity strict.
validation:
  nav:
    not_found: warn
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - FAQ: faq.md
  - User Guide:
      - Overview: user/README.md
      - What Fichero Is: user/what-fichero-is.md
      - Installing Fichero: user/install.md
      - Getting Started: user/getting-started.md
      - The Interface (Window Tour): user/interface-tour.md
      - Importing Documents: user/importing-documents.md
      - Reading & Editing: user/reading-and-editing.md
      - Search & Knowledge Graph: user/search-knowledge-graph.md
      - Curation, Notes & Workflows: user/curation-notes-workflows.md
      - AI & Privacy: user/ai-and-privacy.md
  - Contributor:
      - Overview: contributor/README.md
      - Architecture Overview: contributor/architecture-overview.md
      - OpenAPI & Clients: contributor/openapi-and-clients.md
      - Data, Search & KG: contributor/data-search-and-kg.md
      - Workflows, Activity & Curation: contributor/workflows-activity-and-curation.md
      - Action Registry: contributor/action-registry.md
      - Security Model: contributor/security-model.md
      - Setup & Contributing: contributor/setup-and-contributing.md
      - Architecture Notes:
          - System Overview: architecture/overview.md
          - Backend API Overview: architecture/api/overview.md
          - SwiftUI Overview: architecture/swiftui/overview.md
          - Release Process: architecture/release-process.md
  - API Reference: api-reference/index.md
  - How It's Built: how-its-built.md
