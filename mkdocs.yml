# Fichero documentation + marketing site (MkDocs + Material).
#
# ONE folder: `docs/`. It is BOTH what mkdocs publishes AND what contributors and
# agents read — browsing `docs/` on GitHub shows the real source. Three manuals:
# `user/` (using Fichero), `contributor/` (building it), `ai/` (the agents that
# write most of the code).
#
# CAUTION: mkdocs builds EVERY .md under `docs_dir` into a public page. `nav` only
# controls what appears in the site navigation — it does not gate publication. A
# page left out of `nav` is still live at its URL, just unlinked. Anything that
# must not be public belongs outside `docs/` (agent scratch -> `agent-work/`,
# the priority spine -> `agents/ROADMAP.md`), not merely out of `nav`.
#
# --- How to use ------------------------------------------------------------
#   pip install -r requirements-docs.txt
#   mkdocs serve          # live preview at http://127.0.0.1:8000
#   mkdocs build --strict # production build into ./_site_build (gitignored)
#
# --- Publishing / domain swap ----------------------------------------------
#   1. Set `site_url` below to the real domain (currently a placeholder).
#   2. For GitHub Pages on a custom domain, add a CNAME file (create
#      docs/CNAME containing the bare domain so it's copied into the build,
#      or set the Pages custom domain in repo settings).
#   3. `mkdocs gh-deploy` builds and pushes to the gh-pages branch.

site_name: Fichero
site_description: A document library to organize, search, and process research materials using workflows, entirely on your Mac.
site_author: Daniel Tubb
# Daniel's 2026-08-25 ruling: tubb.ca/apps/fichero is the permanent home.
site_url: https://tubb.ca/apps/fichero/

repo_url: https://github.com/dtubb/fichero
repo_name: dtubb/fichero
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site_build

# docs/README.md is the GitHub folder landing for `docs/`; the published home is
# index.md. Exclude it from the build so mkdocs does not warn about the two
# conflicting (which fails --strict).
exclude_docs: |
  /README.md
  /_latest.md
  /_releases.md

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
# Single light scheme, like tubb.ca — no dark-mode toggle. Primary "white"
# keeps Material from painting header/tab/menu surfaces indigo; the download
# buttons get their indigo explicitly in extra.css.
  palette:
    scheme: default
    primary: white
    accent: indigo

markdown_extensions:
  # SmartyPants: straight quotes -> curly, -- -> en dash, --- -> em dash, ... -> ellipsis.
  - smarty
  - admonition
  - attr_list
  - md_in_html
  - toc: {}
  - pymdownx.superfences
  - pymdownx.details
  # Pulls the generated release snippets (docs/_releases.md, docs/_latest.md)
  # into index.md; scripts/gen_site_releases.py writes them from RELEASE_NOTES.md.
  - pymdownx.snippets
  # Resolves Material's `:material-download:` icon shortcodes. Without this the
  # shortcodes render as literal text (they did, on the home page, until now).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Footer line — the way back to the parent site.
copyright: 'Fichero is an app by <a href="https://tubb.ca">Daniel Tubb — tubb.ca</a>'

extra_css:
  - assets/extra.css

plugins:
  - search

# Tolerate the pre-existing cross-links inside the curated manuals that point at
# internal (unpublished) docs; keep nav integrity strict.
validation:
  nav:
    not_found: warn
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

