# This project was generated with 0.3.23 using template: https://github.com/beeware/briefcase-template @ v0.3.23
[tool.briefcase]
project_name = "Fichero"
bundle = "ca.tubb.fichero"
version = "0.1.0.dev1"
url = "https://www.tubb.ca/fichero/"
license.file = "LICENSE"
author = "dtubb"
author_email = "daniel@tuI addplease do``   bb.ca"

# GUI Application
[tool.briefcase.app.fichero]
formal_name = "Fichero"
description = "Document Processing and Transcription"
long_description = """Fichero processes archival materials (documents in JPG, PDF, TIFF format), and crops, splits, enhances contrast, removes backgrounds, and then transcribes text using AI LLMs, before exporting them to Word documents.
"""
icon = "src/fichero/resources/icons/fichero"
sources = [
    "src/fichero",
    "src/fichero/resources",
]
test_sources = [
    "tests",
]
console_app = false
requires = [
    "toga-core>=0.5.1,<0.6.0",
    # Core dependencies that work across all platforms
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.20.0",
    "requests>=2.25.0",
    "cryptography>=3.0.0",
    "ruamel.yaml>=0.17.0",
    "pathvalidate>=3.0.0",
    "aiofiles>=24.0.0,<25.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    # CLI dependencies moved to desktop-only platforms
    # AI/ML dependencies for all platforms
    "openai>=1.0.0",
    "dashscope>=1.20.0",
]
test_requires = [
    #"pytest",
    #"openai>=1.86.0,<2.0.0",
    #"pathvalidate>=3.2.3,<4.0.0",
    #"cryptography>=45.0.0,<46.0.0",
]

# Platform-specific configurations for GUI
[tool.briefcase.app.fichero.macOS]
universal_build = true
requires = [
    "toga-cocoa>=0.5.1,<0.6.0",
    "toga>=0.5.1,<0.6.0",
    "std-nslog~=1.0.3",
    "pyobjc-core>=11.1,<12.0",  # Core PyObjC support
    "pyobjc-framework-Cocoa>=11.1,<12.0",  # macOS system icons and UI integration
    # CLI dependencies for macOS
    "typer>=0.16.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "srsly>=2.5.1,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
    # Document processing dependencies
    "pdf2image>=1.17.0,<2.0.0",
    "exifread>=3.3.1,<4.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "langchain>=0.3.25,<0.4.0",
    "langchain-ollama>=0.3.3,<1.0.0",
    # macOS-specific optional dependencies
    "opencv-python",  # Generally works well on macOS
    "rawpy>=0.25.0,<1.0.0",  # RAW image support
    "python-magic>=0.4.27,<1.0.0",  # File type detection
    "pytesseract>=0.3.13,<1.0.0", # OCR support
    # AI/ML dependencies inherited from main requires
]

[tool.briefcase.app.fichero.linux]
# Flatpak configuration for Linux packaging
flatpak_sdk = "org.freedesktop.Sdk"
flatpak_runtime = "org.freedesktop.Platform"
flatpak_runtime_version = "24.08"

requires = [
    "toga-gtk>=0.5.1,<0.6.0",
    "toga>=0.5.1,<0.6.0",
    "pygobject < 3.52.1",
    # CLI dependencies for Linux
    "typer>=0.16.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "srsly>=2.5.1,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
    # Document processing dependencies
    "pdf2image>=1.17.0,<2.0.0",
    "exifread>=3.3.1,<4.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "langchain>=0.3.25,<0.4.0",
    "langchain-ollama>=0.3.3,<1.0.0",
    # Linux-specific optional dependencies
    "opencv-python",  # Generally works well on Linux
    "rawpy>=0.25.0,<1.0.0",  # RAW image support
    "python-magic>=0.4.27,<1.0.0",  # File type detection
    "pytesseract>=0.3.13,<1.0.0",  # OCR support
    # AI/ML dependencies
    "openai>=1.0.0",
    "dashscope>=1.20.0",
]

# Flatpak finish arguments (permissions)
# Explicitly ensure session-bus is available (Briefcase default is broken)
finish_arg."socket=session-bus" = true

[tool.briefcase.app.fichero.windows]
requires = [
    "toga-winforms>=0.5.1,<0.6.0",
    "toga>=0.5.1,<0.6.0",
    # CLI dependencies for Windows
    "typer>=0.16.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "srsly>=2.5.1,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
    # Document processing dependencies
    "pdf2image>=1.17.0,<2.0.0",
    "exifread>=3.3.1,<4.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "langchain>=0.3.25,<0.4.0",
    "langchain-ollama>=0.3.3,<1.0.0",
    # Windows-specific optional dependencies
    "opencv-python",  # Generally works well on Windows
    "rawpy>=0.25.0,<1.0.0",  # RAW image support
    "python-magic>=0.4.27,<1.0.0",  # File type detection
    "pytesseract>=0.3.13,<1.0.0",  # OCR support
    # AI/ML dependencies
    "openai>=1.0.0",
    "dashscope>=1.20.0",
]

[tool.briefcase.app.fichero.iOS]
bundle = "ca.tubb.fichero"
requires = [
    "toga-core>=0.5.1,<0.6.0",
    "toga-iOS>=0.5.1,<0.6.0",
    "toga>=0.5.1,<0.6.0",
    # Core dependencies that work on iOS
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.20.0",
    "requests>=2.25.0",
    "cryptography>=3.0.0",
    "ruamel.yaml>=0.17.0",
    "pathvalidate>=3.0.0",
    "aiofiles>=24.0.0,<25.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    # Additional dependencies needed by core modules
    # iOS-specific logging
    "std-nslog~=1.0.3",
]

# Note: iOS excludes problematic dependencies like srsly, rich, typer, tqdm,
# opencv-python, rawpy, python-magic, pytesseract, pdf2image, exifread,
# python-docx, langchain, langchain-ollama, psutil, openai, dashscope

[tool.briefcase.app.fichero.android]
requires = [
    "toga-android>=0.5.1,<0.6.0",
    "toga-core>=0.5.1,<0.6.0",
    # Core dependencies that work on Android (explicitly listed to avoid inheritance)
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.20.0",
    "requests>=2.25.0",
    "cryptography>=3.0.0",
    "ruamel.yaml>=0.17.0",
    "pathvalidate>=3.0.0",
    "aiofiles>=24.0.0,<25.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    # Explicitly exclude AI/ML dependencies that require Rust compilation
    # Note: openai, dashscope, jiter are NOT included here
    # Note: pyjnius excluded due to Python 3.10+ compatibility issues
]

# Note: Android excludes problematic dependencies that require Rust compilation
# or native extensions: openai, dashscope, srsly, rich, typer, tqdm,
# opencv-python, rawpy, python-magic, pytesseract, pdf2image, exifread,
# python-docx, langchain, langchain-ollama

# Build system requirements
[build-system]
requires = ["briefcase"]
build-backend = "briefcase.backend"

[project.scripts]
fichero-cli = "fichero.cli:main"
fichero-gui = "fichero.app:main" 