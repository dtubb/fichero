# This project was generated with 0.3.23 using template: https://github.com/beeware/briefcase-template @ v0.3.23
[tool.briefcase]
project_name = "Fichero"
bundle = "ca.tubb.fichero"
version = "0.1.0.dev1"
url = "https://www.tubb.ca/fichero/"
license.file = "LICENSE"
author = "dtubb"
author_email = "daniel@tubb.ca"

# GUI Application
[tool.briefcase.app.fichero]
formal_name = "Fichero"
description = "Document Processing and Transcription"
long_description = """Fichero processes archival materials (documents in JPG, PDF, TIFF format), and crops, splits, enhances contrast, removes backgrounds, and then transcribes text using AI LLMs, before exporting them to Word documents.
"""
icon = "src/fichero/resources/icons/fichero"
sources = [
    "src/fichero",
]
test_sources = [
    "tests",
]
console_app = true
requires = [
    "toga>=0.5.1,<0.6.0",
    "typer>=0.16.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "srsly>=2.5.1,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "Pillow>=11.2.1,<12.0.0",
    "numpy>=2.2.0,<3.0.0",
    "opencv-python",
    "pdf2image>=1.17.0,<2.0.0",
    "pytesseract>=0.3.13,<1.0.0",
    "rawpy>=0.25.0,<1.0.0",
    "exifread>=3.3.1,<4.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "langchain>=0.3.25,<0.4.0",
    "langchain-ollama>=0.3.3,<1.0.0",
    "anthropic>=0.54.0,<1.0.0",
    "dashscope>=1.23.4,<2.0.0",
    "requests>=2.32.4,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "psutil>=7.0.0,<8.0.0",
    "celery>=5.5.3,<6.0.0",
    "redis>=6.2.0,<7.0.0",
    "openai>=1.86.0,<2.0.0",
    "accelerate>=1.7.0,<2.0.0",
    "pathvalidate>=3.2.3,<4.0.0",
    "cryptography>=45.0.0,<46.0.0",
    "ruamel.yaml>=0.18.0,<1.0.0",
    # "rembg",  # Optional: AI background removal (see TODO)
]
test_requires = [
    "pytest",
    "redis>=6.2.0,<7.0.0",
    "openai>=1.86.0,<2.0.0",
    "accelerate>=1.7.0,<2.0.0",
    "pathvalidate>=3.2.3,<4.0.0",
    "cryptography>=45.0.0,<46.0.0",
]

# Platform-specific configurations for GUI
[tool.briefcase.app.fichero.macOS]
universal_build = false
requires = [
    "toga-cocoa>=0.5.1,<0.6.0",
    "std-nslog~=1.0.3",
    "pyobjc-core>=11.1,<12.0",  # Core PyObjC support
    "pyobjc-framework-Cocoa>=11.1,<12.0",  # macOS system icons and UI integration
]

[tool.briefcase.app.fichero.linux]
requires = [
    "toga-gtk>=0.5.1,<0.6.0",
    "pygobject < 3.52.1",
]

[tool.briefcase.app.fichero.windows]
requires = [
    "toga-winforms>=0.5.1,<0.6.0",
]

# Build system requirements
[build-system]
requires = ["briefcase"]
build-backend = "briefcase.backend"

