# Optional dependencies for enhanced cross-platform support
[project.optional-dependencies]
# Enhanced mobile platform detection
mobile-i18n = [
    "jnius>=1.1.0;platform_system=='Linux'",  # Android Java bridge (when on Android/Linux)
    "pyobjc-framework-Foundation>=11.1,<12.0;platform_system=='Darwin'",  # iOS/macOS Foundation framework
]
# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
fichero-cli = "fichero.cli:main"
fichero-gui = "fichero.app:main" 